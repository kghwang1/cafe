<html lang="ko">

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2026-11-13.1">
<title>우지커피 분석</title>
<style>
:root{
  --ink:#1c2333; --ink2:#4a5468; --mute:#8792a8;
  --line:#e2e5ec; --line2:#eef0f5;
  --paper:#ffffff; --bg:#f4f2ee;
  --accent:#2f5d50; --accent-l:#e8f0ed;
  --in:#1d6b4f; --in-bg:#e9f5ef;
  --out:#b03a3a; --out-bg:#fcecec;
  --warn:#a76b19; --warn-bg:#fdf3e2;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header{background:var(--accent);color:#fff;padding:14px 0 0}
header .wrap{padding-bottom:0}
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:nowrap;padding-bottom:2px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.ttl{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.ttl #hSave{margin-left:auto;flex-shrink:0}
.ttl button.nsave{padding:6px 20px;border-radius:7px;background:#fff;color:var(--accent);
  font-size:13.5px;font-weight:700;border:0;cursor:pointer}
.ttl button.nsave:hover{background:#eef3f1}
.ttl #hSave{display:flex;gap:8px}
.ttl button.nsave.alt{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.ttl button.nsave.alt:hover{background:rgba(255,255,255,.34)}
.hd .sub{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .st{margin-left:auto;font-size:12px;opacity:.8;white-space:nowrap;flex-shrink:0}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:transparent;border:0;color:#fff;opacity:.72;cursor:pointer;
  padding:9px 15px;font-size:13.5px;font-family:inherit;white-space:nowrap;
  border-radius:8px 8px 0 0;font-weight:600;
}
nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
nav button.on{opacity:1;background:var(--bg);color:var(--accent)}

/* 열람 중임을 한눈에 — 상단은 검붉은 색·노란 글자, 배경은 연분홍 */
body.viewing{--bg:#fbeef1;background:#fbeef1}
body.viewing header{background:#6e2233}
body.viewing header h1,
body.viewing .hd .sub,
body.viewing .hd .st,
body.viewing nav button:not(.on){color:#ffe066}
body.viewing nav button.on{background:#fbeef1;color:#6e2233}
body.viewing .robar{background:#fbe3e8;border-color:#eec3ce;color:#6e2233}
body.viewing .seg button.on{background:#6e2233}
.robar{background:var(--warn-bg);border:1px solid #f0dcb8;color:#7a4f13;border-radius:var(--r);
  padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
tr.hl td{background:#fff4c9!important;transition:background 1.6s}
main{padding-top:20px}
.today-card table td, .today-card label, .today-card label span{color:#8b1a1a!important}
.today-card input[type=checkbox]{accent-color:#8b1a1a}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card>h2{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.card>h2+.hint{margin-top:0}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 14px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:290px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{background:#f8f9fb;font-weight:600;color:var(--ink2);font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw,th.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.c,th.c{text-align:center}
tr.tot td{font-weight:700;background:#f8f9fb;border-top:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2)}
tr.sub td{font-weight:600;background:#fbfbfd}
.in{color:var(--in)} .out{color:var(--out)}
input,select,textarea,button{font-family:inherit;font-size:13px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-l);border-color:var(--accent)}
input.n{text-align:right;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.g:hover{background:#f3f4f7;filter:none}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.dg{background:#fff;color:var(--out);border:1px solid #f0d6d6}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .sp{margin-left:auto}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-in{background:var(--in-bg);color:var(--in)} .b-out{background:var(--out-bg);color:var(--out)}
.b-ok{background:var(--in-bg);color:var(--in)} .b-no{background:var(--out-bg);color:var(--out)}
.b-w{background:var(--warn-bg);color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv b{font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.note{background:var(--accent-l);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:#26493f;margin-bottom:14px}
.note.w{background:var(--warn-bg);border-color:var(--warn);color:#7a4f13}
ol.steps{padding-left:18px;margin:0;font-size:13.2px}
ol.steps li{margin-bottom:7px}
ol.steps small{color:var(--mute);display:block}
.form{background:#fafbfc;border:1px solid var(--line);padding:12px;border-radius:9px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:9px}
.fr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fi{display:flex;align-items:center;gap:7px;flex:1 1 150px;min-width:0}
.fi label{font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;margin:0;flex:none}
.fi select,.fi input{flex:1;min-width:0;width:auto}
.fi.narrow{flex:0 0 auto}
.fi.narrow select{flex:none;width:82px}
.f-hang{flex:2 1 200px}
.f-date{flex:1 1 160px}
.f-amt{flex:1 1 140px}
.f-note{flex:1 1 auto}
@media(max-width:620px){
  .fr{gap:8px}
  .fi{flex:1 1 calc(50% - 4px)!important}     /* 관·항 / 날짜·금액 두 칸씩 */
  .fi.narrow{flex:1 1 calc(50% - 4px)!important}
  .fi.narrow select{flex:1;width:auto}
  .fi.f-note{flex:1 1 60%!important}          /* 산출근거 + 추가 한 줄 */
  .fi label{font-size:12px}
}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.scroll{max-height:560px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line2);border-radius:8px}
.scroll table{font-size:12.5px}
.scroll thead th{position:sticky;top:0;z-index:1}
.swipe{display:none;font-size:11.5px;color:var(--mute);margin:6px 0 0}
.nb{display:block;font-size:11px;color:var(--mute);font-weight:400}
.allprint .chips,.allprint .tools,.allprint .form,.allprint .swipe{display:none!important}
.allprint .card h2 button{display:none}
.allprint .no-ro,.allprint .form,.allprint .chips,.allprint .swipe,
.allprint [data-ed],.allprint [data-rm],.allprint [data-lib-del],
.allprint input[type=file],.allprint button{display:none!important}
.allprint input,.allprint select,.allprint textarea{
  border:0;background:transparent;padding:2px 4px;pointer-events:none}
.allsec{margin-top:26px;border-top:2px solid var(--line);padding-top:18px}
.lg-wrap{min-height:100vh;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px}
.lg-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 28px;width:100%;max-width:520px}
.lg-church{font-size:14px;color:var(--mute)}
.lg-title{font-size:25px;font-weight:700;margin:4px 0 26px;letter-spacing:-.02em;color:var(--accent)}
.lg-sec{margin-bottom:24px}
.lg-lbl{font-weight:700;font-size:14px;margin-bottom:10px}
.lg-btns{display:flex;gap:10px}
.lg-pick{flex:1;padding:14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.lg-pick:hover{border-color:var(--accent)}
.lg-pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lg-depts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.lg-dept{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink2)}
.lg-dept.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent);font-weight:600}
.lg-dept input{display:none}
.lg-name{display:flex;gap:8px;align-items:center}
.lg-name span{font-size:13.5px;font-weight:600;color:var(--ink2);flex:none}
.lg-name input{flex:1}
.lg-name input{min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line,#d8dcd6);border-radius:10px;background:#fff}
.lg-name .btn{flex:none;white-space:nowrap}
.lg-ver{text-align:right;font-size:11.5px;color:var(--mute);margin-top:14px}
.lg-qr{display:flex;gap:16px;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line2)}
.lg-qrbox{border:1px solid var(--line);border-radius:8px;padding:6px;flex:none;background:#fff}
.lg-qrtxt{min-width:0}
.lg-qrtxt b{font-size:13.5px}
.lg-qrurl{font-size:12px;color:var(--accent);word-break:break-all;margin:4px 0 8px}
.lg-go{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}
.lg-start{margin-left:auto;padding:12px 40px;font-size:16px;border-radius:10px}
.lg-start:disabled{background:#c9d0cd;cursor:default;filter:none}
.lg-busy{color:#c62828;font-weight:600;font-size:13.5px;margin:0}
.dchips{display:flex;gap:7px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  border-radius:20px;padding:5px 8px 5px 13px;font-size:13px;color:var(--ink2);background:#fff}
.dchip button{border:0;background:none;color:var(--out);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.diag{background:#f6f7f9;border:1px solid var(--line);border-radius:8px;padding:12px;
  font-size:12px;white-space:pre-wrap;word-break:break-all;margin:12px 0 0;font-family:inherit;line-height:1.6}
.dchip button.dv{font-size:11px;font-weight:600;color:var(--in);background:var(--in-bg);
  border-radius:10px;padding:2px 7px}
.dchip.nv{color:var(--mute)}
.dchip.nv button.dv{color:var(--out);background:var(--out-bg)}
.vrow[data-open2]{cursor:pointer}
.vrow[data-open2]:hover{background:var(--accent-l)}
.prchk{display:flex;gap:12px;flex-wrap:wrap;align-items:center;flex:1 1 300px}
.prchk label{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;white-space:nowrap}
.prchk input{width:auto;flex:none}
.psec{margin-top:26px;border-top:2px solid var(--line);padding-top:18px}
.cover{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:0 34px;text-align:center;min-height:640px;position:relative}
.cv-head{position:absolute;top:25%;left:0;right:0}         /* 제목 — 용지 높이 1/4 */
.cv-body{position:absolute;top:33.3%;left:0;right:0}       /* 제출자료 — 1/3 */
.cv-church{font-size:17px;color:var(--ink2)}
.cv-title{font-size:26px;font-weight:700;margin:10px 0 0;letter-spacing:-.02em}
.cv-dates{text-align:left;max-width:420px;margin:34px auto 0;font-size:15px;line-height:2;padding-left:6px}
.cv-sign,.cv-list{text-align:left;max-width:420px;margin:0 auto}
.cv-sign{margin-top:34px}
.cv-lbl{font-weight:700;font-size:15px;margin-bottom:10px}
.cv-row{display:flex;gap:30px;font-size:15px;padding-left:6px}
.cv-list ol{margin:0;padding-left:22px;font-size:15px;line-height:2}
.opb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;
  border-top:1px dashed var(--line);padding-top:12px}
.opb select{width:auto;max-width:240px;flex:1 1 160px}
.seg{display:inline-flex;gap:0;margin-left:10px;vertical-align:middle;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:#fff;border:0;padding:4px 14px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.vlist{border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:4px}
.vrow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.vrow:last-child{border-bottom:0}
.vrow.on{background:var(--accent-l)}
.vrow.hov{background:#f5f7f9}
.vrow.dim{color:#b3bac6}
.vrow.dim .hint{color:#c6ccd6}
.vrow.dim .vname{cursor:default}
.vname{cursor:pointer}
.vinfo{background:var(--accent-l);border:1px solid #cfe6da;border-radius:9px;padding:12px 14px;margin-bottom:14px}
.vinfo .kv{border-bottom:1px dashed #bfd9ce;padding:4px 0}
.vtitle{font-weight:700;color:#26493f;margin-bottom:6px;font-size:14px}
.vrow input{width:auto;flex:none}
.imgov{position:fixed;inset:0;background:#000;z-index:99;display:flex;
  align-items:stretch;justify-content:flex-start;flex-direction:column;gap:0;padding:0;cursor:default}
.imgov img{max-width:100%;max-height:100%;background:#fff}
.imgov .cls{color:#fff;font-size:14px;font-weight:600}
.imgov .ovbar{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between;
  padding:8px 10px;background:rgba(0,0,0,.6);flex:none}
.imgov .ovn{color:#fff;font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgov .ovx,.imgov .ovopen{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:7px;padding:7px 14px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:none}
.imgov .ovmain{display:flex;align-items:center;gap:0;width:100%;flex:1;min-height:0;
  justify-content:center;position:relative}
.imgov .ovp,.imgov .ovnx{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:50%;
  width:44px;height:44px;font-size:26px;line-height:1;cursor:pointer;flex:none;
  position:absolute;top:50%;margin-top:-22px;z-index:2}
.imgov .ovp{left:6px} .imgov .ovnx{right:6px}
.imgov .ovwrap{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;
  justify-content:center;touch-action:none}
.imgov .ovwrap img{transition:transform .12s;transform-origin:center center;
  user-select:none;-webkit-user-drag:none}
.imgov .ovpdf{width:100%;height:100%;border:0;background:#fff}
.imgov .ovz{display:flex;align-items:center;gap:6px}
.imgov .ovz button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:7px;padding:6px 11px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.imgov .ovpc{color:#fff;font-size:12.5px;min-width:44px;text-align:center}
.imgov .ovtip{color:#cfd6d3;font-size:12px;text-align:center;padding:6px 10px;
  background:rgba(0,0,0,.6);flex:none}
@media(max-width:560px){
  .imgov .ovz button{padding:6px 8px;font-size:13px}
  .imgov .ovbar{gap:6px;padding:6px 8px}
  .imgov .ovn{font-size:13px}
  .imgov .ovtip{font-size:11px;padding:5px 8px}
}
.thumbs{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.thumbs .cnt{font-size:11.5px;color:var(--mute)}
.pdfch{display:inline-block;width:26px;height:26px;line-height:26px;border-radius:4px;
  border:1px solid var(--line);background:#fdecec;color:#c62828;font-size:9px;font-weight:700;
  text-align:center;cursor:pointer;vertical-align:middle}
.thumb{width:26px;height:26px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer;vertical-align:middle}
.pic{display:flex;align-items:center;gap:6px}
.pic img{width:30px;height:30px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}

@media screen and (max-width:760px){
  .swipe{display:block}
  .card{overflow-x:auto}
  table.lg{min-width:734px}          /* 출납부 — 항목 칸을 넉넉히 */
  table.wt{min-width:560px}          /* 결산·새해예산요구 */
  table.wb{min-width:440px}          /* 예산 */
  table.wn{min-width:700px}          /* 새해예산요구 */
  table.ws{min-width:290px}          /* 현재 상황·소계 */
  table.pl{min-width:560px}          /* 지출예정 내역 */
  table.ml{min-width:386px}          /* 자료 */
  table.wp{min-width:480px}          /* 지출예정 소계 */
  table.we{min-width:400px}          /* 결산 (수입·지출 같은 폭) */
  table.wi2{min-width:200px}         /* 수입 계획 */
}
.sign{display:flex;gap:26px;justify-content:flex-end;margin-top:26px;font-size:12.5px;color:var(--ink2)}
.sign div{border-top:1px solid var(--ink2);padding-top:5px;min-width:110px;text-align:center}
.print-only{display:none}
.phead{text-align:center}
.ph-c{font-size:12px;color:var(--mute)}
.ph-t{font-size:19px;font-weight:700;margin:2px 0}
.ph-s{font-size:12px;color:var(--mute)}

@page{ size:A4 portrait; margin:12mm 10mm }
@media print{
  html,body{background:#fff;color:#000}
  body{font-size:9.5pt;line-height:1.35}
  header,nav,.tools,.form,.chips,.no-print,input[type=file]{display:none!important}
  .print-only{display:block!important}
  .wrap{max-width:none;width:100%;padding:0;margin:0}
  main{padding-top:0}
  .card{border:0;border-radius:0;padding:0;margin:0 0 7mm;background:none}
  .row{display:block}
  .col{width:100%!important;min-width:0!important;flex:none!important;margin:0 0 6mm}
  /* 예산·결산은 두 표를 좌우로 나란히 */
  .row.two{display:flex!important;gap:6mm;align-items:flex-start}
  .row.two>.col{width:calc(50% - 3mm)!important;flex:1 1 0!important;margin:0;break-inside:avoid}
  .row.two table{font-size:8.2pt}
  .row.two th,.row.two td{padding:2px 3px}
  .row.two table{min-width:0!important;table-layout:auto}
  .row.two th[style],.row.two td[style]{width:auto!important}
  .row.two table.wn{font-size:7.6pt}

    if(few.length===wd.length) out.w.push('아직 요일마다 한 번씩뿐이라 위 평균은 그날 매출 그대로입니다. 주가 쌓이면 요일 차이가 또렷해집니다.');
    else if(few.length) out.w.push(`${few.join('·')}요일은 아직 한 번뿐이라 평균으로 보기 이릅니다.`);
    out.w.push(`지금까지 ${wks.length}주 치가 쌓였습니다. 위 평균은 전체 기간이고, 그래프는 이번 주(막대)와 지난 주들(주마다 선)을 보여 줍니다.`);
  }
  /* 월별 */
  const ms = mon==='ALL' ? sMonths() : [mon];
  ms.forEach(m=>{ const s=sMonthStat(m);
    out.m.push(`${sMonLabel(m)}: ${s.n}일 · 합계 ${won(s.tot)}원 · 일평균 ${won(s.avg)}원 · 최고일 ${sLab(s.best)}`) });
  if(mon!=='ALL'){
    const all=sMonths(), i=all.indexOf(mon);
    if(i>0){ const a=sMonthStat(mon), b=sMonthStat(all[i-1]);
      out.m.push(`전월(${sMonLabel(all[i-1])}) 일평균 ${won(b.avg)}원 대비 ${Math.round((a.avg/b.avg-1)*100)}% ${a.avg>=b.avg?'증가':'감소'}했습니다.`) }
    else out.m.push('비교할 이전 달 자료가 아직 없습니다. 다음 달부터 전월 대비가 자동으로 나옵니다.');
  } else if(ms.length<2){
    out.m.push('아직 한 달 치뿐이라 월별 비교는 다음 달부터 나옵니다. 계절별 비교는 3개월 이상 쌓이면 가능합니다.');
  } else {
    const t = ms.map(sMonthStat).reduce((a,s)=>a+s.tot,0);
    out.m.push(`누계 합계 ${won(t)}원 (${sDays().length}일).`);
  }
  return out;
}

/* 분석 표 — 일별 · 요일별 · 월별 */
const hiLo = (arr, f) => { const v = arr.map(f).filter(x=>x!=null); return { hi: Math.max(...v), lo: Math.min(...v), one: v.length<2 } };
const mark = (v, h) => h.one || v==null ? '' : v===h.hi ? 'in' : v===h.lo ? 'out' : '';
const star = d => '';   // sLab 이 이미 * 를 붙임
// 기간(주) 줄 만들기: 고른 기간의 날짜를 월~일 주로 묶음
function anWeeks(days){ return sWeeks(days).map(k=>({k, ds:days.filter(d=>monOf(d)===k)})) }
const dl = d => `${sLab(d)}<br><b>${won(sTotal(d))}</b>`;
function anDayTable(days, label){
  if(!days.length) return '<p class="hint">자료가 없습니다</p>';
  const s=days.reduce((a,d)=>a+sTotal(d),0); let hi=days[0], lo=days[0];
  days.forEach(d=>{ if(sTotal(d)>sTotal(hi)) hi=d; if(sTotal(d)<sTotal(lo)) lo=d });
  return `<div class="scroll"><table class="ws"><thead><tr><th class="nw">기간</th><th class="nw">최고</th><th class="nw">최저</th><th class="n nw">평균</th></tr></thead><tbody>
    <tr><td class="nw">${label}<br><span class="hint" style="margin:0">${days.length}일</span></td><td class="nw in">${dl(hi)}</td><td class="nw out">${days.length>1?dl(lo):'-'}</td><td class="n nw"><b>${won(s/days.length)}</b></td></tr>
  </tbody></table></div>`;
}
function anWdTable(days, label){
  if(!days.length) return '';
  const tot = WD_LAB.map(()=>({s:0,n:0})); days.forEach(d=>{ const x=tot[wdIdx(d)]; x.s+=sTotal(d); x.n++ });
  const avg = tot.map(x=>x.n?x.s/x.n:null), h = hiLo(avg.map(v=>({v})), x=>x.v);
  const all = days.reduce((a,d)=>a+sTotal(d),0)/days.length;
  return `<div class="scroll"><table class="ws"><thead><tr><th class="nw">기간</th>${WD_LAB.map(w=>`<th class="n">${w}</th>`).join('')}<th class="n">평균</th></tr></thead><tbody>
    <tr><td class="nw">${label}</td>${avg.map(v=>`<td class="n nw ${mark(v,h)}">${v==null?'-':won(v)}</td>`).join('')}<td class="n nw"><b>${won(all)}</b></td></tr>
  </tbody></table></div><p class="swipe">← 표를 옆으로 밀어 보세요 →</p>
  <p class="hint" style="margin:6px 0 0">요일마다 평균 매출입니다. 가장 높은 요일은 초록, 가장 낮은 요일은 빨강입니다.</p>`;
}
function anMonTable(){
  const ms = sMonths(); if(!ms.length) return '';
  const st = ms.map(m=>{ const ds=sDays().filter(d=>d.slice(0,7)===m), a=sMonthStat(m);
    let lo=ds[0]; ds.forEach(d=>{ if(sTotal(d)<sTotal(lo)) lo=d }); return Object.assign(a,{lo}) });
  const all = sDays(), tot = st.reduce((a,x)=>a+x.tot,0), n = st.reduce((a,x)=>a+x.n,0);
  let bd=all[0], wd=all[0]; all.forEach(d=>{ if(sTotal(d)>sTotal(bd)) bd=d; if(sTotal(d)<sTotal(wd)) wd=d });
  const hT = hiLo(st, x=>x.tot), hA = hiLo(st, x=>x.avg);
  return `<div class="scroll"><table class="ws"><thead><tr><th class="nw">달</th><th class="n">영업일</th><th class="n">합계</th><th class="n">하루 평균</th>
      <th class="n">전월 대비</th><th class="nw">최고 매출일</th><th class="nw">최저 매출일</th></tr></thead><tbody>
    ${st.map((a,i)=>{ const p=i?st[i-1]:null, gap=p&&p.avg?Math.round((a.avg/p.avg-1)*100):null;
      return `<tr><td class="nw">${a.m.slice(0,4)}년 ${sMonLabel(a.m)}</td><td class="n">${a.n}일</td><td class="n ${mark(a.tot,hT)}">${won(a.tot)}</td><td class="n ${mark(a.avg,hA)}">${won(a.avg)}</td>
        <td class="n ${gap!=null&&gap<0?'out':gap!=null?'in':''}">${gap==null?'-':(gap>0?'+':'')+gap+'%'}</td>
        <td class="nw in">${sLab(a.best)} ${won(sTotal(a.best))}</td><td class="nw out">${sLab(a.lo)}${star(a.lo)} ${won(sTotal(a.lo))}</td></tr>` }).join('')}
    <tr class="sub"><td>합계</td><td class="n">${n}일</td><td class="n">${won(tot)}</td><td class="n">${won(n?tot/n:0)}</td><td></td>
      <td class="nw in">${sLab(bd)} ${won(sTotal(bd))}</td><td class="nw out">${sLab(wd)}${star(wd)} ${won(sTotal(wd))}</td></tr>
    <tr class="sub"><td>월 평균</td><td class="n">${(n/st.length).toFixed(1)}일</td><td class="n">${won(tot/st.length)}</td><td></td><td></td><td></td><td></td></tr>
  </tbody></table></div><p class="swipe">← 표를 옆으로 밀어 보세요 →</p>
  ${ms.length<2?'<p class="hint" style="margin:6px 0 0">달이 하나뿐이면 높고 낮음 색은 표시하지 않습니다. 개업 첫 달은 영업일이 적어 합계가 작게 나옵니다.</p>':''}`;
}
function bindSales(){

function salesDayBtns(days){

      <span style="width:8px;height:8px;border-radius:50%;background:${on?'rgba(255,255,255,.9)':c};display:inline-block"></span>${sLab(d)}</button>` }).join('');

  lg.querySelectorAll('[data-sday]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.sday; if(salesOff[d]) delete salesOff[d]; else salesOff[d]=1; drawSales();

function drawSales(){
  salesCharts.forEach(c=>{ try{ c.destroy() }catch(e){} }); salesCharts=[];
  if(!document.getElementById('slC1')) return;
  const days = sSel();
  const lab = SALES_HOURS.map(h=>String(h));
  const base = (ytitle)=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
    tooltip:{callbacks:{label:c=> (c.dataset.label? c.dataset.label+' ':'')+kWon(c.parsed.y)}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{beginAtZero:true,grid:{color:'#e6e4de'},ticks:{font:{size:11}},title:{display:!!ytitle,text:ytitle}}}});
  const mk=(id,cfg)=>salesCharts.push(new Chart(document.getElementById(id),cfg));
  /* 1·2번 — 한 시간을 수평선 한 줄로 긋는다 (9시 매출이면 9~10시 사이).
     세로 연결선은 없고, 선 두께는 매출에 비례한다 (BASE_K 천원 = 기준 두께) */
  const seg = (h, k, color, w, label) => ({label:label, data:[{x:h,y:k},{x:h+1,y:k}],
    borderColor:color, borderWidth:Math.max(1, +(w*k/BASE_K).toFixed(2)), borderCapStyle:'butt',
    pointRadius:0, pointHitRadius:14, fill:false, tension:0});
  const hourOpts = tip => ({responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:tip},
    scales:{x:{type:'linear',min:SALES_HOURS[0],max:SALES_HOURS[SALES_HOURS.length-1]+1,offset:false,
        grid:{display:false},border:{display:true},
        ticks:{stepSize:1,autoSkip:false,font:{size:11},callback:v=>v}},
      y:{beginAtZero:true,grid:{color:'#e6e4de'},ticks:{font:{size:11}}}}});
  const segs = [];
  sHourAvg(days).forEach((v,i)=>{ if(v==null) return;
    const h = SALES_HOURS[i], k = v/1000;
    segs.push(seg(h, k, '#2a78d6', LINE_W, h+'시~'+(h+1)+'시'));
  });
  mk('slC1',{type:'line',data:{datasets:segs},options:hourOpts({displayColors:false,
      callbacks:{title:it=>it[0].dataset.label, label:c=>kWon(c.parsed.y)}})});
  const shown = days.filter(sOn);
  salesDayBtns(days);
  const segs2 = [];
  shown.forEach(d=>{ const c = sColor(d, days);
    SALES[d].forEach((v,i)=>{ const h = SALES_HOURS[i];
      if(sPart(d,h) || (h<9 && v===0) || (h===22 && v===0)) return;
      const s2 = seg(h, Math.min(v/1000, Y2_MAX), c, LINE_W2, sLab(d)+' '+h+'시~'+(h+1)+'시');
      s2.borderWidth = Math.max(1, +(LINE_W2*(v/1000)/BASE_K).toFixed(2)); s2.realK = v/1000;   // 180천원 넘으면 맨 위에 그리고, 금액은 실제 값으로
      segs2.push(s2);
    });
  });
  const o2 = hourOpts({displayColors:true,
      callbacks:{title:it=>it[0].dataset.label, label:c=>kWon(c.dataset.realK)+(c.dataset.realK>Y2_MAX?' (축 위로 넘침)':'')}});
  o2.scales.y.min = 0; o2.scales.y.max = Y2_MAX; o2.scales.y.ticks.stepSize = 30;
  mk('slC2',{type:'line',data:{datasets:segs2},options:o2});
  /* 3번 — 이번 주는 막대, 지난 주들은 주마다 선 하나 (선택한 달과 상관없이 전체 자료에서) */
  const cw = curWeek(sDays());
  const wv = (mon0,j)=>{ const d=dayOfWeek(mon0,j); return SALES[d] ? sTotal(d)/1000 : null };
  if(cw){
    const past = sWeeks(sDays()).filter(k=>k<cw).reverse();               // 가까운 주부터
    const WCOL = ['#eb6834','#1baf7a','#6250d6','#eda100','#e34948','#0e8fa8','#8a5a2b','#c2417a','#4b7f2f','#7a7a7a'];
    const wk = past.map((k,i)=>({k, col:WCOL[i%WCOL.length], name:(i===0?'지난주':i+1+'주 전')+' '+weekSpan(k), w:i===0?LINE_W:Math.max(1.5,LINE_W*0.6)}));
    const lg4 = document.getElementById('slLg4');
    if(lg4) lg4.innerHTML = [['이번 주 '+weekSpan(cw),'#2a78d6',1]].concat(wk.map(x=>[x.name,x.col,0]))
      .map(x=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;box-sizing:border-box;${x[2]?'border:2px solid '+x[1]:'background:'+x[1]}"></span>${x[0]}</span>`).join('');
    const wkOf = [cw].concat(wk.map(x=>x.k));
    mk('slC4',{data:{labels:WD_LAB,datasets:[
      {type:'bar',label:'이번 주',data:WD_LAB.map((_,j)=>wv(cw,j)),backgroundColor:'rgba(42,120,214,0)',borderColor:'#2a78d6',borderWidth:2,borderSkipped:false,borderRadius:5,maxBarThickness:52,order:9}]
      .concat(wk.map((x,i)=>({type:'line',label:x.name,data:WD_LAB.map((_,j)=>wv(x.k,j)),borderColor:x.col,backgroundColor:x.col,borderWidth:x.w,
        tension:CURVE,pointRadius:i===0?4:3,spanGaps:false,order:i+1})))},
      options:Object.assign(base(''),{plugins:{legend:{display:false},tooltip:{displayColors:true,
        callbacks:{title:()=>'',
          label:c=>{ const d=dayOfWeek(wkOf[c.datasetIndex],c.dataIndex);       // 예: 10. 27. (화), 745,000원
            return (+d.slice(5,7))+'. '+(+d.slice(8,10))+'. ('+sDow(d)+'), '+(c.parsed.y==null?'자료 없음':kWon(c.parsed.y)) }}}}})});
  }
  /* 5번 — 월별 합계·하루 평균 (전체 달) */
  if(document.getElementById('slC5')){
    const ms = sMonths(), st = ms.map(sMonthStat);
    const lg5 = document.getElementById('slLg5');
    if(lg5) lg5.innerHTML = [['순매출 합계','#2f5d50'],['하루 평균','#eda100']]
      .map(x=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:${x[1]}"></span>${x[0]}</span>`).join('');
    mk('slC5',{type:'line',data:{labels:ms.map(m=>m.slice(0,4)+'년 '+sMonLabel(m)),datasets:[
      {label:'순매출 합계',data:st.map(x=>x.tot/1000),borderColor:'#2f5d50',borderWidth:LINE_W,
        tension:CURVE,pointRadius:5,pointBackgroundColor:'#2f5d50'},
      {label:'하루 평균',data:st.map(x=>x.avg/1000),borderColor:'#eda100',borderWidth:LINE_W,
        borderDash:[5,4],tension:CURVE,pointRadius:4,pointBackgroundColor:'#eda100'}]},
      options:Object.assign(base(''),{plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>c.dataset.label+' '+kWon(c.parsed.y)}}}})});
  }
}


/* ── 지출분석 ──
   매출: 위 SALES 자료에서 주별로 자동 합계
   지출: 본사 주문(주별 입력) · 급여(근무관리에서 자동) · 전기세 · 수도세 · 추가 항목 — 근무관리 서버(/cost)에 달마다 저장 */
const API = 'https://oozy-work.kghwang1.workers.dev';
const tokenOf = () => { try { return localStorage.getItem('oozyToken') || '' } catch(e){ return '' } };
async function api(path, body){
  const r = await fetch(API+path, { method: body?'POST':'GET', headers:{'Content-Type':'application/json','X-Token':tokenOf()}, body: body?JSON.stringify(body):undefined });
  let j = {}; try{ j = await r.json() }catch(e){}
  if(!r.ok || j.error) throw new Error(j.error || ('서버 오류 '+r.status));
  return j;
}
const todayK = () => isoOf(new Date());
let costMon = '', COST = null, costBusy = false, costDirty = false;
function costMonths(){
  const s = new Set(sMonths().filter(m=>m!=='ALL')); s.add(todayK().slice(0,7));
  return [...s].sort().reverse();
}
function monWeeks(mon){                         // 그 달에 하루라도 걸친 주 (월요일 기준)
  const [y,m] = mon.split('-').map(Number), last = new Date(y, m, 0).getDate(), out = [];
  for(let k = monOf(mon+'-01'); k <= mon+'-'+String(last).padStart(2,'0'); k = dayOfWeek(k,7)) out.push(k);
  return out;
}
function weekSales(mon, wk){                    // 그 주 가운데 이달에 속한 날의 매출
  let tot = 0, n = 0, part = false;
  for(let j=0;j<7;j++){ const d = dayOfWeek(wk,j); if(d.slice(0,7)!==mon || !SALES[d]) continue; tot += sTotal(d); n++; if(SALES_PART[d]) part = true; }
  return { tot, n, part };
}
const wkRange = (mon, wk) => {                  // 이달 안쪽만: 11/01 ~ 11/02
  let a = wk, z = dayOfWeek(wk,6); if(a.slice(0,7)<mon) a = mon+'-01'; if(z.slice(0,7)>mon) { const [y,m]=mon.split('-').map(Number); z = mon+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
  return a.slice(5,7)+'/'+a.slice(8,10)+' ~ '+z.slice(5,7)+'/'+z.slice(8,10);
};
const RENT_DEF = 1100000, VAT_RATE = 0.1;      // 월세 기본값, 부가가치세 = 매출의 10%
const numIn = v => { const n = Math.round(+String(v||'').replace(/[^\d]/g,'')); return n>0 ? n : 0 };
const fmtIn = n => n ? won(n) : '';
function vCost(){
  const ms = costMonths(); if(ms.indexOf(costMon)<0) costMon = ms[0];
  const mon = costMon, wks = monWeeks(mon), mlab = (+mon.slice(5,7))+'월';
  const sw = wks.map(k=>weekSales(mon,k)), stot = sw.reduce((a,x)=>a+x.tot,0), sdays = sw.reduce((a,x)=>a+x.n,0);
  const head = `<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <b>기간</b>
    <select id="cMon" style="width:auto;min-width:140px;font-size:15px">${ms.map(m=>`<option value="${m}" ${m===mon?'selected':''}>${m.slice(0,4)}년 ${(+m.slice(5,7))}월</option>`).join('')}</select>
    <span class="hint" style="margin:0" id="cStat"></span></div>`;
  if(!COST || COST.month!==mon) return head+`<div class="card"><p class="hint" style="margin:0">불러오는 중...</p></div>`;
  if(COST.err) return head+`<div class="card"><p class="out" style="margin:0 0 10px">${esc(COST.err)}</p>
    ${/알 수 없는 요청/.test(COST.err)?'<p class="hint">지출분석 저장 기능이 아직 서버에 없습니다. Cloudflare의 oozy-work에 새 worker.js를 배포해 주세요.</p>':''}
    <button class="btn g sm" id="cRetry">다시 불러오기</button></div>`;
  const d = COST.data || {}, hq = d.hq || {}, ex = (d.extra && d.extra.length) ? d.extra : [];
  const pay = COST.pay || { total:0, staff:[] };
  return head + `
  <div class="card"><h2>${mlab} 매출 <span class="hint" style="display:inline">매출분석 자료에서 자동</span></h2>
    <table><thead><tr><th>주</th><th>기간</th><th class="c">영업일</th><th class="n">순매출</th></tr></thead><tbody>
    ${wks.map((k,i)=>`<tr><td>${i+1}주</td><td class="nw">${wkRange(mon,k)}</td><td class="c">${sw[i].n||'-'}</td><td class="n">${sw[i].n?won(sw[i].tot)+'원'+(sw[i].part?' *':''):'-'}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">매출 계</td><td class="c">${sdays}일</td><td class="n" id="cSales" data-v="${stot}">${won(stot)}원</td></tr></tbody></table>
    ${sw.some(x=>x.part)?'<p class="hint" style="margin:8px 0 0">* 영수증을 일찍 뽑아 일부 시간이 빠진 날이 있는 주 (실제는 조금 더 큼)</p>':''}
    ${sdays?'':'<p class="hint" style="margin:8px 0 0">이 달 매출 자료가 아직 없습니다. 영수증 사진을 보내 주시면 넣어 드립니다.</p>'}</div>

  <div class="card"><h2>${mlab} 지출</h2>
    <p class="hint">금액을 넣고 아래 <b>저장</b>을 누르세요. 급여는 근무관리에서 계산한 금액(주휴 포함)을 자동으로 가져옵니다. 월세는 110만 원, 부가가치세는 매출 계의 10%가 기본으로 들어갑니다 (고쳐 쓸 수 있음).</p>
    <h3 style="font-size:14px;margin:6px 0 6px">본사 주문금액 <span class="hint" style="display:inline">원두 등 · 주별</span></h3>
    <table><thead><tr><th>주</th><th>기간</th><th class="n" style="width:30%">금액(원)</th><th style="width:30%">메모</th></tr></thead><tbody>
    ${wks.map((k,i)=>`<tr><td style="white-space:nowrap">${i+1}주</td><td class="nw">${wkRange(mon,k)}</td>
      <td><input type="text" class="n" inputmode="numeric" data-hq="${k}" value="${fmtIn((hq[k]||{}).amt)}" placeholder="0"></td>
      <td><input type="text" data-hqm="${k}" maxlength="60" value="${esc((hq[k]||{}).memo||'')}" placeholder="예: 원두 4kg"></td></tr>`).join('')}
    <tr class="sub"><td colspan="2">본사 주문 계</td><td class="n" id="cHqT"></td><td></td></tr></tbody></table>

    <h3 style="font-size:14px;margin:18px 0 6px">급여 <span class="hint" style="display:inline">근무관리에서 자동 · ${pay.confirmed?'급여 확정됨':'확정 전 (근무기록이 바뀌면 같이 바뀜)'}</span></h3>
    <table><tbody>
    <tr class="sub"><td>급여 계</td><td class="n" id="cPay" data-v="${pay.total}">${won(pay.total)}원</td></tr></tbody></table>

    <h3 style="font-size:14px;margin:18px 0 6px">공과금 · 기타</h3>
    <table><tbody>
      <tr><td style="width:40%">월세<br><span class="hint" style="margin:0">기본 1,100,000원</span></td><td><input type="text" class="n" inputmode="numeric" id="cRent" value="${fmtIn(d.rent==null?RENT_DEF:d.rent)}" placeholder="0"></td><td style="width:44px"></td></tr>
      <tr><td>부가가치세<br><span class="hint" style="margin:0" id="cVatH">${d.vat==null?'매출의 10% 자동':'직접 입력'}</span></td>
        <td><input type="text" class="n" inputmode="numeric" id="cVat" value="${fmtIn(d.vat==null?Math.round(stot*VAT_RATE):d.vat)}" placeholder="0" data-auto="${d.vat==null?1:''}"></td>
        <td><button class="btn g sm" id="cVatAuto" title="매출의 10%로 되돌리기" style="${d.vat==null?'visibility:hidden':''}">10%</button></td></tr>
      <tr><td>전기세</td><td><input type="text" class="n" inputmode="numeric" id="cElec" value="${fmtIn(d.elec)}" placeholder="0"></td><td style="width:44px"></td></tr>
      <tr><td>수도세</td><td><input type="text" class="n" inputmode="numeric" id="cWater" value="${fmtIn(d.water)}" placeholder="0"></td><td></td></tr>
      ${ex.map((x,i)=>`<tr data-exr><td><input type="text" data-exn maxlength="30" value="${esc(x.name)}" placeholder="항목 이름 (예: 가스비)"></td>
        <td><input type="text" class="n" inputmode="numeric" data-exa value="${fmtIn(x.amt)}" placeholder="0"></td>
        <td><button class="btn dg sm" data-exdel="${i}" title="이 항목 지우기">✕</button></td></tr>`).join('')}
    </tbody></table>
    <button class="btn g sm" id="cAdd" style="margin-top:8px">+ 항목 추가</button>

    <table style="margin-top:16px"><tbody><tr class="tot"><td>지출 계</td><td class="n" id="cCost"></td></tr></tbody></table>
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
      <button class="btn" id="cSave">저장</button><span class="hint" style="margin:0" id="cMsg">${d.at?'마지막 저장 '+new Date(d.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span></div>
  </div>

  <div class="card"><h2>${mlab} 요약</h2><div id="cSum"></div></div>`;
}
function costCollect(){
  const q = s => document.querySelector(s), hq = {};
  document.querySelectorAll('[data-hq]').forEach(i=>{ const k=i.dataset.hq, a=numIn(i.value), m=(document.querySelector(`[data-hqm="${k}"]`)||{}).value||'';
    if(a || m.trim()) hq[k] = { amt:a, memo:m.trim() } });
  const extra = [...document.querySelectorAll('[data-exr]')].map(r=>({ name:r.querySelector('[data-exn]').value.trim(), amt:numIn(r.querySelector('[data-exa]').value) }));
  const vi = q('#cVat');
  return { hq, elec:numIn(q('#cElec').value), water:numIn(q('#cWater').value), rent:numIn(q('#cRent').value),
    vat: vi.dataset.auto ? null : numIn(vi.value), extra };
}
function costCalc(){
  if(!document.getElementById('cCost')) return;
  const d = costCollect(), sales = +document.getElementById('cSales').dataset.v, pay = +document.getElementById('cPay').dataset.v;
  const hqT = Object.values(d.hq).reduce((a,x)=>a+x.amt,0), exT = d.extra.reduce((a,x)=>a+x.amt,0);
  const vi = document.getElementById('cVat'), vat = vi.dataset.auto ? Math.round(sales*VAT_RATE) : d.vat;
  if(vi.dataset.auto && document.activeElement!==vi) vi.value = fmtIn(vat);
  const cost = hqT + pay + d.rent + vat + d.elec + d.water + exT, left = sales - cost;
  document.getElementById('cHqT').textContent = won(hqT)+'원';
  document.getElementById('cCost').textContent = won(cost)+'원';
  const pc = v => sales ? ' ('+(v/sales*100).toFixed(1)+'%)' : '';
  const rows = [['본사 주문',hqT],['급여',pay],['월세',d.rent],['부가가치세',vat],['전기세',d.elec],['수도세',d.water]].concat(d.extra.filter(x=>x.name||x.amt).map(x=>[x.name||'(이름 없음)',x.amt]));
  document.getElementById('cSum').innerHTML = `<table><tbody>
    <tr><td><b>매출 계</b></td><td class="n"><b class="in">${won(sales)}원</b></td></tr>
    ${rows.map(r=>`<tr><td style="padding-left:18px">${esc(r[0])}</td><td class="n">${won(r[1])}원<span class="hint" style="margin:0">${pc(r[1])}</span></td></tr>`).join('')}
    <tr class="sub"><td><b>지출 계</b></td><td class="n"><b class="out">${won(cost)}원</b><span class="hint" style="margin:0">${pc(cost)}</span></td></tr>
    <tr class="tot"><td>남은 금액 (매출 − 지출)</td><td class="n ${left<0?'out':'in'}">${left<0?'−':''}${won(Math.abs(left))}원<span class="hint" style="margin:0">${pc(left)}</span></td></tr>
  </tbody></table><p class="hint" style="margin:8px 0 0">( ) 안은 매출 대비 비율입니다. 카드 수수료·임대료·세금 등 넣지 않은 비용은 빠져 있으니, 필요하면 <b>항목 추가</b>로 넣으세요.</p>`;
  const st = document.getElementById('cStat'); if(st) st.textContent = `매출 ${won(sales)}원 · 지출 ${won(cost)}원`;
}
async function costLoad(){
  costBusy = true;
  try{ const j = await api('/cost?month='+costMon); COST = { month:costMon, data:j.data||{}, pay:j.pay }; }
  catch(e){ COST = { month:costMon, err:'불러오지 못했습니다: '+e.message }; }   // 실패해도 그 달로 표시 (다시 불러오기 반복 방지)
  costBusy = false; costDirty = false;
  if(tab==='cost') render();
}
function bindCost(){
  const sel = document.getElementById('cMon');
  sel.onchange = () => { if(costDirty && !confirm('저장하지 않은 내용이 있습니다. 다른 달로 넘어갈까요?')) { sel.value = costMon; return } costMon = sel.value; COST = null; render(); costLoad(); };
  if(!COST || COST.month!==costMon){ if(!costBusy) costLoad(); return }
  if(COST.err){ document.getElementById('cRetry').onclick = () => { COST = null; render(); }; return }
  const v = document.getElementById('view');
  v.oninput = e => { const i = e.target; if(i.matches('input.n')){ const pos = i.value.length - i.selectionStart; const n = numIn(i.value); i.value = n ? won(n) : ''; try{ const p2 = Math.max(0, i.value.length-pos); i.setSelectionRange(p2,p2) }catch(_){} }
    if(i.id==='cVat' && i.dataset.auto){ i.dataset.auto=''; document.getElementById('cVatH').textContent='직접 입력'; document.getElementById('cVatAuto').style.visibility=''; }
    costDirty = true; costCalc(); };
  document.getElementById('cVatAuto').onclick = () => { const i=document.getElementById('cVat'); i.dataset.auto='1';
    document.getElementById('cVatH').textContent='매출의 10% 자동'; document.getElementById('cVatAuto').style.visibility='hidden'; costDirty = true; costCalc(); };
  document.getElementById('cAdd').onclick = () => { COST.data = Object.assign({}, COST.data, costCollect()); COST.data.extra = COST.data.extra.concat([{name:'',amt:0}]); costDirty = true; render();
    const ns = document.querySelectorAll('[data-exn]'); if(ns.length) ns[ns.length-1].focus(); };
  document.querySelectorAll('[data-exdel]').forEach(b=>b.onclick=()=>{ COST.data = Object.assign({}, COST.data, costCollect()); COST.data.extra.splice(+b.dataset.exdel,1); costDirty = true; render(); });
  document.getElementById('cSave').onclick = async () => {
    const b = document.getElementById('cSave'), msg = document.getElementById('cMsg'); b.disabled = true; msg.textContent = '저장 중...';
    try{ const j = await api('/cost', { month:costMon, data:costCollect() }); COST.data = j.data; costDirty = false; render();
      document.getElementById('cMsg').textContent = '저장했습니다 ✓'; }
    catch(e){ b.disabled = false; msg.innerHTML = '<span class="out">저장 실패: '+esc(e.message)+'</span>'; }
  };
  costCalc();
}
window.addEventListener('beforeunload', e => { if(costDirty){ e.preventDefault(); e.returnValue = '' } });

render();
(async function(){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r = await fetch(location.pathname+'?check='+Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
    if(m && m[1]!==APP_VERSION){
      const d=document.createElement('div'); d.className='robar'; d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9';
      d.innerHTML='<b>새 버전이 있습니다.</b><button class="btn sm" style="margin-left:auto">새로고침</button>';
      d.querySelector('button').onclick=()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
      document.body.appendChild(d);
    }
  }catch(e){}
})();
