<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>우지커피 근무관리</title>
<style>
:root{--bg:#f5f2ee;--card:#fff;--ink:#231f1c;--sub:#7a726b;--line:#e5dfd8;--brand:#5b3a29;--ok:#1d8a4b;--warn:#d98200;--bad:#d32f2f;--gap:#fde3e3}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#ece6df;color:var(--ink)}
button.pri{background:var(--brand);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
.homebtn{display:inline-flex;align-items:center;padding:6px 11px;border-radius:10px;background:#ece6df;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
input[type=time]::-webkit-datetime-edit-ampm-field{color:#f5b800;font-weight:700}   /* 오전·오후 노란색 */
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.top h1{font-size:18px;margin:0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.muted{color:var(--sub);font-size:13px}
.big{font-size:26px;font-weight:700}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#eee;margin-left:4px}
.badge.bad{background:#fde0e0;color:var(--bad)}.badge.warn{background:#fff1d6;color:#9a5c00}.badge.ok{background:#dcf3e5;color:var(--ok)}
.punchbtn{width:100%;font-size:24px;font-weight:700;padding:22px;border-radius:16px;margin-top:10px}
.outbtns{display:flex;gap:8px;margin-top:10px}
.outbtns button{flex:1 1 0;min-width:0;font-size:17px;font-weight:700;padding:14px 4px;border-radius:14px;line-height:1.25;white-space:nowrap}
.outbtns button small{display:block;font-size:12px;font-weight:400;opacity:.85}
button.warn{background:var(--warn);color:#fff}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--brand);color:#fff}
.admintabs button{font-size:14.4px;padding:9px 12.6px}
/* 로그인 */
.login{max-width:320px;margin:8vh auto;text-align:center}
.dots{display:flex;justify-content:center;gap:10px;margin:18px 0 22px;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-size:24px;padding:18px 0;background:#fff}
.pad button.pri{background:var(--brand);color:#fff;font-size:20px}
/* 주간표 */
.gridhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr));overflow:hidden;margin-top:8px;min-width:0;padding-bottom:8px}
.gcol{position:relative;border-left:1px solid var(--line)}
.ghead{text-align:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);height:34px}
.ghead.today{color:#fff;background:var(--brand);border-radius:8px 8px 0 0}
.tlabel{position:absolute;right:3px;font-size:11px;color:var(--sub);transform:translateY(-50%);letter-spacing:-.3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hline{position:absolute;left:0;right:0;border-top:1px dashed #eee}
.closed{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#f1eeea,#f1eeea 4px,#e9e4de 4px,#e9e4de 8px)}
.gapz{position:absolute;left:0;right:0;background:var(--gap)}
.owner{position:absolute;left:0;right:0;background:#efe9fb}
.blk{position:absolute;border-radius:6px;font-size:10px;line-height:1.2;padding:2px 3px;overflow:hidden;cursor:default}
.blk.plan{border:1.5px solid;background:transparent;z-index:2;padding:0}
.blk.real{z-index:1;padding:0;border-left:3px solid;cursor:pointer}
.blk.open{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px)}
.blk.missing{background:#fff!important;border:1.5px dashed var(--bad)!important}
.blab{position:absolute;z-index:3;font-size:10px;line-height:1.2;padding:2px 3px;overflow:hidden;pointer-events:none;background:transparent}
.blab .r{font-weight:700;color:var(--ink)}
.blab .bad{color:var(--bad);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* 모달/토스트 */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px}
.mbtns{display:flex;gap:8px;margin-top:16px}.mbtns button{flex:1;padding:14px}
.warnlist{background:#fff6e5;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;display:none}
.pay td,.pay th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.pay{width:100%;border-collapse:collapse}
/* 근무표 */
.pal{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0 10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.pal button{padding:7px 11px;font-size:13px;border:2px solid transparent}
.pal button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.tgrid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:2px;user-select:none;-webkit-user-select:none}
.tgrid.paint{touch-action:none}
.tgrid .th{font-size:12px;text-align:center;padding:5px 0;background:#404040;color:#fff;border-radius:6px}
.tgrid .tt{font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.tc{min-height:32px;background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:1px;padding:1px;cursor:pointer}
.tc.alt,.tgrid .tt.alt{background:#ececec;border:1px solid #8a8a8a}
.tgrid .th.hl{background:#fff;color:#404040;box-shadow:inset 0 0 0 2px #404040}
.tgrid .tt.hl{background:#404040!important;color:#fff;font-weight:700;border-color:#404040}
.tc.hl{box-shadow:inset 0 0 0 2px #404040}
.tgrid .tt{border-radius:6px}
.tc.off{background:repeating-linear-gradient(45deg,#f1eeea,#f1eeea 4px,#e9e4de 4px,#e9e4de 8px);cursor:default}
.chip{font-size:10px;line-height:1.35;border-radius:4px;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;padding:1px 0}
.chip.own{background:#cfc8e8;color:#3b315e}
.chip.gone{opacity:.4;text-decoration:line-through}
.sum td,.sum th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:right;white-space:nowrap}
.sum td:first-child,.sum th:first-child{text-align:left}
.sum{width:100%;border-collapse:collapse}
.hcirc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:#2f6fd6;color:#fff;font-weight:700;font-size:12px}
.hcirc.over{background:var(--bad)}
.hcirc.sm{min-width:0;height:18px;padding:0 7px;font-size:11px;font-weight:600}
.scroll-x{overflow-x:auto}
#print{display:none}
/* 연습 모드 */
#pbanner{display:none;position:sticky;top:0;z-index:40;background:#ff8f00;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 8px}
body.practice #pbanner{display:block}
body.practice{background:#fff4e0}
.practbox{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.practbox .hint{background:#fff;border:2px dashed #ff8f00;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;text-align:left;margin:10px 0}
/* 명세서 화면 보기 */
.slipbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;overflow:auto;padding:16px 10px 40px}
.slipbar{max-width:720px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end;position:sticky;top:0}
.slip{max-width:720px;margin:0 auto;background:#fff;border-radius:10px;padding:22px 18px;font-size:14px;color:#222;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.slip h2{text-align:center;margin:0 0 14px;letter-spacing:4px}
.slip h3{font-size:15px;margin:18px 0 6px}
.slip .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:10px}
.slip table{width:100%;border-collapse:collapse}
.slip td,.slip th{border:1px solid #999;padding:6px 4px;text-align:center;font-size:13px;word-break:keep-all}
.slip th{background:#f1eeea}
.slip .tot td,.slip .tot th{font-size:15px;font-weight:700;background:#fff7e8}
.stamp{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
.stamp.ok{background:#dcf3e5;color:var(--ok)}.stamp.wip{background:#fff1d6;color:#9a5c00}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print .slip{box-shadow:none;border-radius:0;max-width:none;padding:10px}}
</style>
</head>
<body>
<div id="pbanner">연습 모드 · 이 휴대폰에만 기록되고 실제 기록에는 반영되지 않습니다</div>
<div id="app"></div>
<div id="toast"></div>
<div id="print"></div>
<!-- 연습 모드용: worker.js와 같은 내용 (빌드 때 자동으로 채움) -->
<script type="text/plain" id="practiceSrc">
// 우지커피 근무관리 Worker (Cloudflare Workers + D1)
// 필요한 설정
//   D1 바인딩: 변수명 DB
//   환경변수: ADMIN_PIN (필수, 6자리 이상 권장)
//            STORE_LAT, STORE_LNG, RADIUS (선택: 넣으면 매장 근처에서만 출퇴근 가능, RADIUS 기본 150m)

const KST = 9 * 3600e3, DAY = 864e5, HOUR = 3600e3, MIN = 60e3;
// 요일별 영업시간 [시작, 끝]  일 월 화 수 목 금 토 (getUTCDay 순서)
const OPEN_HOURS = [[7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22]];
const GRACE_MIN = 30;          // 오픈 전/마감 후 준비시간 허용(분)
const STALE_H = 12;            // 이 시간 넘게 퇴근 안 찍으면 '퇴근누락'
const LONG_SHIFT_H = 8;        // 이보다 길면 경고
const SCHEDULE_DIFF_MIN = 30;  // 스케줄과 이만큼 차이나면 경고
const WEEK_LIMIT_MIN = 15 * 60;// 주 15시간
const LATE_GRACE_MIN = 5;      // 이 분 이내 지각은 예정 시각으로 기록
const EXTRA_WINDOW_H = 12;     // 예정 퇴근으로 자동 처리된 뒤 이 시간 안에는 '연장근무' 가능

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Methods': 'GET,POST,OPTIONS',
  'Access-Control-Allow-Headers': 'Content-Type,X-Pin',
};
const json = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: { ...CORS, 'Content-Type': 'application/json; charset=utf-8' } });
const err = (m, s = 400) => json({ error: m }, s);

const k = ts => { const d = new Date(ts + KST); return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; };
const hm = ts => { const x = k(ts); return String(x.h).padStart(2, '0') + ':' + String(x.mi).padStart(2, '0'); };
const fmtH = m => `${Math.floor(m / 60)}시간${m % 60 ? ' ' + Math.round(m % 60) + '분' : ''}`;
const dayStart = ts => Math.floor((ts + KST) / DAY) * DAY - KST;
const weekStart = ts => dayStart(ts) - ((k(ts).dow + 6) % 7) * DAY;
const num = v => (typeof v === 'number' && Number.isFinite(v)) ? v : NaN;

function outside(ts) {
  const x = k(ts);
  const [o, c] = OPEN_HOURS[x.dow];
  const t = x.h * 60 + x.mi;
  return t < o * 60 - GRACE_MIN || t > c * 60 + GRACE_MIN;
}
// 휴게 차감 (출근~퇴근 시간 m분 기준). 법: 일한 시간 4시간 이상 30분, 8시간 이상 1시간
// 30분 쉬고도 일한 시간이 8시간 미만이면 30분으로 충분 → 출근~퇴근 8시간 30분 이상일 때만 1시간
const breakMin = (m, use = 1) => !use ? 0 : m >= 510 ? 60 : m >= 240 ? 30 : 0; // use=0: 휴게 없이 전부 유급
function dist(a, b, c, d) {
  const R = 6371e3, r = Math.PI / 180;
  const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function checkGps(env, b) {
  if (!env.STORE_LAT || !env.STORE_LNG) return null;
  if (b.lat == null || b.lng == null) return '위치 정보를 허용해 주세요. 매장에서만 출퇴근할 수 있습니다.';
  const d = dist(+env.STORE_LAT, +env.STORE_LNG, +b.lat, +b.lng);
  const r = +(env.RADIUS || 150);
  if (d - Math.min(+b.acc || 0, 100) > r) return `매장에서 약 ${Math.round(d)}m 떨어져 있습니다. 매장에서 눌러주세요.`;
  return null;
}

// 같은 사람의 기록끼리 겹치는지
async function overlap(env, table, staffId, s, e, exclude = 0) {
  if (table === 'punch') {
    return env.DB.prepare("SELECT id,start,end FROM punch WHERE staff_id=? AND id!=? AND status!='missing' AND start<? AND COALESCE(end,?)>?")
      .bind(staffId, exclude || 0, e, Date.now(), s).first();
  }
  return env.DB.prepare('SELECT id,start,end FROM schedule WHERE staff_id=? AND id!=? AND start<? AND end>?')
    .bind(staffId, exclude || 0, e, s).first();
}
// 퇴근을 안 누르면 예정 퇴근 시각으로 자동 기록, 예정이 없는 근무는 오래되면 '퇴근누락'
const closeStale = env => env.DB.batch([
  env.DB.prepare("UPDATE punch SET end=plan_end, status='done', end_type='auto' WHERE status='open' AND plan_end IS NOT NULL AND plan_end<=?").bind(Date.now()),
  env.DB.prepare("UPDATE punch SET status='missing' WHERE status='open' AND plan_end IS NULL AND start<?").bind(Date.now() - STALE_H * HOUR),
]);
const log = (env, id, action, before, after) => env.DB.prepare('INSERT INTO punch_log(punch_id,action,before,after,at) VALUES(?,?,?,?,?)')
  .bind(id, action, before ? JSON.stringify(before) : null, after ? JSON.stringify(after) : null, Date.now()).run();

async function auth(req, env) {
  const pin = (req.headers.get('X-Pin') || '').trim();
  if (!pin) return null;
  if (env.ADMIN_PIN && pin === String(env.ADMIN_PIN)) return { role: 'admin' };
  const s = await env.DB.prepare('SELECT id,name,wage,color FROM staff WHERE pin=? AND active=1').bind(pin).first();
  return s ? { role: 'staff', staff: s } : null;
}

// ---------- 근무표(주간 템플릿) ----------
// grid: { "요일-시": [직원id..] 또는 ["O"](사장) }  요일 0=월 … 6=일, 시 0~23 (그 시각부터 1시간)
const READY = {}; // 실제 DB / 연습 DB 각각 한 번만 준비
const BASE_SCHEMA = [
  "CREATE TABLE IF NOT EXISTS staff (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, pin TEXT NOT NULL UNIQUE, wage INTEGER NOT NULL DEFAULT 10320, color TEXT NOT NULL DEFAULT '#4f7cff', active INTEGER NOT NULL DEFAULT 1)",
  'CREATE TABLE IF NOT EXISTS schedule (id INTEGER PRIMARY KEY AUTOINCREMENT, staff_id INTEGER NOT NULL, start INTEGER NOT NULL, end INTEGER NOT NULL)',
  "CREATE TABLE IF NOT EXISTS punch (id INTEGER PRIMARY KEY AUTOINCREMENT, staff_id INTEGER NOT NULL, start INTEGER NOT NULL, end INTEGER, status TEXT NOT NULL DEFAULT 'open', note TEXT, edited INTEGER NOT NULL DEFAULT 0, created INTEGER)",
  "CREATE TABLE IF NOT EXISTS edit_request (id INTEGER PRIMARY KEY AUTOINCREMENT, punch_id INTEGER, staff_id INTEGER NOT NULL, start INTEGER NOT NULL, end INTEGER NOT NULL, reason TEXT, status TEXT NOT NULL DEFAULT 'pending', created INTEGER)",
  'CREATE TABLE IF NOT EXISTS punch_log (id INTEGER PRIMARY KEY AUTOINCREMENT, punch_id INTEGER, action TEXT, before TEXT, after TEXT, at INTEGER)',
];
async function ensureSettings(env) {
  const key = env.PRACTICE ? 'p' : 'r';
  if (READY[key]) return;
  if (env.PRACTICE) await env.DB.batch(BASE_SCHEMA.map(q => env.DB.prepare(q)));   // 연습 DB는 표도 자동 생성
  await env.DB.prepare('CREATE TABLE IF NOT EXISTS settings (k TEXT PRIMARY KEY, v TEXT)').run();
  await env.DB.prepare('CREATE TABLE IF NOT EXISTS payslip (staff_id INTEGER NOT NULL, month TEXT NOT NULL, data TEXT, at INTEGER, PRIMARY KEY(staff_id, month))').run();
  // 출퇴근 방식 변경으로 추가된 칸 (이미 있으면 무시)
  for (const col of ['plan_start INTEGER', 'plan_end INTEGER', 'raw_start INTEGER', 'raw_end INTEGER', 'end_type TEXT', 'brk_min INTEGER']) {   // brk_min: 기록한 휴게(분), 비어 있으면 자동 계산
    try { await env.DB.prepare('ALTER TABLE punch ADD COLUMN ' + col).run(); } catch (e) { }
  }
  try { await env.DB.prepare('ALTER TABLE staff ADD COLUMN use_break INTEGER NOT NULL DEFAULT 1').run(); } catch (e) { } // 휴게시간 사용 여부
  READY[key] = true;
  if (env.PRACTICE && !(await env.DB.prepare('SELECT COUNT(*) c FROM staff').first()).c) await seedPractice(env);
}

// ---------- 연습 모드 ----------
// 연습 때는 이 파일을 휴대폰 브라우저가 직접 불러와 실행하고, 기록은 그 휴대폰 안에만 저장됨 (서버와 무관)
// 연습용 데이터: 사장 PIN 0000, 알바 연습A 1111 / 연습B 2222 / 연습C 3333
async function seedPractice(env) {
  await env.DB.batch(['staff', 'schedule', 'punch', 'edit_request', 'punch_log', 'payslip', 'settings'].map(t => env.DB.prepare('DELETE FROM ' + t)));
  const ids = [];
  for (const [n, pin, c] of [['연습A', '1111', '#e4572e'], ['연습B', '2222', '#1d8a4b'], ['연습C', '3333', '#3a6ea5']]) {
    const r = await env.DB.prepare('INSERT INTO staff(name,pin,wage,color) VALUES(?,?,10320,?)').bind(n, pin, c).run();
    ids.push(r.meta.last_row_id);
  }
  const [A, B, C] = ids, g = defaultTemplate().grid, put = (d, a, z, id) => { for (let h = a; h < z; h++) (g[d + '-' + h] = g[d + '-' + h] || []).push(id); };
  for (let d = 0; d < 5; d++) { put(d, 7, 13, A); put(d, 16, 19, B); }
  for (const d of [5, 6]) { put(d, 9, 15, C); put(d, 15, 21, B); }
  await env.DB.prepare("INSERT INTO settings(k,v) VALUES('template',?)").bind(JSON.stringify({ grid: g, updated: Date.now() })).run();
  const now = Date.now(), ws = weekStart(now), today = Math.floor((dayStart(now) - ws) / DAY);
  const stmts = [];
  for (let d = 0; d < 7; d++) for (const id of ids) {
    let s = -1;
    for (let h = 0; h <= 24; h++) {
      const on = h < 24 && (g[d + '-' + h] || []).includes(id);
      if (on && s < 0) s = h;
      if (!on && s >= 0) {
        const st = ws + d * DAY + s * HOUR, en = ws + d * DAY + h * HOUR;
        if (d !== today) stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(id, st, en));
        if (d < today) { // 지난 날은 실제 근무 기록도 만들어 둠 (출근 0~7분 차이, 예정 퇴근 자동)
          const late = ((id * 7 + d * 3) % 8) * MIN, rs = late > 5 * MIN ? st + late : st;
          stmts.push(env.DB.prepare("INSERT INTO punch(staff_id,start,end,status,created,plan_start,plan_end,raw_start,end_type) VALUES(?,?,?,'done',?,?,?,?,'auto')").bind(id, rs, en, st + late, st, en, st + late));
        }
        s = -1;
      }
    }
  }
  // 오늘은 지금 바로 출퇴근 연습이 되도록: 연습A 지금 시작(정시 출근), 연습B 20분 뒤 시작(일찍 출근), 연습C는 예정 없음
  const t0 = Math.floor(now / (5 * MIN)) * 5 * MIN;
  stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(A, t0, t0 + 3 * HOUR));
  stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(B, t0 + 20 * MIN, t0 + 20 * MIN + 4 * HOUR));
  await env.DB.batch(stmts);
}
function defaultTemplate() { // 엑셀 근무표의 사장님 칸
  const g = {}, add = (d, hs) => hs.forEach(h => g[d + '-' + h] = ['O']);
  add(0, [13, 14, 15, 19, 20]); add(1, [13, 14, 15, 19, 20]);
  for (const d of [2, 3, 4]) add(d, [14, 15, 19, 20]);
  return { grid: g, saved: false };
}
function parseTemplate(row) {
  if (!row || !row.v) return defaultTemplate();
  try { const t = JSON.parse(row.v); return { grid: t.grid || {}, saved: true, updated: t.updated }; } catch { return defaultTemplate(); }
}
function cleanGrid(g) {
  const out = {};
  if (!g || typeof g !== 'object') return out;
  for (const [key, val] of Object.entries(g)) {
    if (!/^[0-6]-(\d|1\d|2[0-3])$/.test(key) || !Array.isArray(val)) continue;
    const v = val.includes('O') ? ['O'] : [...new Set(val.map(Number).filter(n => Number.isInteger(n) && n > 0))].slice(0, 6);
    if (v.length) out[key] = v;
  }
  return out;
}
const ownerKeys = grid => Object.keys(grid).filter(k => grid[k].includes('O'));

// 퇴근을 안 눌러 예정 퇴근으로 자동 처리된 마지막 근무 — 연장근무·나가기 대상
async function lastExtendable(env, id, now) {
  const r = await env.DB.prepare("SELECT * FROM punch WHERE staff_id=? AND status='done' ORDER BY start DESC LIMIT 1").bind(id).first();
  if (!r || !r.plan_end || r.end_type !== 'auto' || r.end > now || now - r.end > EXTRA_WINDOW_H * HOUR) return null;
  return r;
}

// 월 급여 계산 (onlyId가 있으면 그 직원만)
async function computePay(env, month, onlyId) {
  const mm = /^(\d{4})-(\d{2})$/.exec(month || '');
  if (!mm) return { error: 'month=YYYY-MM 형식이 필요합니다.' };
  const y = +mm[1], mo = +mm[2];
  const from = Date.UTC(y, mo - 1, 1) - KST, to = Date.UTC(y, mo, 1) - KST;
  const wFrom = weekStart(from), wTo = weekStart(to - 1) + 7 * DAY;
  const one = onlyId ? ' AND staff_id=' + (+onlyId) : '';
  const staff = (await env.DB.prepare('SELECT * FROM staff' + (onlyId ? ' WHERE id=' + (+onlyId) : '')).all()).results;
  const rows = (await env.DB.prepare("SELECT * FROM punch WHERE status='done' AND start>=? AND start<?" + one + " ORDER BY start").bind(wFrom, wTo).all()).results;
  const pending = (await env.DB.prepare("SELECT staff_id, COUNT(*) c FROM punch WHERE status IN ('open','missing') AND start>=? AND start<?" + one + " GROUP BY staff_id").bind(from, to).all()).results;
  const out = staff.map(s => {
    const mine = rows.filter(r => r.staff_id === s.id);
    const weeks = {}, shifts = [];
    for (const r of mine) {
      const min = Math.round((r.end - r.start) / MIN), brk = r.brk_min != null ? Math.min(+r.brk_min, min) : breakMin(min, s.use_break), paid = min - brk;
      const w = weekStart(r.start);
      weeks[w] = (weeks[w] || 0) + paid;
      if (r.start >= from && r.start < to) shifts.push({ id: r.id, start: r.start, end: r.end, min, brk, paid, edited: r.edited, end_type: r.end_type });
    }
    const total = shifts.reduce((a, x) => a + x.min, 0), brk = shifts.reduce((a, x) => a + x.brk, 0), paid = total - brk;
    const days = new Set(shifts.map(x => dayStart(x.start))).size;
    const overWeeks = Object.entries(weeks).filter(([, v]) => v >= WEEK_LIMIT_MIN).map(([w, v]) => ({ week: +w, minutes: v }));
    const pc = pending.find(x => x.staff_id === s.id);
    return { id: s.id, name: s.name, wage: s.wage, color: s.color, active: s.active, useBreak: s.use_break !== 0, days, total, brk, paid, pay: Math.floor(paid * s.wage / 60), shifts, overWeeks, unresolved: pc ? pc.c : 0 };
  }).filter(x => onlyId || x.shifts.length || x.unresolved || x.active);
  return { month: `${y}-${String(mo).padStart(2, '0')}`, staff: out };
}

function validRange(s, e) {
  if (!Number.isFinite(s) || !Number.isFinite(e)) return '시간 값이 올바르지 않습니다.';
  if (e <= s) return '퇴근 시간이 출근 시간보다 늦어야 합니다.';
  if (e - s > 16 * HOUR) return '한 번 근무가 16시간을 넘을 수 없습니다.';
  return null;
}

async function route(req, env) {
  const url = new URL(req.url), p = url.pathname, m = req.method;
  const b = m === 'POST' ? await req.json().catch(() => ({})) : {};

    if (!env.PRACTICE) return err('연습 모드에서만 됩니다.', 403);

  const me = await auth(req, env);

      const recent = (await env.DB.prepare('SELECT * FROM punch WHERE staff_id=? ORDER BY start DESC LIMIT 20').bind(id).all()).results;
      const requests = (await env.DB.prepare("SELECT * FROM edit_request WHERE staff_id=? AND status='pending' ORDER BY created DESC").bind(id).all()).results;

      const open = await env.DB.prepare("SELECT id FROM punch WHERE staff_id=? AND status='open'").bind(id).first();

      const last = await env.DB.prepare('SELECT MAX(COALESCE(raw_end,created)) t FROM punch WHERE staff_id=?').bind(id).first();
      if (last && last.t && now - last.t < MIN) return err('방금 기록되었습니다. 잠시 후 다시 시도하세요.', 409);

      // 지금 해당하는 예정 스케줄: 아직 끝나지 않은 것 중 가장 이른 것 (3시간 전부터 인정)

        .bind(id, start, warns.join(' / ') || null, now, sch ? sch.start : null, sch ? sch.end : null, now).run();

  if (p === '/admin/schedule' && m === 'POST') {

    let ms = s, me = e;

    if (same.length) {

    if (!b.apply) return json({ ok: true });
    // 근무표 → 선택한 주들의 예정 스케줄로 변환 (기존 예정 스케줄은 교체)
    const from = num(b.apply.from);

    const weeks = Math.min(12, Math.max(1, Math.round(+b.apply.weeks || 1)));
    const ws0 = weekStart(from);
    const ids = (await env.DB.prepare('SELECT id FROM staff WHERE active=1').all()).results.map(r => r.id);
    const stmts = []; let count = 0;
    for (let w = 0; w < weeks; w++) {
      const base = ws0 + w * 7 * DAY;
      stmts.push(env.DB.prepare('DELETE FROM schedule WHERE start>=? AND start<?').bind(base, base + 7 * DAY));
      for (let d = 0; d < 7; d++) for (const id of ids) {
        let s = -1;
        for (let h = 0; h <= 24; h++) {
          const on = h < 24 && (grid[d + '-' + h] || []).includes(id);
          if (on && s < 0) s = h;
          if (!on && s >= 0) {
            stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(id, base + d * DAY + s * HOUR, base + d * DAY + h * HOUR));
            count++; s = -1;
          }
        }
      }
    }
    await env.DB.batch(stmts);
    return json({ ok: true, from: ws0, weeks, count });
  }
  if (p === '/admin/schedule/delete' && m === 'POST') {
    await env.DB.prepare('DELETE FROM schedule WHERE id=?').bind(+b.id).run();
    return json({ ok: true });
  }
  if (p === '/admin/schedule/copy' && m === 'POST') {
    const from = num(b.from); if (!Number.isFinite(from)) return err('from 값이 필요합니다.');
    const rows = (await env.DB.prepare('SELECT * FROM schedule WHERE start>=? AND start<?').bind(from, from + 7 * DAY).all()).results;
    let copied = 0, skipped = 0;
    for (const r of rows) {
      const s = r.start + 7 * DAY, e = r.end + 7 * DAY;
      if (await overlap(env, 'schedule', r.staff_id, s, e)) { skipped++; continue; }
      await env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(r.staff_id, s, e).run();
      copied++;
    }
    return json({ ok: true, copied, skipped });
  }

  if (p === '/admin/punches' && m === 'GET') {
    const from = +url.searchParams.get('from'), to = +url.searchParams.get('to');
    const rows = (await env.DB.prepare(`SELECT p.*, s.name FROM punch p JOIN staff s ON s.id=p.staff_id
      WHERE (p.start<? AND COALESCE(p.end,?)>?) OR p.status IN ('missing','open') ORDER BY p.start DESC`).bind(to, now, from).all()).results;
    return json(rows);
  }
  if (p === '/admin/punch' && m === 'POST') {
    const sid = +b.staff_id, s = num(b.start), e = num(b.end);
    const bm = b.brk_min === '' || b.brk_min == null ? null : Math.max(0, Math.round(+b.brk_min) || 0);   // 휴게(분)
    const v = validRange(s, e); if (v) return err(v);
    if (bm != null && bm >= (e - s) / MIN) return err('휴게시간이 근무시간보다 깁니다.');
    if (await overlap(env, 'punch', sid, s, e, +b.id || 0)) return err('이 직원의 다른 근무 기록과 시간이 겹칩니다.', 409);
    if (b.id) {
      const before = await env.DB.prepare('SELECT * FROM punch WHERE id=?').bind(+b.id).first();
      await env.DB.prepare("UPDATE punch SET staff_id=?,start=?,end=?,brk_min=?,status='done',edited=1 WHERE id=?").bind(sid, s, e, bm, +b.id).run();
      await log(env, +b.id, 'admin_edit', before, { staff_id: sid, start: s, end: e, brk_min: bm });
    } else {
      const r = await env.DB.prepare("INSERT INTO punch(staff_id,start,end,brk_min,status,edited,created,note) VALUES(?,?,?,?,'done',1,?, '관리자 추가')").bind(sid, s, e, bm, now).run();
      await log(env, r.meta.last_row_id, 'admin_add', null, { staff_id: sid, start: s, end: e, brk_min: bm });
    }
    return json({ ok: true });
  }
  if (p === '/admin/punch/delete' && m === 'POST') {
    const before = await env.DB.prepare('SELECT * FROM punch WHERE id=?').bind(+b.id).first();
    await env.DB.prepare('DELETE FROM punch WHERE id=?').bind(+b.id).run();
    await log(env, +b.id, 'admin_delete', before, null);
    return json({ ok: true });
  }

  if (p === '/admin/requests' && m === 'GET') {
    const rows = (await env.DB.prepare(`SELECT r.*, s.name, p.start AS old_start, p.end AS old_end FROM edit_request r
      JOIN staff s ON s.id=r.staff_id LEFT JOIN punch p ON p.id=r.punch_id WHERE r.status='pending' ORDER BY r.created`).all()).results;
    return json(rows);
  }
  if (p === '/admin/requests/resolve' && m === 'POST') {
    const r = await env.DB.prepare("SELECT * FROM edit_request WHERE id=? AND status='pending'").bind(+b.id).first();
    if (!r) return err('이미 처리된 요청입니다.');
    if (b.approve) {
      if (await overlap(env, 'punch', r.staff_id, r.start, r.end, r.punch_id || 0)) return err('승인하면 다른 기록과 겹칩니다. 기록 탭에서 직접 수정하세요.', 409);
      if (r.punch_id) {
        const before = await env.DB.prepare('SELECT * FROM punch WHERE id=?').bind(r.punch_id).first();
        await env.DB.prepare("UPDATE punch SET start=?,end=?,status='done',edited=1 WHERE id=?").bind(r.start, r.end, r.punch_id).run();
        await log(env, r.punch_id, 'request_approve', before, { start: r.start, end: r.end, reason: r.reason });
      } else {
        const ins = await env.DB.prepare("INSERT INTO punch(staff_id,start,end,status,edited,created,note) VALUES(?,?,?,'done',1,?,?)")
          .bind(r.staff_id, r.start, r.end, now, '요청 승인: ' + (r.reason || '')).run();
        await log(env, ins.meta.last_row_id, 'request_add', null, { start: r.start, end: r.end, reason: r.reason });
      }
    }
    await env.DB.prepare('UPDATE edit_request SET status=? WHERE id=?').bind(b.approve ? 'approved' : 'rejected', r.id).run();
    return json({ ok: true });
  }

  if (p === '/admin/pay' && m === 'GET') {
    const r = await computePay(env, url.searchParams.get('month'));
    if (r.error) return err(r.error);
    const conf = (await env.DB.prepare('SELECT staff_id, at FROM payslip WHERE month=?').bind(r.month).all()).results;
    r.staff.forEach(s => { const c = conf.find(x => x.staff_id === s.id); s.confirmedAt = c ? c.at : null; });
    return json(r);
  }
  // 급여 확정: 그 달 명세서를 그대로 저장 → 알바가 '확정급여'에서 봄
  if (p === '/admin/pay/confirm' && m === 'POST') {
    const r = await computePay(env, b.month);
    if (r.error) return err(r.error);
    const list = r.staff.filter(s => s.shifts.length);
    if (!list.length) return err('이 달에 근무 기록이 있는 직원이 없습니다.');
    await env.DB.batch(list.map(s => env.DB.prepare('INSERT INTO payslip(staff_id,month,data,at) VALUES(?,?,?,?) ON CONFLICT(staff_id,month) DO UPDATE SET data=excluded.data, at=excluded.at')
      .bind(s.id, r.month, JSON.stringify(s), now)));
    return json({ ok: true, count: list.length, month: r.month });
  }
  if (p === '/admin/pay/unconfirm' && m === 'POST') {
    await env.DB.prepare('DELETE FROM payslip WHERE month=?').bind(String(b.month || '')).run();
    return json({ ok: true });
  }

  return err('알 수 없는 요청입니다.', 404);
}

export default {
  async fetch(req, env) {
    if (req.method === 'OPTIONS') return new Response(null, { headers: CORS });
    try { return await route(req, env); }
    catch (e) { return err('서버 오류: ' + (e && e.message || e), 500); }
  },
};

</script>
<script>
// ===== 설정 =====
const CFG = {

  H0: 6, H1: 22, PX: 32,                            // 주간표 표시 시간 범위, 1시간당 높이
  // 요일별 영업시간 [시작, 끝]  월 화 수 목 금 토 일
  OPEN: [[7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22]],

  SQLJS: ['https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/', 'https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/']
};
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;
const DOW = ['일','월','화','수','목','금','토'];
let PRACTICE = false, PIN = '', ME = null, WEEK = monday(new Date()), MODE = 'plan', DATA = null, TAB = 'grid', idleT = null;

// ===== 유틸 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const mdw = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtH = m => `${Math.floor(m / 60)}시간${m % 60 ? ' ' + Math.round(m % 60) + '분' : ''}`;
const won = n => n.toLocaleString('ko-KR') + '원';
const toMs = (date, time) => new Date(`${date}T${time}`).getTime();
function monday(d) { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function addDays(t, n) { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }

async function api(path, body) {
  const init = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Pin': PIN }, body: body ? JSON.stringify(body) : undefined };
  const r = PRACTICE ? await practiceFetch(path, init) : await fetch(CFG.API + path, init);
  const j = await r.json().catch(() => ({ error: '서버 응답을 읽을 수 없습니다.' }));
  if (r.status === 401 && ME) { logout(); throw new Error('다시 로그인해 주세요.'); }
  if (!r.ok && !j.needConfirm) throw new Error(j.error || '오류가 발생했습니다.');
  return j;
}
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, 3500); } }

// 경고가 있으면 확인받고 다시 보냄
async function withConfirm(path, body) {
  let j = await api(path, body);

    const ok = await modal(`<h3>확인해 주세요</h3><div class="warnlist">${j.warns.map(esc).join('<br>')}</div><div>그래도 진행할까요?</div>`, '진행');
    if (!ok) return null;
    j = await api(path, { ...body, confirm: true });
  }
  return j;
}

function modal(html, okText = '확인', read, cancelText = '취소') {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'mbg';
    bg.innerHTML = `<div class="modal">${html}<div class="mbtns">${cancelText ? `<button data-x>${cancelText}</button>` : ''}<button class="pri" data-ok>${okText}</button></div></div>`;
    document.body.appendChild(bg);
    const close = v => { bg.remove(); res(v); };
    bg.querySelector('[data-ok]').onclick = () => { const v = read ? read() : true; if (v === false) return; close(v); };
    const x = bg.querySelector('[data-x]'); if (x) x.onclick = () => close(null);
  });
}

function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => res({}), { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
  });
}

function resetIdle() { clearTimeout(idleT); if (ME) idleT = setTimeout(idleLogout, CFG.IDLE_MIN * MIN); }
async function idleLogout() {

  TPL_DIRTY = false; logout(); toast('자동 로그아웃되었습니다.');
}
['click', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, resetIdle, { passive: true }));

// ===== 연습 모드: 서버 대신 이 휴대폰 안에서 실행 =====
const PKEY = 'oozyPracticeDB';
let PW = null;
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function practiceEngine() {
  if (PW) return PW;
  let SQL = null;
  for (const base of CFG.SQLJS) {
    try { if (!window.initSqlJs) await loadScript(base + 'sql-wasm.js'); SQL = await initSqlJs({ locateFile: f => base + f }); break; } catch (e) { }
  }
  if (!SQL) throw new Error('연습 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  let mod;
  // 이 HTML 안에 넣어 둔 worker.js를 그대로 실행 (따로 올릴 파일 없음)
  try { const src = document.getElementById('practiceSrc').textContent; mod = await import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))); }
  catch (e) { throw new Error('연습 프로그램을 시작하지 못했습니다: ' + e.message); }
  let saved = null; try { saved = localStorage.getItem(PKEY); } catch (e) { }
  const db = saved ? new SQL.Database(Uint8Array.from(atob(saved), c => c.charCodeAt(0))) : new SQL.Database();
  const save = () => { try { const u = db.export(); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); localStorage.setItem(PKEY, btoa(s)); } catch (e) { } };
  // Cloudflare D1과 같은 사용법으로 감싸기
  const norm = v => v === undefined ? null : v === true ? 1 : v === false ? 0 : v;
  const stmt = q => {
    let args = [];
    const rows = () => { const st = db.prepare(q); st.bind(args.map(norm)); const out = []; while (st.step()) out.push(st.getAsObject()); st.free(); return out; };
    const o = {
      bind(...a) { args = a; return o; },
      _rows: rows,
      async first() { return rows()[0] ?? null; },
      async all() { return { results: rows() }; },
      async run() { rows(); const id = db.exec('SELECT last_insert_rowid()')[0].values[0][0]; save(); return { meta: { last_row_id: id } }; },
    };
    return o;
  };
  const DB = { prepare: stmt, async batch(list) { const res = list.map(s => ({ results: s._rows() })); save(); return res; } };
  PW = { worker: mod.default, env: { DB, ADMIN_PIN: '0000', PRACTICE: true } };
  return PW;
}
async function practiceFetch(path, init) {

}

// ===== 주간표 =====

function bindGrid(admin, pre) {
  document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { WEEK = addDays(WEEK, 7 * +b.dataset.w); loadWeek(admin); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { MODE = b.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); drawGrid(admin); });

const weekCache = {};
let weekReq = 0;
async function loadWeek(admin, pre) {
  const w = WEEK, my = ++weekReq;
  $('#wk').textContent = `${mdw(w)} ~ ${mdw(addDays(w, 6))}`;
  if (weekCache[w]) { DATA = weekCache[w]; drawGrid(admin); }       // 캐시 먼저 보여주고

// 근무표의 사장님 칸("요일-시") → 그날의 [시작,끝] 구간들
function ownerRanges(keys, di) {
  const hs = keys.filter(k => k.startsWith(di + '-')).map(k => +k.split('-')[1]).sort((a, b) => a - b);
  const out = [];
  hs.forEach(h => { const last = out[out.length - 1]; if (last && last[1] === h) last[1] = h + 1; else out.push([h, h + 1]); });
  return out;
}
function drawGrid(admin) {

  const mine = ME && ME.role === 'staff' ? ME.id : null;
  const plan = schedules.map(s => ({ ...s, kind: 'plan' }));
  const real = punches.map(p => ({ ...p, kind: 'real', end: p.end || (p.status === 'open' ? Math.max(now, p.start + 20 * MIN) : p.start + 30 * MIN) }));
  // 근무시간표: 모든 사람의 예정 + 실제 / 출퇴근 기록: 직원은 본인 예정 + 본인 실제, 관리자는 전체 실제

  const H = (CFG.H1 - CFG.H0) * CFG.PX, y = t => (t - CFG.H0) * CFG.PX;
  let h = `<div><div class="ghead"></div><div style="position:relative;height:${H}px">`;
  for (let i = CFG.H0; i < CFG.H1; i++) h += `<div class="tlabel" style="top:${y(i) + CFG.PX / 2}px">${pad(i)}~${pad(i + 1)}</div>`; // 칸 가운데에 07~08
  h += `</div></div>`;
  const todayMs = new Date().setHours(0, 0, 0, 0);
  for (let d = 0; d < 7; d++) {
    const ds = addDays(WEEK, d), de = addDays(WEEK, d + 1), dow = new Date(ds).getDay(), we = dow === 0 || dow === 6;
    const [o, c] = CFG.OPEN[(dow + 6) % 7];
    const Y = t => y((Math.min(Math.max(t, ds), de) - ds) / HOUR);
    h += `<div class="gcol"><div class="ghead ${ds === todayMs ? 'today' : ''}">${DOW[dow]}<br>${new Date(ds).getDate()}</div><div style="position:relative;height:${H}px">`;
    h += `<div class="closed" style="top:0;height:${y(o)}px"></div><div class="closed" style="top:${y(c)}px;height:${H - y(c)}px"></div>`;
    for (let i = CFG.H0 + 1; i < CFG.H1; i++) h += `<div class="hline" style="top:${y(i)}px"></div>`;
    const owner = DATA.owner ? ownerRanges(DATA.owner, (dow + 6) % 7) : (we ? CFG.OWNER.we : CFG.OWNER.wd);
    owner.forEach(([a, b]) => h += `<div class="owner" style="top:${y(a)}px;height:${(b - a) * CFG.PX}px"></div>`);
    const dayItems = items.filter(it => it.start < de && it.end > ds);
    if (MODE === 'plan') { // 예정 기준으로 아무도 없는 시간 표시
      const dp = dayItems.filter(it => it.kind === 'plan');
      for (let t = o; t < c; t += 0.5) {
        const s = ds + t * HOUR, e = s + 30 * MIN;
        const byOwner = owner.some(([a, b]) => t >= a && t < b);
        if (!dp.some(it => it.start < e && it.end > s) && !byOwner) h += `<div class="gapz" style="top:${y(t)}px;height:${CFG.PX / 2}px"></div>`;
      }
    }
    // 같은 사람의 예정·실제가 겹치면 한 묶음(같은 줄)으로
    const by = {}; dayItems.forEach(it => (by[it.staff_id] = by[it.staff_id] || []).push(it));
    const groups = [];
    Object.values(by).forEach(arr => {
      arr.sort((a, b) => a.start - b.start); let cur = null;
      arr.forEach(it => { if (cur && it.start < cur.end) { cur.items.push(it); cur.end = Math.max(cur.end, it.end); } else groups.push(cur = { sid: it.staff_id, start: it.start, end: it.end, items: [it] }); });
    });

    const L = Math.max(1, lanes.length), w = 100 / L;

          lab += it.status === 'missing' ? `<br><span class="bad">▶${hhmm(it.start)} 퇴근누락</span>`

            : `<br><span class="r">▶${hhmm(it.start)}-${hhmm(it.end)}</span>`;
        }

    });

  const shown = mine && MODE === 'real' ? staff.filter(s => s.id === mine) : staff.filter(s => s.active);

let TPL = null, TPL_DIRTY = false, BRUSH = null, PAINT = null;

  document.querySelectorAll('.tc[data-k]').forEach(drawCell);

function markBrush() {

  $('#tg').classList.toggle('paint', !!BRUSH); // 칠하기 중엔 화면이 끌려가지 않게
}
function drawCell(el) {
  const v = TPL[el.dataset.k] || [];
  el.classList.toggle('has', v.length > 0);
  el.innerHTML = v.map(x => {
    if (x === 'O') return '<div class="chip own">사장</div>';

function dirty() {
  TPL_DIRTY = true;
  const t = document.querySelector('[data-tab="tpl"]'); if (t) t.textContent = '근무표*';
  const lab = $('#tStat'); if (lab) lab.innerHTML = '<b style="color:var(--bad)">저장 안 됨</b>';
}
function paintCell(k, mode) {
  let v = (TPL[k] || []).slice();
  if (BRUSH === 'X') v = [];
  else if (BRUSH === 'O') v = mode === 'add' ? ['O'] : [];
  else { const id = +BRUSH; v = v.filter(x => x !== 'O' && x !== id); if (mode === 'add') v.push(id); }
  if (v.length) TPL[k] = v; else delete TPL[k];
  drawCell(document.querySelector(`.tc[data-k="${k}"]`));
  dirty();
}
function bindPaint() {
  const tg = $('#tg');
  const cellAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest('.tc[data-k]'); };
  tg.onpointerdown = e => {
    if (!BRUSH) return;
    const c = cellAt(e); if (!c) return;
    e.preventDefault();
    const v = TPL[c.dataset.k] || [];
    const mode = BRUSH === 'X' ? 'del' : BRUSH === 'O' ? (v.includes('O') ? 'del' : 'add') : (v.includes(+BRUSH) ? 'del' : 'add');
    PAINT = { mode, last: c.dataset.k };
    paintCell(c.dataset.k, mode);
  };
  // 마우스·손가락이 있는 칸의 요일과 시간을 반전 표시
  let hlKey = null;
  const hl = c => {
    const k = c ? c.dataset.k : null; if (k === hlKey) return; hlKey = k;
    tg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
    if (!c) return;
    const [d, hh] = k.split('-');
    c.classList.add('hl');
    tg.querySelector(`.th[data-d="${d}"]`).classList.add('hl');
    tg.querySelector(`.tt[data-h="${hh}"]`).classList.add('hl');
  };
  tg.onpointermove = e => {
    const c = cellAt(e); hl(c);
    if (!PAINT || !c || c.dataset.k === PAINT.last) return;
    PAINT.last = c.dataset.k; paintCell(c.dataset.k, PAINT.mode);
  };
  tg.addEventListener('pointerdown', e => hl(cellAt(e)));
  const end = () => { if (PAINT) { PAINT = null; drawSummary(); } };
  tg.onpointerup = end; tg.onpointercancel = end;
  tg.onpointerleave = () => { end(); hl(null); };
}
// 근무표에서 사람별 요일별 연속 근무 구간 계산
function tplShifts(id) {
  const days = [];
  for (let d = 0; d < 7; d++) {
    const runs = []; let s = -1;
    for (let h = 0; h <= 24; h++) {
      const on = h < 24 && (TPL[d + '-' + h] || []).includes(id);
      if (on && s < 0) s = h;
      if (!on && s >= 0) { runs.push([s, h]); s = -1; }
    }
    days.push(runs);
  }
  return days;
}
function drawSummary() {
  const ids = [...new Set(Object.values(TPL).flat().filter(x => x !== 'O'))];
  const list = STAFF.filter(s => s.active || ids.includes(s.id));
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const dim = new Date(y, mo + 1, 0).getDate();
  const dayCount = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 1; i <= dim; i++) dayCount[(new Date(y, mo, i).getDay() + 6) % 7]++;
  let rows = '', totPay = 0, totMon = 0; const over = [], brk = [];
  for (const s of list) {
    const days = tplShifts(s.id);
    const hrs = days.map(r => r.reduce((a, [x, z]) => a + z - x, 0));

    const paidDay = days.map(r => r.reduce((a, [x, z]) => { const m = (z - x) * 60; return a + m - (!ub ? 0 : m >= 510 ? 60 : m >= 240 ? 30 : 0); }, 0));
    const tot = hrs.reduce((a, b) => a + b, 0), paid = paidDay.reduce((a, b) => a + b, 0);
    if (!tot && !s.active) continue;
    const wk = Math.floor(paid * s.wage / 60), mon = Math.floor(paidDay.reduce((a, m, d) => a + m * dayCount[d], 0) * s.wage / 60);
    totPay += wk; totMon += mon; if (tot >= 15) over.push({ name: esc(s.name), tot, paid });
    const bd = days.map((r, d) => r.some(([x, z]) => z - x >= 4) ? TDAYS[d] : '').filter(Boolean);
    if (bd.length) brk.push(`${esc(s.name)}(${bd.join('·')})${ub ? '' : ' <span style="color:var(--sub);font-weight:400">휴게 없음·전부 유급</span>'}`);
    rows += `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.color}"></i> ${esc(s.name)}</td>
      ${hrs.map(h => `<td>${h || '<span class="muted">-</span>'}</td>`).join('')}
      <td style="text-align:center"><span class="hcirc ${tot >= 15 ? 'over' : ''}">${tot}</span></td><td>${fmtH(paid)}</td>

  }
  // 요일별 빈 시간 (아무도 없는 영업시간)
  const gaps = TDAYS.map((_, d) => { const [o, c] = openOf(d); let n = 0; for (let h = o; h < c; h++) if (!(TPL[d + '-' + h] || []).length) n++; return n; });
  const ownerH = TDAYS.map((_, d) => Object.keys(TPL).filter(k => k.startsWith(d + '-') && TPL[k].includes('O')).length);
  $('#tsum').innerHTML = `<table class="sum"><tr><th>이름</th>${TDAYS.map(d => `<th>${d}</th>`).join('')}<th style="text-align:center">합계</th><th>유급</th><th style="text-align:center">주급</th><th style="text-align:center">${mo + 1}월 예상</th></tr>
    ${rows || `<tr><td colspan="12" class="muted" style="text-align:left">아직 칠한 칸이 없습니다.</td></tr>`}
    <tr><td>사장</td>${ownerH.map(h => `<td>${h || '-'}</td>`).join('')}<td style="text-align:center">${ownerH.reduce((a, b) => a + b, 0)}</td><td colspan="3"></td></tr>
    <tr><td><b>빈 시간</b></td>${gaps.map(n => `<td>${n ? `<b style="color:var(--bad)">${n}</b>` : '<span style="color:var(--ok)">0</span>'}</td>`).join('')}<td style="text-align:center">${gaps.reduce((a, b) => a + b, 0)}</td><td colspan="3"></td></tr>
    <tr><td><b>알바비 합계</b></td><td colspan="9"></td><td style="text-align:center"><b>${won(totPay)}</b></td><td style="text-align:center"><b>${won(totMon)}</b></td></tr></table>`;
  const juhu = over.filter(o => o.paid >= 900), near = over.filter(o => o.paid < 900);
  const line = (label, body, color) => `<div style="margin-top:3px"><b>${label}:</b> <b style="color:${color}">${body}</b></div>`;
  $('#tnote').innerHTML =
      line('주휴수당', juhu.length ? juhu.map(o => `${o.name}(유급 ${fmtH(o.paid)})`).join(', ') : '해당자 없음', juhu.length ? 'var(--bad)' : '#2f6fd6')
    + (near.length ? `<div class="muted" style="margin-left:4px">└ ${near.map(o => `${o.name}: 합계 ${o.tot}시간이지만 유급 ${fmtH(o.paid)}`).join(', ')} → 15시간 미만이라 해당 없음</div>` : '')
    + line('휴게시간', brk.length ? brk.join(', ') : '해당자 없음', brk.length ? '#b26a00' : '#2f6fd6')
    + '<div style="margin-top:6px">합계 숫자: <span class="hcirc sm">파랑</span> 15시간 미만 · <span class="hcirc sm over">빨강</span> 15시간 이상.<br>'
    + '휴게시간: 4시간 이상 일하면 30분, 8시간 이상 일하면 1시간을 근무 중에 줘야 합니다 (출근~퇴근 8시간 30분 이상이면 1시간 차감). 주휴수당은 휴게를 뺀 <b>유급 시간</b>이 주 15시간 이상일 때 발생합니다.</div>';
}
async function saveTpl() {
  const r = await run(() => api('/admin/template', { grid: TPL }));
  if (r) { TPL_DIRTY = false; toast('근무표를 저장했습니다'); tabTpl(); document.querySelector('[data-tab="tpl"]').textContent = '근무표'; }
}
async function applyTpl() {
  const v = await modal(`<h3>주간표에 적용</h3>
    <label>시작 주 (그 주 월요일부터)</label><input type="date" id="aD" value="${ymd(monday(Date.now()))}">
    <label>기간</label><select id="aW"><option value="1">1주</option><option value="2">2주</option><option value="4" selected>4주</option><option value="8">8주</option></select>
    <div class="warnlist">선택한 주의 <b>기존 예정 스케줄은 모두 지워지고</b> 근무표대로 다시 만들어집니다.<br><span class="muted">실제 출퇴근 기록과 급여는 바뀌지 않습니다. 사장 칸은 스케줄로 만들지 않습니다.</span></div>`, '적용', () => {
      const d = $('#aD').value; if (!d) { toast('시작 주를 고르세요'); return false; }
      return { from: monday(new Date(d + 'T00:00')), weeks: +$('#aW').value };
    });
  if (!v) return;
  const r = await run(() => api('/admin/template', { grid: TPL, apply: v }));
  if (!r) return;
  TPL_DIRTY = false; clearWeekCache();
  toast(`${r.weeks}주에 스케줄 ${r.count}개를 만들었습니다`);
  WEEK = monday(v.from); MODE = 'plan'; TAB = 'grid'; renderAdmin();
}

async function tabPunch() {
  $('#body').innerHTML = `<div class="card"><div class="gridhead"><div class="row" style="flex:0 0 auto;align-items:center"><button class="sm" id="pwPrev">◀</button><b style="min-width:120px;text-align:center">${mdw(WEEK)} ~ ${mdw(addDays(WEEK, 6))}</b><button class="sm" id="pwNext">▶</button></div>
    <button class="sm pri" id="pAdd" style="flex:0 0 auto">기록 직접 추가</button></div><div class="list" id="plist" style="margin-top:8px"><div class="muted">불러오는 중...</div></div></div>`;
  $('#pwPrev').onclick = () => { WEEK = addDays(WEEK, -7); tabPunch(); };
  $('#pwNext').onclick = () => { WEEK = addDays(WEEK, 7); tabPunch(); };
  $('#pAdd').onclick = () => editPunch(null);
  const rows = await run(() => api(`/admin/punches?from=${WEEK}&to=${addDays(WEEK, 7)}`)); if (!rows) return;
  $('#plist').innerHTML = rows.map(p => `<div><div><b>${esc(p.name)}</b> ${mdw(p.start)} ${hhmm(p.start)}-${p.end ? hhmm(p.end) : '?'}
      ${p.status === 'missing' ? '<span class="badge bad">퇴근누락</span>' : p.status === 'open' ? '<span class="badge ok">근무중</span>' : `<span class="muted">${fmtH(Math.round((p.end - p.start) / MIN))}${p.brk_min != null ? ` · 휴게 ${p.brk_min}분` : ''}</span>`}
      ${endBadge(p)}${p.edited ? '<span class="badge">수정됨</span>' : ''}
      ${(p.raw_start && p.raw_start !== p.start) || (p.raw_end && p.raw_end !== p.end) ? `<div class="muted">누른 시각: 출근 ${p.raw_start ? hhmm(p.raw_start) : '-'}${p.raw_end ? ' · 퇴근 ' + hhmm(p.raw_end) : ''}</div>` : ''}
      ${p.note ? `<div class="muted">⚠ ${esc(p.note)}</div>` : ''}</div>
      <div style="display:flex;gap:4px;flex:0 0 auto"><button class="sm" data-pe="${p.id}">수정</button><button class="sm" data-pd="${p.id}">삭제</button></div></div>`).join('') || '<div class="muted">기록이 없습니다.</div>';
  document.querySelectorAll('[data-pe]').forEach(b => b.onclick = () => editPunch(rows.find(p => p.id === +b.dataset.pe)));
  document.querySelectorAll('[data-pd]').forEach(b => b.onclick = async () => {
    const p = rows.find(x => x.id === +b.dataset.pd);
    if (!await modal(`<h3>기록 삭제</h3>${esc(p.name)} ${mdw(p.start)} ${hhmm(p.start)}-${p.end ? hhmm(p.end) : '?'}<br>삭제할까요? (삭제 이력은 남습니다)`, '삭제')) return;
    if (await run(() => api('/admin/punch/delete', { id: p.id }))) { toast('삭제했습니다'); tabPunch(); }
  });
}
async function editPunch(p, fromWeek) {
  const v = await modal(`<h3>${p ? '기록 수정' : '기록 추가'}</h3><label>직원</label><select id="kS">${staffOpts(p && p.staff_id)}</select>
    <label>날짜</label><input type="date" id="kD" value="${ymd(p ? p.start : Date.now())}">
    <div class="row"><div><label>출근</label><input type="time" id="kA" value="${p ? hhmm(p.start) : ''}"></div><div><label>퇴근</label><input type="time" id="kB" value="${p && p.end ? hhmm(p.end) : ''}"></div></div>
    <label>휴게시간 (분)</label><input type="number" id="kR" inputmode="numeric" min="0" step="10" value="${p && p.brk_min != null ? p.brk_min : 30}">
    <div class="muted" style="font-size:12px">급여에서 빼는 시간입니다. 휴게가 없으면 0을 넣으세요.</div>`, '저장', () => {
      const d = $('#kD').value, a = $('#kA').value, b = $('#kB').value, r = $('#kR').value.trim();
      if (!d || !a || !b) { toast('날짜와 시간을 모두 입력하세요'); return false; }
      if (r !== '' && !(+r >= 0)) { toast('휴게시간은 0 이상의 분으로 넣으세요'); return false; }
      return { id: p ? p.id : null, staff_id: +$('#kS').value, start: toMs(d, a), end: toMs(d, b), brk_min: r === '' ? 30 : +r };
    });
  if (!v) return;
  if (await run(() => api('/admin/punch', v))) { toast('저장했습니다'); if (fromWeek) { clearWeekCache(); loadWeek(true); } else tabPunch(); }
}

function tabReq(reqs) {
  $('#body').innerHTML = `<div class="card"><b>수정 요청</b><div class="list">${reqs.map(r => `<div><div><b>${esc(r.name)}</b> ${r.punch_id ? '기록 수정' : '<span class="badge warn">누락 추가</span>'}<br>
      ${r.punch_id ? `<span class="muted">기존 ${mdw(r.old_start)} ${hhmm(r.old_start)}-${r.old_end ? hhmm(r.old_end) : '?'}</span><br>` : ''}
      → <b>${mdw(r.start)} ${hhmm(r.start)}-${hhmm(r.end)}</b><div class="muted">사유: ${esc(r.reason)}</div></div>
      <div style="display:flex;gap:4px;flex:0 0 auto"><button class="sm ok" data-ra="${r.id}">승인</button><button class="sm" data-rr="${r.id}">거절</button></div></div>`).join('') || '<div class="muted">대기 중인 요청이 없습니다.</div>'}</div></div>`;
  const go = async (id, approve) => { if (await run(() => api('/admin/requests/resolve', { id, approve }))) { toast(approve ? '승인했습니다' : '거절했습니다'); renderAdmin(); } };
  document.querySelectorAll('[data-ra]').forEach(b => b.onclick = () => go(+b.dataset.ra, true));
  document.querySelectorAll('[data-rr]').forEach(b => b.onclick = () => go(+b.dataset.rr, false));
}

let PAYMONTH = ymd(Date.now()).slice(0, 7), PAY = null;
async function tabPay() {
  $('#body').innerHTML = `<div class="card"><div class="row"><div><label>급여 월</label><input type="month" id="pm" value="${PAYMONTH}"></div><button class="pri" id="pgo" style="flex:0 0 auto">계산</button></div></div><div id="paybody"></div>`;
  $('#pgo').onclick = () => { PAYMONTH = $('#pm').value; tabPay(); };
  PAY = await run(() => api('/admin/pay?month=' + PAYMONTH)); if (!PAY) return;
  const sum = PAY.staff.reduce((a, s) => a + s.pay, 0);
  const confAt = PAY.staff.map(s => s.confirmedAt).filter(Boolean).sort().pop();
  const unres = PAY.staff.reduce((a, s) => a + s.unresolved, 0);
  $('#paybody').innerHTML = `<div class="card"><b>${PAY.month} 인건비 합계: ${won(sum)}</b><div class="muted">휴게시간 차감: 근무기록/수정에서 휴게를 적은 날은 적은 시간만큼. 그 밖의 날은 직원 탭에서 "휴게시간 사용"인 사람만 출근~퇴근 4시간 이상 30분, 8시간 30분 이상 1시간</div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${confAt ? `<span class="stamp ok">확정됨 ${mdw(confAt)} ${hhmm(confAt)}</span>` : '<span class="stamp wip">확정 전</span>'}
        <span style="flex:1"></span>
        <button class="sm pri" id="pConfirm">${confAt ? '다시 확정 (변경 반영)' : '급여 확정'}</button>
        ${confAt ? '<button class="sm" id="pKakao">카톡 안내문</button><button class="sm" id="pUnconf">확정 취소</button>' : ''}
      </div>
      <div class="muted" style="margin-top:6px">확정하면 알바가 자기 PIN으로 로그인해 <b>확정급여</b>에서 본인 명세서만 볼 수 있습니다.</div></div>` +
    PAY.staff.map(s => `<div class="card" style="border-left:5px solid ${s.color}">
      <div class="row" style="align-items:center"><div><b style="font-size:17px">${esc(s.name)}</b> <span class="muted">시급 ${won(s.wage)}</span>${s.useBreak === false ? ' <span class="badge warn">휴게 없음</span>' : ''}${s.confirmedAt ? ' <span class="badge ok">확정</span>' : ''}</div><button class="sm" data-slip="${s.id}" style="flex:0 0 auto">명세서</button></div>
      <table class="pay" style="margin-top:6px"><tr><th>근무일</th><th>총 시간</th><th>휴게</th><th>유급 시간</th><th>급여</th></tr>
      <tr><td>${s.days}일</td><td>${fmtH(s.total)}</td><td>${fmtH(s.brk)}</td><td>${fmtH(s.paid)}</td><td><b>${won(s.pay)}</b></td></tr></table>
      ${s.unresolved ? `<div class="warnlist" style="background:#fde3e3">⚠ 퇴근누락/근무중 기록 ${s.unresolved}건이 계산에서 빠졌습니다. 기록 탭에서 정리하세요.</div>` : ''}
      ${s.overWeeks.length ? `<div class="warnlist">⚠ 주 15시간 이상인 주: ${s.overWeeks.map(w => `${mdw(w.week)}주 ${fmtH(w.minutes)}`).join(', ')}<br><span class="muted">주휴수당 대상입니다. 위 금액에 포함되지 않았습니다.</span></div>` : ''}
    </div>`).join('');
  document.querySelectorAll('[data-slip]').forEach(b => b.onclick = () => { const s = PAY.staff.find(x => x.id === +b.dataset.slip); showSlip(s, PAY.month, s.confirmedAt ? `<span class="stamp ok">확정 ${ymd(s.confirmedAt)}</span>` : '<span class="stamp wip">확정 전</span>'); });
  $('#pConfirm').onclick = async () => {
    const ok = await modal(`<h3>${PAY.month} 급여 확정</h3>지금 계산된 금액으로 명세서를 확정합니다. 알바는 자기 화면의 <b>확정급여</b>에서 본인 것만 볼 수 있습니다.
      ${unres ? `<div class="warnlist" style="background:#fde3e3">⚠ 퇴근누락/근무중 기록 ${unres}건이 빠져 있습니다. 먼저 정리하는 것이 좋습니다.</div>` : ''}
      <div class="muted" style="margin-top:6px">나중에 기록을 고치면 '다시 확정'을 눌러야 알바 화면에 반영됩니다.</div>`, '확정');
    if (!ok) return;
    const r = await run(() => api('/admin/pay/confirm', { month: PAY.month }));
    if (r) { toast(`${r.count}명 명세서를 확정했습니다`); await tabPay(); kakaoNotice(); }
  };
  const kk = $('#pKakao'); if (kk) kk.onclick = kakaoNotice;
  const uc = $('#pUnconf'); if (uc) uc.onclick = async () => {
    if (!await modal(`<h3>확정 취소</h3>${PAY.month} 확정 명세서를 지웁니다. 알바 화면의 확정급여에서도 사라집니다.`, '확정 취소')) return;
    if (await run(() => api('/admin/pay/unconfirm', { month: PAY.month }))) { toast('확정을 취소했습니다'); tabPay(); }
  };
}
// 카톡방에 붙여넣을 안내문 (명세서 내용은 넣지 않음 — 각자 PIN으로 확인)
async function kakaoNotice() {
  const url = location.href.split('#')[0].split('?')[0];
  const mo = +PAY.month.slice(5);
  const text = `[우지커피] ${mo}월 급여명세서가 확정되었습니다.\n아래 링크에서 본인 PIN으로 로그인 → 맨 아래 '확정급여'를 눌러 확인해 주세요.\n(본인 명세서만 보입니다)\n${url}`;
  const v = await modal(`<h3>카톡방 안내문</h3><textarea id="kText" style="width:100%;height:130px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit">${esc(text)}</textarea>
    <div class="muted">아래 버튼으로 복사하거나 바로 공유한 뒤 알바 카톡방에 붙여넣으세요.</div>`, navigator.share ? '공유하기' : '복사하기', () => $('#kText').value, '닫기');
  if (!v) return;
  if (navigator.share) { try { await navigator.share({ text: v }); return; } catch (e) { } }
  try { await navigator.clipboard.writeText(v); toast('복사했습니다. 카톡방에 붙여넣으세요'); }
  catch (e) { toast('복사하지 못했습니다. 글을 길게 눌러 직접 복사해 주세요'); }
}
function slipHTML(s, month, label) {
  return `<div class="slip"><h2>임금명세서</h2>
    ${label ? `<div style="text-align:center;margin:-8px 0 12px">${label}</div>` : ''}
    <div class="meta"><span>사업장: <b>우지커피 광양용강점</b></span><span>지급월: <b>${month}</b></span><span>성명: <b>${esc(s.name)}</b></span></div>
    <table><tr><th>근로일수</th><th>총 근로시간</th><th>휴게시간</th><th>유급 근로시간</th><th>시급</th></tr>
    <tr><td>${s.days}일</td><td>${fmtH(s.total)}</td><td>${fmtH(s.brk)}</td><td>${fmtH(s.paid)}</td><td>${won(s.wage)}</td></tr></table>
    <h3>지급 내역</h3><table><tr><th>항목</th><th>계산 방법</th><th>금액</th></tr>
    <tr><td>기본급</td><td>${(s.paid / 60).toFixed(2)}시간 × ${won(s.wage)}</td><td>${won(s.pay)}</td></tr>
    <tr><td>공제</td><td>-</td><td>0원</td></tr>
    <tr class="tot"><th colspan="2">실 지급액</th><td>${won(s.pay)}</td></tr></table>
    <h3>근무 내역 (${s.shifts.length}회)</h3><table><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>근무</th><th>휴게</th></tr>
    ${s.shifts.map(x => `<tr><td>${mdw(x.start)}</td><td>${hhmm(x.start)}</td><td>${hhmm(x.end)}</td><td>${fmtH(x.min)}</td><td>${x.brk ? x.brk + '분' : '-'}</td></tr>`).join('') || '<tr><td colspan="5">근무 기록이 없습니다</td></tr>'}</table>
    ${s.unresolved ? `<p style="color:#d32f2f;margin-top:10px">※ 퇴근누락·근무중 기록 ${s.unresolved}건은 포함되지 않았습니다.</p>` : ''}
    <p style="margin-top:24px;text-align:right">발행일: ${ymd(Date.now())}</p></div>`;
}
// 명세서를 화면에 띄우고, 필요하면 인쇄·PDF 저장
function showSlip(s, month, label) {
  const bg = document.createElement('div'); bg.className = 'slipbg';
  bg.innerHTML = `<div class="slipbar"><button class="sm" id="slPrint">인쇄 / PDF 저장</button><button class="sm pri" id="slClose">닫기</button></div>${slipHTML(s, month, label)}`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('#slClose').onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  bg.querySelector('#slPrint').onclick = () => { $('#print').innerHTML = slipHTML(s, month, label); window.print(); };
}

async function tabStaff() {
  const COLORS = ['#e4572e', '#1d8a4b', '#3a6ea5', '#9c27b0', '#d98200', '#00897b', '#c2185b', '#5d4037'];
  $('#body').innerHTML = `<div class="card"><div class="row" style="align-items:center"><b>직원 목록</b><button class="sm pri" id="nAdd" style="flex:0 0 auto">직원 추가</button></div>
    <div class="list">${STAFF.map(s => `<div><span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${s.color}"></i> <b>${esc(s.name)}</b> <span class="muted">PIN ${esc(s.pin)} · ${won(s.wage)}</span>${s.use_break === 0 ? '<span class="badge warn">휴게 없음</span>' : '<span class="badge">휴게 있음</span>'}${s.active ? '' : '<span class="badge">퇴사</span>'}</span>
      <button class="sm" data-se="${s.id}">수정</button></div>`).join('') || '<div class="muted">등록된 직원이 없습니다.</div>'}</div></div>`;
  const edit = async s => {
    const col = s ? s.color : COLORS[STAFF.length % COLORS.length];
    const v = await modal(`<h3>${s ? '직원 수정' : '직원 추가'}</h3>
      <label>이름</label><input id="fN" value="${esc(s ? s.name : '')}">
      <label>PIN (숫자 4~6자리, 직원마다 다르게)</label><input id="fP" inputmode="numeric" value="${esc(s ? s.pin : '')}">
      <label>시급</label><input id="fW" type="number" value="${s ? s.wage : 10320}">
      <label>색상</label><input id="fC" type="color" value="${col}" style="height:44px">
      <label><input id="fB" type="checkbox" style="width:auto" ${!s || s.use_break !== 0 ? 'checked' : ''}> 휴게시간 사용</label>
      <div class="muted" style="font-size:12px;margin:-2px 0 4px 22px">체크: 출근~퇴근 4시간 이상이면 30분(8시간 30분 이상이면 1시간)을 빼고 급여 계산<br>체크 해제: 휴게 없이 근무한 시간 전부를 급여로 계산</div>
      <label><input id="fA" type="checkbox" style="width:auto" ${!s || s.active ? 'checked' : ''}> 재직 중</label>`, '저장', () =>
      ({ id: s ? s.id : null, name: $('#fN').value, pin: $('#fP').value, wage: +$('#fW').value, color: $('#fC').value, active: $('#fA').checked, use_break: $('#fB').checked }));
    if (!v) return;
    if (await run(() => api('/admin/staff', v))) { toast('저장했습니다'); renderAdmin(); }
  };
  $('#nAdd').onclick = () => edit(null);
  document.querySelectorAll('[data-se]').forEach(b => b.onclick = () => edit(STAFF.find(s => s.id === +b.dataset.se)));
}

showLogin();
