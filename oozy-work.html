<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>우지커피 근무관리</title>
<style>
:root{--bg:#f5f2ee;--card:#fff;--ink:#231f1c;--sub:#7a726b;--line:#e5dfd8;--brand:#5b3a29;--ok:#1d8a4b;--warn:#d98200;--bad:#d32f2f;--gap:#d9b94a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#ece6df;color:var(--ink)}
button.pri{background:var(--brand);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
.homebtn{display:inline-flex;align-items:center;padding:6px 11px;border-radius:10px;background:#ece6df;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
input[type=time]::-webkit-datetime-edit-ampm-field{color:#f5b800;font-weight:700}   /* 오전·오후 노란색 */
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.top h1{font-size:18px;margin:0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.muted{color:var(--sub);font-size:13px}
.big{font-size:26px;font-weight:700}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#eee;margin-left:4px}
.badge.bad{background:#fde0e0;color:var(--bad)}.badge.warn{background:#fff1d6;color:#9a5c00}.badge.ok{background:#dcf3e5;color:var(--ok)}
body.tok #out{display:none}
.practpick{display:flex;flex-direction:column;gap:8px}.practpick button{text-align:left;padding:14px;font-size:16px;font-weight:600;background:#fff;border:1.5px solid var(--line);border-radius:12px}.practpick small{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:4px}
.ver{font-size:11px;font-weight:500;color:var(--sub);margin-left:6px;letter-spacing:0;vertical-align:middle}
.kline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.kline #fK{width:80px;flex:0 0 80px}.kline #fKm{width:auto;flex:1 1 150px;min-width:140px}.kline span{flex:0 0 auto}
.plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.punchbtn{width:100%;font-size:24px;font-weight:700;padding:22px;border-radius:16px;margin-top:10px}
.punchbtn.off{background:#cfcac5;color:#fff;cursor:not-allowed}.punchbtn small{display:block;font-size:13px;font-weight:500;margin-top:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tog{flex:0 0 auto;min-width:96px;font-weight:700;border-radius:99px;padding:8px 14px}.tog.on{background:var(--ok);color:#fff}.tog.off{background:#cfcac5;color:#fff}
.outbtns{display:flex;gap:8px;margin-top:10px}
.outbtns button{flex:1 1 0;min-width:0;font-size:17px;font-weight:700;padding:14px 4px;border-radius:14px;line-height:1.25;white-space:nowrap}
.outbtns button small{display:block;font-size:12px;font-weight:400;opacity:.85}
button.warn{background:var(--warn);color:#fff}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--brand);color:#fff}
.admintabs button{font-size:14.4px;padding:9px 12.6px}
/* 로그인 */
.login{max-width:320px;margin:8vh auto;text-align:center}
.dots{display:flex;justify-content:center;gap:10px;margin:18px 0 22px;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-size:24px;padding:18px 0;background:#fff}
.pad button.pri{background:var(--brand);color:#fff;font-size:20px}
/* 주간표 */
.gridhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stcard,.stcard .big,.stcard .muted{color:#8a837d}
.snav{flex:1 1 100%!important;justify-content:center;margin-top:2px}.snav button{flex:0 0 auto!important;padding:6px 14px}.snav b{flex:0 0 auto!important;margin:0 14px}
.stabs{flex:1 1 100%!important;display:flex;justify-content:center;gap:8px}.stabs button.sm{font-size:14.3px;padding:7px 11px}
#myBox .calnav{margin-top:10px}
.mybtns{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:nowrap}.mybtns button{flex:0 0 auto;font-size:12.5px;padding:6px 14px;border-radius:9px}
.grid{display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr));overflow:hidden;margin-top:8px;min-width:0;padding-bottom:8px}
.gcol{position:relative;border-left:1px solid #d8d0c7}
.gcol.alt .ghead:not(.today){background:#ebe8e4}
.gcol.alt .gbody::after{content:'';position:absolute;inset:0;background:rgba(60,45,30,.07);pointer-events:none;z-index:0}   /* 요일 구분: 하루 걸러 회색 */
.ghead{text-align:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);height:34px}
.ghead.today{color:#fff;background:var(--brand);border-radius:8px 8px 0 0}
.tlabel{position:absolute;right:3px;font-size:11px;color:var(--sub);transform:translateY(-50%);letter-spacing:-.3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hline{position:absolute;left:0;right:0;border-top:1px dashed #eee}
.closed{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#f1eeea,#f1eeea 4px,#e9e4de 4px,#e9e4de 8px)}
.gapz{position:absolute;left:0;right:0;background:var(--gap)}
.owner{position:absolute;left:0;right:0;background:#efe9fb}
.blk{position:absolute;border-radius:6px;font-size:10px;line-height:1.2;padding:2px 3px;overflow:hidden;cursor:default}
.blk.plan{border:1.5px solid;background:transparent;z-index:2;padding:0}
.dur{position:absolute;bottom:3px;font-size:15px;font-weight:800;line-height:1.05;letter-spacing:-.5px;text-align:center;z-index:3;pointer-events:none;white-space:nowrap}
.dur.p{right:2px;color:#2a9fd8}.dur.r{left:3px;color:#d11f1f}
.blk.real{z-index:1;padding:0;border:1.5px solid;cursor:pointer}   /* 실제 근무: 예정처럼 실선 테두리 + 색 채움 */
.blk.open{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px)}
.blk.missing{background:#fff!important;border:1.5px dashed var(--bad)!important}
.blab{position:absolute;z-index:3;font-size:10px;line-height:1.2;padding:2px 3px;overflow:hidden;pointer-events:none;background:transparent}
.blab .r{font-weight:700;color:var(--ink)}
.blab .bad{color:var(--bad);font-weight:700}
.gframe{background:#1f4d34;border-radius:14px;padding:6px 8px 10px;margin-top:8px}   /* 시간표 테두리: 진녹색 */
.gframe[hidden]{display:none}
/* 관리자 근무기록: 실제 근무 칸만 색, 나머지는 모두 연한 녹색 (하루 걸러 조금 진하게) */
.admg .gapz,.admg .owner,.admg .closed{display:none}
.admg .grid{background:#dff0e2}                                   /* 요일 · 시간 칸: 옅은 녹색 */
.gframe.admg .ghead:not(.today),.gframe.admg .gcol.alt .ghead:not(.today){background:#dff0e2}
.admg .tcol{background:#dff0e2}
.admg .gbody{background:#fff}.admg .gcol.alt .gbody{background:#ecebe9}.admg .gcol.alt .gbody::after{display:none}   /* 시간표 칸: 하루 걸러 회색 · 흰색 */
.admg .ghead.today{border-radius:0;background:var(--brand);color:#fff}
.gframe .grid{margin-top:0;background:#fff;border-radius:10px}
.gframe .ghead:not(.today){background:#fff}.gframe .gcol.alt .ghead:not(.today){background:#ebe8e4}
.gframe .legend{color:#eef5ef}.gframe .legend i{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* 모달/토스트 */
.tbtn{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;font-weight:600;text-align:left;color:var(--ink)}
.tbtn .am{color:#8a7a70;font-size:1.1em}.tbtn .pm{color:#c99a00;font-size:1.1em}
.tpbg{z-index:60;background:rgba(0,0,0,.55)}
.tpick{background:#1f4d34;color:#fff;border-radius:16px;padding:16px;width:100%;max-width:360px}
.tptitle{font-size:13px;opacity:.8}.tpnow{font-size:34px;font-weight:700;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.tpnow .am,.tpap .am{color:#fff}.tpnow .pm,.tpap .pm{color:#ffd23f}
.tpnow span{font-size:1.1em}
.tpap{display:flex;gap:8px;margin-bottom:8px}.tpap button{flex:1;font-size:17.6px;font-weight:700;padding:9px;border-radius:10px;background:rgba(255,255,255,.12);border:2px solid transparent}
.tpap button.on{border-color:currentColor;background:rgba(255,255,255,.22)}
.tplab{font-size:12px;opacity:.75;margin:6px 0 4px}
.tpgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.tpgrid button{padding:9px 0;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.tpgrid button.on{background:#ffd23f;color:#1f2b22}
.tpmsg{min-height:20px;color:#ffb4a8;font-weight:700;font-size:14px;margin:10px 0 2px}
.tpbtns{display:flex;gap:8px;margin-top:6px}.tpbtns button{flex:1;padding:12px;border-radius:12px;font-size:16px;font-weight:700;background:rgba(255,255,255,.15);color:#fff}
.tpbtns button.pri{background:#ffd23f;color:#1f2b22}.tpbtns button:disabled{opacity:.35}
.mbg button[data-ok]:disabled{opacity:.4}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px}
.mbtns{display:flex;gap:8px;margin-top:16px}.mbtns button{flex:1;padding:14px}
.warnlist{background:#fff6e5;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;display:none}
.pay td,.pay th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.pay.bx{border-collapse:collapse;table-layout:fixed}.pay.bx tr.calc td{font-size:11px;color:#6b625a;background:#faf8f5;line-height:1.35}.pay.bx td,.pay.bx th{font-size:12px;padding:5px 2px;word-break:keep-all}.pay.bx td,.pay.bx th{border:1px solid #9a8f84;text-align:center}.pay.bx th{background:#f1eeea}
.pay{width:100%;border-collapse:collapse}
/* 근무표 */
.pal{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0 10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.pal button{padding:7px 11px;font-size:13px;border:2px solid transparent}
.pal button.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.tgrid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:2px;user-select:none;-webkit-user-select:none}
.tgrid.paint{touch-action:none}
.tgrid .th{font-size:12px;text-align:center;padding:5px 0;background:#404040;color:#fff;border-radius:6px}
.tgrid .tt{font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.tc{min-height:32px;background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:1px;padding:1px;cursor:pointer;position:relative}
.tc[data-k]::after{content:'';position:absolute;top:3px;bottom:3px;left:50%;border-left:1px dashed rgba(0,0,0,.18);pointer-events:none}
.chip.half{width:50%;font-size:9px;text-align:left;padding-left:1px;box-sizing:border-box}
.tc.alt,.tgrid .tt.alt{background:#ececec;border:1px solid #8a8a8a}
.tgrid .th.hl{background:#fff;color:#404040;box-shadow:inset 0 0 0 2px #404040}
.tgrid .tt.hl{background:#404040!important;color:#fff;font-weight:700;border-color:#404040}
.tc.hl{box-shadow:inset 0 0 0 2px #404040}
.tgrid .tt{border-radius:6px}
.tc.off{background:repeating-linear-gradient(45deg,#f1eeea,#f1eeea 4px,#e9e4de 4px,#e9e4de 8px);cursor:default}
.pal{display:flex;flex-wrap:wrap;gap:5px}.pal .pc{font-size:12px;padding:5px 9px;border-radius:99px;border:2px solid transparent}.pal .pc.on{border-color:#231f1c;box-shadow:0 0 0 1.5px #fff inset}
.chip{font-size:10px;line-height:1.35;border-radius:4px;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;padding:1px 0}
.chip.own{background:#cfc8e8;color:#3b315e}
.chip.gone{opacity:.4;text-decoration:line-through}
.sum td,.sum th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:right;white-space:nowrap}
.sum td:first-child,.sum th:first-child{text-align:left}
.sum{width:100%;border-collapse:collapse}
.hcirc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:12px;background:#2f6fd6;color:#fff;font-weight:700;font-size:12px}
.hcirc.over{background:var(--bad)}
.hcirc.sm{min-width:0;height:18px;padding:0 7px;font-size:11px;font-weight:600}
.scroll-x{overflow-x:auto}
#print{display:none}
/* 연습 모드 */
#pbanner{display:none;position:sticky;top:0;z-index:40;background:#ff8f00;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 8px}
body.practice #pbanner{display:block}
body.practice{background:#fff4e0}
.practbox{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.practbox .hint{background:#fff;border:2px dashed #ff8f00;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;text-align:left;margin:10px 0}
/* 명세서 화면 보기 */
.slipbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;overflow:auto;padding:16px 10px 40px}
.slipbar{max-width:720px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end;position:sticky;top:0}
.slip{max-width:720px;margin:0 auto;background:#fff;border-radius:10px;padding:22px 18px;font-size:14px;color:#222;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.slip h2{text-align:center;margin:0 0 14px;letter-spacing:2px;white-space:pre}
.slip table.wl{table-layout:fixed}.slip .wl td.kdc{text-align:left;white-space:nowrap}.slip .wl td.kdc{font-size:12px;padding-left:5px}.slip .wl td.kdc span:first-child{display:inline-block;width:2.4em}.slip .wl td.kdc.x{color:#8a5a00;font-weight:600}.slip .wl td,.slip .wl th{padding:5px 2px;font-size:12.5px}
.slip .slipft{text-align:center;font-size:20px;font-weight:700;letter-spacing:3px;margin-top:22px;padding-top:14px;border-top:1px solid #ccc}
.slip h3{font-size:15px;margin:18px 0 6px}
.slip.wlin{box-shadow:none;padding:4px 0 0;margin-top:6px;max-width:none;background:transparent}.slip.wlin h3{margin-top:4px}.slip.wlin[hidden]{display:none}
.slip .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:10px}
.slip table{width:100%;border-collapse:collapse}
.slip td,.slip th{border:1px solid #999;padding:6px 4px;text-align:center;font-size:13px;word-break:keep-all}
.slip th{background:#f1eeea}
.slip table.t6{table-layout:fixed}.slip .t6 td,.slip .t6 th{font-size:12px;padding:5px 2px}
.pay td,.pay th{word-break:keep-all}.pay.t6{table-layout:fixed}.pay.t6 td,.pay.t6 th{font-size:12px;padding:5px 2px}
.slip .tot td,.slip .tot th{font-size:15px;font-weight:700;background:#fff7e8}
.stamp{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
.stamp.ok{background:#dcf3e5;color:var(--ok)}.stamp.wip{background:#fff1d6;color:#9a5c00}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print .slip{box-shadow:none;border-radius:0;max-width:none;padding:10px}}
/* 근무기록 달력 */
.calnav{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:8px}
.calnav input{width:auto;padding:6px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cdow.sun,.cday.sun .cn{color:var(--bad)}.cdow.sat,.cday.sat .cn{color:#2f6fd6}
.cday{position:relative;min-height:42px;padding:3px 2px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer}
.cday .cn{font-size:14px;font-weight:600}
.cday.today{border:2px solid var(--brand)}
.cday.on{background:var(--brand);border-color:var(--brand)}.cday.on .cn{color:#fff!important}
.cdots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:100%}
.cdots i{width:8px;height:8px;border-radius:50%;display:block}
.cday.on .cdots i{box-shadow:0 0 0 1.5px #fff}
.cbad{position:absolute;top:2px;right:3px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--bad);border-radius:99px;width:15px;height:15px;line-height:15px;text-align:center}
.dayt{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.dayt th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.dayt td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.dayt tr.sum td{border-bottom:0;color:var(--sub)}
.dayt .cact{white-space:nowrap;text-align:right}.dayt .cact button{margin-left:3px}
.dayt .cum,.dayt .wk,.dayt .sum b{color:#555}
.dayt td.jpay{white-space:nowrap;color:#7a4a00;font-weight:600}.dayt td.jpay small{font-weight:400;color:#777}
.dayt td.mpay{white-space:nowrap;font-weight:700;color:#2e5e3a}.dayt td.mpay small{font-weight:400;color:#777;margin-left:1px}.dayt tr.sum td{color:#231f1c;font-weight:700;border-top:2px solid var(--line)}
.dayt .mnote{font-size:12.5px;color:#5b3a29;min-width:70px;white-space:normal!important}
.dayt td.wkc{background:transparent}
.dayt .hn{color:#a07800}
.dayt .wk .hn{color:#8b1a1a}
.dayt td.wkc,.dayt td.wkc .wk,.dayt td.wkc .wk .hn,.dayt tr.sum .wk,.dayt tr.sum .wk .hn{color:#c62828}
.dayt tr.otrow td:nth-child(-n+3){background:#f3e2c0}
.dayt .cum .hn{color:#1f3a73}
.dayt .rng{color:var(--ink);font-weight:600}

.mst{font-size:11px;color:var(--sub);margin-top:2px;white-space:normal}.mst.ok{color:var(--ok)}.mst.bad{color:var(--bad)}
.dayt .cmemo textarea.bad{border-color:var(--bad)}
.dayscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.swipehint{display:none}@media (max-width:560px){.swipehint{display:block}}
.dayt .cmemo{min-width:110px;width:40%}
.dayt .cmemo textarea{width:100%;min-width:100px;font:inherit;font-size:13px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:#fffdf8;transition:background .3s}
.dayt .cmemo textarea.saved{background:#dcf3e5}
.dayt th{word-break:keep-all}.dayt td:nth-child(-n+4){white-space:nowrap}.dayt td{padding:9px 3px}

<div id="pbanner">연습 모드 · 이 휴대폰에만 기록되고 실제 기록에는 반영되지 않습니다</div>

<!-- 연습 모드용: worker.js와 같은 내용 (빌드 때 자동으로 채움) -->
<script type="text/plain" id="practiceSrc">
// 우지커피 근무관리 Worker (Cloudflare Workers + D1)
// 2026-10-22 : 매장관리 오픈·마감 확인 기록(/store/*) 추가
// 2026-10-27 : 주휴수당·계약시간·휴게 정리·연습 가져오기·추가근무(시급/체크) 합침
// 2026-10-29 : 근무 구분(교육·행사·기타) 저장 — punch.tag, 교육·행사 시급 따로
// 필요한 설정
//   D1 바인딩: 변수명 DB
//   환경변수: ADMIN_PIN (필수, 6자리 이상 권장)
//            STORE_LAT, STORE_LNG, RADIUS (선택: 넣으면 매장 근처에서만 출퇴근 가능, RADIUS 기본 150m)

const KST = 9 * 3600e3, DAY = 864e5, HOUR = 3600e3, MIN = 60e3;
// 요일별 영업시간 [시작, 끝]  일 월 화 수 목 금 토 (getUTCDay 순서)
const OPEN_HOURS = [[7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22]];
const GRACE_MIN = 30;          // 오픈 전/마감 후 준비시간 허용(분)
const STALE_H = 12;            // 이 시간 넘게 퇴근 안 찍으면 '퇴근누락'
const LONG_SHIFT_H = 8;        // 이보다 길면 경고
const SCHEDULE_DIFF_MIN = 30;  // 스케줄과 이만큼 차이나면 경고
const WEEK_LIMIT_MIN = 15 * 60;// 주 15시간
const LATE_GRACE_MIN = 5;      // 이 분 이내 지각은 예정 시각으로 기록
const EXTRA_WINDOW_H = 12;     // 예정 퇴근으로 자동 처리된 뒤 이 시간 안에는 '추가근무' 가능

const CORS = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Methods': 'GET,POST,OPTIONS',
  'Access-Control-Allow-Headers': 'Content-Type,X-Pin,X-Token',
};
const json = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: { ...CORS, 'Content-Type': 'application/json; charset=utf-8' } });
const err = (m, s = 400) => json({ error: m }, s);

const k = ts => { const d = new Date(ts + KST); return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; };
const hm = ts => { const x = k(ts); return String(x.h).padStart(2, '0') + ':' + String(x.mi).padStart(2, '0'); };
const fmtH = m => `${Math.floor(m / 60)}시간${m % 60 ? ' ' + Math.round(m % 60) + '분' : ''}`;
const dayStart = ts => Math.floor((ts + KST) / DAY) * DAY - KST;
const weekStart = ts => dayStart(ts) - ((k(ts).dow + 6) % 7) * DAY;
const num = v => (typeof v === 'number' && Number.isFinite(v)) ? v : NaN;

function outside(ts) {
  const x = k(ts);
  const [o, c] = OPEN_HOURS[x.dow];
  const t = x.h * 60 + x.mi;
  return t < o * 60 - GRACE_MIN || t > c * 60 + GRACE_MIN;
}
// 휴게 차감 (출근~퇴근 시간 m분 기준). 법: 일한 시간 4시간 이상 30분, 8시간 이상 1시간
// 30분 쉬고도 일한 시간이 8시간 미만이면 30분으로 충분 → 출근~퇴근 8시간 30분 이상일 때만 1시간
const breakMin = (m, use = 1) => !use ? 0 : m >= 510 ? 60 : m >= 240 ? 30 : 0; // use=0: 휴게 없이 전부 유급
function dist(a, b, c, d) {
  const R = 6371e3, r = Math.PI / 180;
  const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function checkGps(env, b) {
  if (!env.STORE_LAT || !env.STORE_LNG) return null;
  if (b.lat == null || b.lng == null) return '위치 정보를 허용해 주세요. 매장에서만 출퇴근할 수 있습니다.';
  const d = dist(+env.STORE_LAT, +env.STORE_LNG, +b.lat, +b.lng);
  const r = +(env.RADIUS || 150);
  if (d - Math.min(+b.acc || 0, 100) > r) return `매장에서 약 ${Math.round(d)}m 떨어져 있습니다. 매장에서 눌러주세요.`;
  return null;
}

// 같은 사람의 기록끼리 겹치는지
async function overlap(env, table, staffId, s, e, exclude = 0) {
  if (table === 'punch') {
    return env.DB.prepare("SELECT id,start,end FROM punch WHERE staff_id=? AND id!=? AND status!='missing' AND start<? AND COALESCE(end,?)>?")
      .bind(staffId, exclude || 0, e, Date.now(), s).first();
  }
  return env.DB.prepare('SELECT id,start,end FROM schedule WHERE staff_id=? AND id!=? AND start<? AND end>?')
    .bind(staffId, exclude || 0, e, s).first();
}
// 퇴근을 안 누르면 예정 퇴근 시각으로 자동 기록, 예정이 없는 근무는 오래되면 '퇴근누락'
const closeStale = env => env.DB.batch([
  env.DB.prepare("UPDATE punch SET end=plan_end, status='done', end_type='auto' WHERE status='open' AND plan_end IS NOT NULL AND plan_end<=?").bind(Date.now()),
  env.DB.prepare("UPDATE punch SET status='missing' WHERE status='open' AND plan_end IS NULL AND start<?").bind(Date.now() - STALE_H * HOUR),
]);
const log = (env, id, action, before, after) => env.DB.prepare('INSERT INTO punch_log(punch_id,action,before,after,at) VALUES(?,?,?,?,?)')
  .bind(id, action, before ? JSON.stringify(before) : null, after ? JSON.stringify(after) : null, Date.now()).run();

// ===== 로그인: 이름 + 비밀번호, 한 번 로그인한 기기는 토큰으로 바로 들어감 =====
const ADMIN_NAME_DEFAULT = '황승유';                 // 관리자 이름 (Cloudflare 변수 ADMIN_NAME 이 있으면 그 값)
const APP_KEYS = ['work', 'store', 'recipe', 'ledger', 'coffee', 'stock'];   // 근무급여, 매장관리, 레시피, 카페운영, 커피회사, 재고관리
const STAFF_DEFAULT_APPS = ['work', 'store', 'recipe', 'stock'];
const appsOf = s => s.apps == null ? STAFF_DEFAULT_APPS.slice() : String(s.apps).split(',').filter(k => APP_KEYS.includes(k));
const adminName = env => String(env.ADMIN_NAME || ADMIN_NAME_DEFAULT).trim();
async function auth(req, env) {
  const tok = (req.headers.get('X-Token') || '').trim();
  if (tok) {
    const d = await env.DB.prepare('SELECT * FROM device WHERE token=?').bind(tok).first();
    if (!d) return null;
    if (d.role === 'admin') return { role: 'admin', token: tok };
    const s = await env.DB.prepare('SELECT id,name,wage,color,apps FROM staff WHERE id=? AND active=1 AND deleted=0').bind(d.staff_id).first();
    return s ? { role: 'staff', staff: s, token: tok } : null;
  }
  const pin = (req.headers.get('X-Pin') || '').trim();
  if (!pin) return null;
  if (env.ADMIN_PIN && pin === String(env.ADMIN_PIN)) return { role: 'admin' };
  const s = await env.DB.prepare('SELECT id,name,wage,color,apps FROM staff WHERE pin=? AND active=1 AND deleted=0').bind(pin).first();
  return s ? { role: 'staff', staff: s } : null;
}

// ---------- 근무표(주간 템플릿) ----------
// grid: { "요일-시": [직원id..] 또는 ["O"](사장) }  요일 0=월 … 6=일, 시 0~23 (그 시각부터 1시간)
const READY = {}; // 실제 DB / 연습 DB 각각 한 번만 준비
const BASE_SCHEMA = [
  "CREATE TABLE IF NOT EXISTS staff (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, pin TEXT NOT NULL UNIQUE, wage INTEGER NOT NULL DEFAULT 10320, color TEXT NOT NULL DEFAULT '#4f7cff', active INTEGER NOT NULL DEFAULT 1)",
  'CREATE TABLE IF NOT EXISTS schedule (id INTEGER PRIMARY KEY AUTOINCREMENT, staff_id INTEGER NOT NULL, start INTEGER NOT NULL, end INTEGER NOT NULL)',
  "CREATE TABLE IF NOT EXISTS punch (id INTEGER PRIMARY KEY AUTOINCREMENT, staff_id INTEGER NOT NULL, start INTEGER NOT NULL, end INTEGER, status TEXT NOT NULL DEFAULT 'open', note TEXT, edited INTEGER NOT NULL DEFAULT 0, created INTEGER)",
  "CREATE TABLE IF NOT EXISTS edit_request (id INTEGER PRIMARY KEY AUTOINCREMENT, punch_id INTEGER, staff_id INTEGER NOT NULL, start INTEGER NOT NULL, end INTEGER NOT NULL, reason TEXT, status TEXT NOT NULL DEFAULT 'pending', created INTEGER)",
  'CREATE TABLE IF NOT EXISTS punch_log (id INTEGER PRIMARY KEY AUTOINCREMENT, punch_id INTEGER, action TEXT, before TEXT, after TEXT, at INTEGER)',
];
async function ensureSettings(env) {
  const key = env.PRACTICE ? 'p' : 'r';
  if (READY[key]) return;
  if (env.PRACTICE) await env.DB.batch(BASE_SCHEMA.map(q => env.DB.prepare(q)));   // 연습 DB는 표도 자동 생성
  await env.DB.prepare('CREATE TABLE IF NOT EXISTS settings (k TEXT PRIMARY KEY, v TEXT)').run();
  await env.DB.prepare('CREATE TABLE IF NOT EXISTS payslip (staff_id INTEGER NOT NULL, month TEXT NOT NULL, data TEXT, at INTEGER, PRIMARY KEY(staff_id, month))').run();
  // 출퇴근 방식 변경으로 추가된 칸 (이미 있으면 무시)
  for (const col of ['plan_start INTEGER', 'plan_end INTEGER', 'raw_start INTEGER', 'raw_end INTEGER', 'end_type TEXT', 'brk_min INTEGER', 'memo TEXT', 'ot INTEGER', 'tag TEXT']) {   // brk_min: 기록한 휴게(분), 비어 있으면 자동 계산
    try { await env.DB.prepare('ALTER TABLE punch ADD COLUMN ' + col).run(); } catch (e) { }
  }
  try { await env.DB.prepare('ALTER TABLE staff ADD COLUMN use_break INTEGER NOT NULL DEFAULT 1').run(); } catch (e) { } // 휴게시간 사용 여부
  try { await env.DB.prepare('ALTER TABLE staff ADD COLUMN deleted INTEGER NOT NULL DEFAULT 0').run(); } catch (e) { } // 삭제한 직원 (지난 기록만 남김)
  try { await env.DB.prepare('ALTER TABLE staff ADD COLUMN apps TEXT').run(); } catch (e) { }   // 쓸 수 있는 앱 (비어 있으면 기본)
  await env.DB.prepare('CREATE TABLE IF NOT EXISTS contract (staff_id INTEGER NOT NULL, month TEXT NOT NULL, weekly_min INTEGER NOT NULL, PRIMARY KEY(staff_id, month))').run();   // 주 계약시간 (그 달부터 적용)
  // 매장관리: 오픈·마감 확인 기록
  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS store_check (date TEXT NOT NULL, kind TEXT NOT NULL, item TEXT NOT NULL, title TEXT,
    staff_id INTEGER, name TEXT NOT NULL, color TEXT NOT NULL, at INTEGER NOT NULL, PRIMARY KEY(date, kind, item))`).run();
  // 재고관리: 품목 목록 + 날짜별 수량 기록
  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS stock_item (id INTEGER PRIMARY KEY AUTOINCREMENT, cat TEXT NOT NULL,
    name TEXT NOT NULL, spec TEXT, base TEXT, sort INTEGER NOT NULL DEFAULT 0, deleted INTEGER NOT NULL DEFAULT 0)`).run();
  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS stock_log (date TEXT NOT NULL, item INTEGER NOT NULL, qty TEXT, buy TEXT, note TEXT,
    staff_id INTEGER, name TEXT NOT NULL, color TEXT NOT NULL, at INTEGER NOT NULL, PRIMARY KEY(date, item))`).run();
  // 기준량·구매량 칸 (예전에 만든 표에는 없으므로 뒤에 붙임, 이미 있으면 무시)
  try { await env.DB.prepare('ALTER TABLE stock_item ADD COLUMN base TEXT').run(); } catch (e) { }
  try { await env.DB.prepare('ALTER TABLE stock_log ADD COLUMN buy TEXT').run(); } catch (e) { }
  await env.DB.prepare('CREATE TABLE IF NOT EXISTS device (token TEXT PRIMARY KEY, role TEXT NOT NULL, staff_id INTEGER, ua TEXT, created INTEGER, seen INTEGER)').run();
  READY[key] = true;
  if (env.PRACTICE && !(await env.DB.prepare('SELECT COUNT(*) c FROM staff').first()).c) await seedPractice(env);
}

// ---------- 연습 모드 ----------
// 연습 때는 이 파일을 휴대폰 브라우저가 직접 불러와 실행하고, 기록은 그 휴대폰 안에만 저장됨 (서버와 무관)
// 연습용 데이터: 사장 PIN 0000, 알바 연습A 1111 / 연습B 2222 / 연습C 3333
async function seedPractice(env) {
  await env.DB.batch(['staff', 'schedule', 'punch', 'edit_request', 'punch_log', 'payslip', 'settings'].map(t => env.DB.prepare('DELETE FROM ' + t)));
  const ids = [];
  for (const [n, pin, c] of [['연습A', '1111', '#e4572e'], ['연습B', '2222', '#1d8a4b'], ['연습C', '3333', '#3a6ea5']]) {
    const r = await env.DB.prepare('INSERT INTO staff(name,pin,wage,color) VALUES(?,?,10320,?)').bind(n, pin, c).run();
    ids.push(r.meta.last_row_id);
  }
  const [A, B, C] = ids, g = defaultTemplate().grid, put = (d, a, z, id) => { for (let h = a; h < z; h++) (g[d + '-' + h] = g[d + '-' + h] || []).push(id); };
  for (let d = 0; d < 5; d++) { put(d, 7, 13, A); put(d, 16, 19, B); }
  for (const d of [5, 6]) { put(d, 9, 15, C); put(d, 15, 21, B); }
  await env.DB.prepare("INSERT INTO settings(k,v) VALUES('template',?)").bind(JSON.stringify({ grid: g, updated: Date.now() })).run();
  const now = Date.now(), ws = weekStart(now), today = Math.floor((dayStart(now) - ws) / DAY);
  const stmts = [];
  for (let d = 0; d < 7; d++) for (const id of ids) {
    let s = -1;
    for (let h = 0; h <= 24; h++) {
      const on = h < 24 && (g[d + '-' + h] || []).includes(id);
      if (on && s < 0) s = h;
      if (!on && s >= 0) {
        const st = ws + d * DAY + s * HOUR, en = ws + d * DAY + h * HOUR;
        if (d !== today) stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(id, st, en));
        if (d < today) { // 지난 날은 실제 근무 기록도 만들어 둠 (출근 0~7분 차이, 예정 퇴근 자동)
          const late = ((id * 7 + d * 3) % 8) * MIN, rs = late > 5 * MIN ? st + late : st;
          stmts.push(env.DB.prepare("INSERT INTO punch(staff_id,start,end,status,created,plan_start,plan_end,raw_start,end_type) VALUES(?,?,?,'done',?,?,?,?,'auto')").bind(id, rs, en, st + late, st, en, st + late));
        }
        s = -1;
      }
    }
  }
  // 오늘은 지금 바로 출퇴근 연습이 되도록: 연습A 지금 시작(정시 출근), 연습B 20분 뒤 시작(일찍 출근), 연습C는 예정 없음
  const t0 = Math.floor(now / (5 * MIN)) * 5 * MIN;
  stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(A, t0, t0 + 3 * HOUR));
  stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(B, t0 + 20 * MIN, t0 + 20 * MIN + 4 * HOUR));
  await env.DB.batch(stmts);
}
function defaultTemplate() { // 엑셀 근무표의 사장님 칸
  const g = {}, add = (d, hs) => hs.forEach(h => g[d + '-' + h] = ['O']);
  add(0, [13, 14, 15, 19, 20]); add(1, [13, 14, 15, 19, 20]);
  for (const d of [2, 3, 4]) add(d, [14, 15, 19, 20]);
  return { grid: g, saved: false };
}
function parseTemplate(row) {
  if (!row || !row.v) return defaultTemplate();
  try { const t = JSON.parse(row.v); return { grid: t.grid || {}, saved: true, updated: t.updated }; } catch { return defaultTemplate(); }
}
function cleanGrid(g) {
  const out = {};
  if (!g || typeof g !== 'object') return out;
  for (const [key, val] of Object.entries(g)) {
    if (!/^[0-6]-(\d|1\d|2[0-3])(\.5)?$/.test(key) || !Array.isArray(val)) continue;
    const v = val.includes('O') ? ['O'] : [...new Set(val.map(Number).filter(n => Number.isInteger(n) && n > 0))].slice(0, 6);
    if (v.length) out[key] = v;
  }
  return out;
}
const ownerKeys = grid => Object.keys(grid).filter(k => grid[k].includes('O'));

// 퇴근을 안 눌러 예정 퇴근으로 자동 처리된 마지막 근무 — 추가근무·나가기 대상
async function lastExtendable(env, id, now) {
  const r = await env.DB.prepare("SELECT * FROM punch WHERE staff_id=? AND status='done' ORDER BY start DESC LIMIT 1").bind(id).first();
  if (!r || !r.plan_end || r.end_type !== 'auto' || r.end > now || now - r.end > EXTRA_WINDOW_H * HOUR) return null;
  return r;
}

// 월 급여 계산 (onlyId가 있으면 그 직원만)
// 출근하기 버튼: 관리자가 켜기 전까지 잠김 (연습 모드는 켜짐)
async function punchEnabled(env) {
  const r = await env.DB.prepare("SELECT v FROM settings WHERE k='punch_on'").first();
  return r ? r.v === '1' : !!env.PRACTICE;
}
const MIN_WAGE = 10320;   // 법정 최저시급 (2026년) — 직원 시급의 기본값
async function baseWageOf(env) { const r = await env.DB.prepare("SELECT v FROM settings WHERE k='base_wage'").first(); return r && +r.v ? +r.v : MIN_WAGE; }
async function wageSet(env, k) { const r = await env.DB.prepare('SELECT v FROM settings WHERE k=?').bind(k).first(); return r && +r.v ? +r.v : null; }
const KIND = r => r.ot ? 'ot' : /(^|,)교육(,|$)/.test(r.tag || '') ? 'edu' : /(^|,)행사(,|$)/.test(r.tag || '') ? 'evt' : 'base';   // 시급 구분: 추가 > 교육 > 행사 > 기본
async function otWageOf(env) { const r = await env.DB.prepare("SELECT v FROM settings WHERE k='ot_wage'").first(); return r && +r.v ? +r.v : null; }
async function computePay(env, month, onlyId) {
  const mm = /^(\d{4})-(\d{2})$/.exec(month || '');
  if (!mm) return { error: 'month=YYYY-MM 형식이 필요합니다.' };
  const y = +mm[1], mo = +mm[2];
  const from = Date.UTC(y, mo - 1, 1) - KST, to = Date.UTC(y, mo, 1) - KST;
  const wFrom = weekStart(from), wTo = weekStart(to - 1) + 7 * DAY;
  const one = onlyId ? ' AND staff_id=' + (+onlyId) : '';
  const staff = (await env.DB.prepare('SELECT * FROM staff' + (onlyId ? ' WHERE id=' + (+onlyId) : '')).all()).results;
  const rows = (await env.DB.prepare("SELECT * FROM punch WHERE status='done' AND start>=? AND start<?" + one + " ORDER BY start").bind(wFrom, wTo).all()).results;
  const pending = (await env.DB.prepare("SELECT staff_id, COUNT(*) c FROM punch WHERE status IN ('open','missing') AND start>=? AND start<?" + one + " GROUP BY staff_id").bind(from, to).all()).results;
  const sched = (await env.DB.prepare('SELECT staff_id,start FROM schedule WHERE start>=? AND start<?' + one).bind(wFrom, wTo).all()).results;
  const lastWork = (await env.DB.prepare("SELECT staff_id, MAX(start) t FROM punch WHERE status='done'" + one + " GROUP BY staff_id").all()).results;
  const nowT = Date.now(), otW = await otWageOf(env), eduW = await wageSet(env, 'edu_wage'), evtW = await wageSet(env, 'evt_wage');
  const contracts = (await env.DB.prepare('SELECT * FROM contract' + (onlyId ? ' WHERE staff_id=' + (+onlyId) : '') + ' ORDER BY month').all()).results;
  const contractAt = (sid, ym) => { let c = null; contracts.forEach(r => { if (r.staff_id === sid && r.month <= ym) c = r; }); return c; };
  const out = staff.map(s => {
    const mine = rows.filter(r => r.staff_id === s.id);
    const weeks = {}, shifts = [];
    for (const r of mine) {
      const min = Math.round((r.end - r.start) / MIN), brk = r.brk_min != null ? Math.min(+r.brk_min, min) : breakMin(min, s.use_break), paid = min - brk;   // 순서: 직원 설정(기본) → 기록에 적은 휴게가 있으면 그 값
      const w = weekStart(r.start), ot = r.ot ? 1 : 0;
      if (!ot) weeks[w] = (weeks[w] || 0) + paid;                 // 추가근무는 주휴 기준 시간(소정근로)에서 뺀다
      if (r.start >= from && r.start < to) shifts.push({ id: r.id, start: r.start, end: r.end, min, brk, paid, ot, tag: r.tag || null, kind: KIND(r), edited: r.edited, end_type: r.end_type, memo: r.memo || null });
    }
    const total = shifts.reduce((a, x) => a + x.min, 0), brk = shifts.reduce((a, x) => a + x.brk, 0), paid = total - brk;
    const sumK = kd => shifts.filter(x => x.kind === kd).reduce((a, x) => a + x.paid, 0);
    const otPaid = sumK('ot'), eduPaid = sumK('edu'), evtPaid = sumK('evt'), basePaid = paid - otPaid - eduPaid - evtPaid;
    const otWage = otW || s.wage, eduWage = eduW || s.wage, evtWage = evtW || s.wage;
    const basePay = Math.floor(basePaid * s.wage / 60), otPay = Math.floor(otPaid * otWage / 60);
    const eduPay = Math.floor(eduPaid * eduWage / 60), evtPay = Math.floor(evtPaid * evtWage / 60);
    // 주휴수당: 그 주 일요일이 이달에 속한 주만. 주 15시간 이상 + 예정일 개근 + 주가 끝났고 다음 주에도 근로관계가 이어질 때
    const juhuWeeks = []; let juhu = 0;
    const lw = (lastWork.find(x => x.staff_id === s.id) || {}).t || 0;
    for (const [wk, mins] of Object.entries(weeks)) {
      const w = +wk, we = w + 7 * DAY, sun = we - DAY;
      if (sun < from || sun >= to) continue;
      const worked = new Set(mine.filter(r => r.start >= w && r.start < we).map(r => dayStart(r.start)));
      const planned = [...new Set(sched.filter(r => r.staff_id === s.id && r.start >= w && r.start < we).map(r => dayStart(r.start)))];
      const missed = planned.filter(d => d < nowT && !worked.has(d)).length;
      // 주휴 기준 시간: 그 주(일요일이 속한 달)의 주 계약시간, 없으면 실제 근무시간
      const c = contractAt(s.id, new Date(sun + KST).toISOString().slice(0, 7));
      const base = c ? c.weekly_min : mins, basis = c ? 'contract' : 'actual';
      let reason = '';
      if (we > nowT) reason = '이번 주 진행 중 (주가 끝나면 계산)';
      else if (base < WEEK_LIMIT_MIN) reason = c ? `주 15시간 미만 계약 (계약 주 ${+(base / 60).toFixed(1)}시간)` : `주 15시간 미만 (실근무 ${+(mins / 60).toFixed(1)}시간)`;
      else if (missed) reason = `예정일 결근 ${missed}일`;
      else if ((!s.active || s.deleted) && lw < we) reason = '퇴사 (다음 주 근로 없음)';
      const ok = !reason, amount = ok ? Math.floor(Math.min(base, 40 * 60) / (40 * 60) * 8 * s.wage) : 0;
      juhuWeeks.push({ week: w, minutes: mins, base, basis, ok, reason, amount }); juhu += amount;
    }
    juhuWeeks.sort((a, b) => a.week - b.week);
    const days = new Set(shifts.map(x => dayStart(x.start))).size;
    const overWeeks = Object.entries(weeks).filter(([, v]) => v >= WEEK_LIMIT_MIN).map(([w, v]) => ({ week: +w, minutes: v }));
    const pc = pending.find(x => x.staff_id === s.id);
    return { id: s.id, name: s.name, wage: s.wage, color: s.color, active: s.active, useBreak: s.use_break !== 0, days, total, brk, paid, basePaid, otPaid, otWage, basePay, otPay, eduPaid, eduWage, eduPay, evtPaid, evtWage, evtPay, pay: basePay + otPay + eduPay + evtPay, juhu, juhuWeeks, payTotal: basePay + otPay + eduPay + evtPay + juhu, shifts, overWeeks, unresolved: pc ? pc.c : 0 };
  }).filter(x => onlyId || x.shifts.length || x.unresolved || x.active || x.juhu);
  return { month: `${y}-${String(mo).padStart(2, '0')}`, staff: out };
}

function validRange(s, e) {
  if (!Number.isFinite(s) || !Number.isFinite(e)) return '시간 값이 올바르지 않습니다.';
  if (e <= s) return '퇴근 시간이 출근 시간보다 늦어야 합니다.';
  if (e - s > 16 * HOUR) return '한 번 근무가 16시간을 넘을 수 없습니다.';
  return null;
}

async function route(req, env) {
  const url = new URL(req.url), p = url.pathname, m = req.method;
  const b = m === 'POST' ? await req.json().catch(() => ({})) : {};
  await ensureSettings(env);
  // 관리자 연습: 실제 자료(백업 형식)를 연습장에 그대로 옮겨 담음 — 연습 모드에서만
  if (p === '/practice/import' && m === 'POST') {

      if (s) row = { role: 'staff', staff_id: s.id, name: s.name, apps: appsOf(s) };
    }
    if (!row) return err('이름 또는 비밀번호가 맞지 않습니다.', 401);
    const token = crypto.randomUUID() + '-' + crypto.randomUUID();
    const t = Date.now();

    return json({ token, role: row.role, name: row.name, apps: row.apps });

  }
  // 퇴근누락 정리는 기록을 다루는 요청에서만 (조회 속도 위해 /week, /login 제외)
  if (p !== '/week' && p !== '/login' && !p.startsWith('/store/') && !p.startsWith('/stock/')) await closeStale(env);

        ['토핑', [['쿠키분태', ''], ['오레오', ''], ['핑거쿠키', ''], ['아몬드슬라이스', ''], ['그래놀라', ''],
          ['초코크런치볼', ''], ['다크블라썸', ''], ['메이플팝콘', ''], ['카라멜팝콘', ''], ['시나몬', ''], ['황설탕', ''], ['맛소금', '']]],
        ['컵 · 포장재', [['10oz 아이스컵', ''], ['20oz 아이스컵', ''], ['24oz 아이스컵', ''], ['핫컵', ''], ['컵 뚜껑', ''],
          ['컵홀더', ''], ['빨대', ''], ['파우치봉투', ''], ['각대봉투', ''], ['포장박스(소)', ''], ['포장박스(대)', ''],
          ['소스용기', ''], ['캐리어', ''], ['냅킨', ''], ['물티슈', '']]],
      ];
      const st = [];
      let n = 0;
      for (const [cat, list] of SEED) for (const [name, spec] of list)
        st.push(env.DB.prepare('INSERT INTO stock_item(cat,name,spec,sort) VALUES(?,?,?,?)').bind(cat, name, spec, n += 10));
      for (let i = 0; i < st.length; i += 40) await env.DB.batch(st.slice(i, i + 40));   // 한 번에 너무 많이 넣지 않도록
      globalThis.__stockSeeded = true;
    };

    // 품목 목록
    if (p === '/stock/items' && m === 'GET') {
      await seedStock();
      return json({ items: await itemsOf() });
    }

    // 품목 추가
    if (p === '/stock/item' && m === 'POST') {
      const cat = String(b.cat || '').trim().slice(0, 30), name = String(b.name || '').trim().slice(0, 40);
      const spec = String(b.spec || '').trim().slice(0, 60);
      if (!cat || !name) return err('분류와 품목 이름을 넣어주세요.');
      const dup = await env.DB.prepare('SELECT id FROM stock_item WHERE deleted=0 AND cat=? AND name=?').bind(cat, name).first();
      if (dup) return err('같은 분류에 같은 이름의 품목이 이미 있습니다.');
      const mx = (await env.DB.prepare('SELECT COALESCE(MAX(sort),0) s FROM stock_item WHERE cat=?').bind(cat).first()).s;
      const r = await env.DB.prepare('INSERT INTO stock_item(cat,name,spec,sort) VALUES(?,?,?,?)').bind(cat, name, spec, mx + 1).run();
      return json({ ok: true, id: r.meta.last_row_id, items: await itemsOf() });
    }

    // 품목 삭제 (지난 기록은 그대로 남음)
    if (p === '/stock/item/del' && m === 'POST') {
      const id = Number(b.id || 0);
      if (!id) return err('잘못된 요청입니다.');
      await env.DB.prepare('UPDATE stock_item SET deleted=1 WHERE id=?').bind(id).run();
      return json({ ok: true, items: await itemsOf() });
    }

    // 그날 수량 + 직원 색 목록
    if (p === '/stock/day' && m === 'GET') {
      await seedStock();
      const date = url.searchParams.get('date') || ymdK(now);
      if (!okDate(date)) return err('날짜 형식(YYYY-MM-DD)이 올바르지 않습니다.');
      const [rows, st] = await env.DB.batch([
        env.DB.prepare('SELECT item,qty,note,name,color,at FROM stock_log WHERE date=?').bind(date),
        env.DB.prepare('SELECT id,name,color,apps FROM staff WHERE active=1 AND deleted=0 ORDER BY id'),
      ]);
      const rec = {};
      for (const r of rows.results) rec[r.item] = { qty: r.qty, note: r.note, name: r.name, color: r.color, at: r.at };
      const staff = [{ id: null, name: adminName(env), color: OWNER_COLOR, owner: 1 }]
        .concat(st.results.filter(s => appsOf(s).includes('stock')).map(s => ({ id: s.id, name: s.name, color: s.color })));
      return json({ date, today: ymdK(now), items: await itemsOf(), rec, staff, me: who });
    }

    // 수량 · 비고 저장 (여러 줄을 한 번에)
    if (p === '/stock/day' && m === 'POST') {
      const date = String(b.date || '').trim();
      if (!okDate(date)) return err('날짜 형식(YYYY-MM-DD)이 올바르지 않습니다.');
      const list = (Array.isArray(b.rows) ? b.rows : [b]).slice(0, 200);
      const st = [];
      for (const r of list) {
        const id = Number(r.item || 0);
        if (!id) continue;
        const qty = String(r.qty == null ? '' : r.qty).trim().slice(0, 20);
        const note = String(r.note == null ? '' : r.note).trim().slice(0, 80);
        if (!qty && !note) st.push(env.DB.prepare('DELETE FROM stock_log WHERE date=? AND item=?').bind(date, id));
        else st.push(env.DB.prepare(`INSERT INTO stock_log(date,item,qty,note,staff_id,name,color,at) VALUES(?,?,?,?,?,?,?,?)
          ON CONFLICT(date,item) DO UPDATE SET qty=excluded.qty, note=excluded.note, staff_id=excluded.staff_id,
            name=excluded.name, color=excluded.color, at=excluded.at`)
          .bind(date, id, qty, note, who.id, who.name, who.color, now));
      }
      if (!st.length) return err('저장할 내용이 없습니다.');
      for (let i = 0; i < st.length; i += 40) await env.DB.batch(st.slice(i, i + 40));
      return json({ ok: true, n: st.length, by: who, at: now });
    }

    // 달력용: 그 달에 기록이 있는 날짜와 적은 사람
    if (p === '/stock/days' && m === 'GET') {
      const mo = String(url.searchParams.get('month') || '').trim();
      if (!/^\d{4}-\d{2}$/.test(mo)) return err('month=YYYY-MM 형식이 필요합니다.');
      const rows = (await env.DB.prepare('SELECT date,name,color,COUNT(*) c FROM stock_log WHERE date LIKE ? GROUP BY date,name,color')
        .bind(mo + '-%').all()).results;
      const days = {};
      for (const r of rows) {
        const d = days[r.date] || (days[r.date] = { n: 0, who: [] });
        d.n += r.c;
        if (!d.who.some(w => w.name === r.name)) d.who.push({ name: r.name, color: r.color });
      }
      return json({ month: mo, days });
    }
    return err('재고관리: 알 수 없는 요청입니다.', 404);
  }

  // ---------- 직원 ----------
  if (me.role === 'staff') {
    if (!appsOf(me.staff).includes('work') && p !== '/week') return err('근무·급여를 쓸 권한이 없습니다. 관리자에게 문의하세요.', 403);
    const id = me.staff.id;

    if (p === '/status') {
      const punchOn = await punchEnabled(env);
      const open = await env.DB.prepare("SELECT * FROM punch WHERE staff_id=? AND status='open'").bind(id).first();
      const recent = (await env.DB.prepare('SELECT * FROM punch WHERE staff_id=? ORDER BY start DESC LIMIT 20').bind(id).all()).results;
      const requests = (await env.DB.prepare("SELECT * FROM edit_request WHERE staff_id=? AND status='pending' ORDER BY created DESC").bind(id).all()).results;
      const last = open ? null : await lastExtendable(env, id, now);
      return json({ open, recent, requests, last, punchOn });
    }

    if (p === '/punch/in' && m === 'POST') {
      if (!await punchEnabled(env)) return err('지금은 출근하기 버튼이 잠겨 있습니다. 관리자에게 문의하세요.', 403);
      const open = await env.DB.prepare("SELECT id FROM punch WHERE staff_id=? AND status='open'").bind(id).first();
      if (open) return err('이미 출근 상태입니다.', 409);
      const last = await env.DB.prepare('SELECT MAX(COALESCE(raw_end,created)) t FROM punch WHERE staff_id=?').bind(id).first();
      if (last && last.t && now - last.t < MIN) return err('방금 기록되었습니다. 잠시 후 다시 시도하세요.', 409);
      const g = checkGps(env, b); if (g) return err(g, 403);

      // 지금 해당하는 예정 스케줄: 아직 끝나지 않은 것 중 가장 이른 것 (3시간 전부터 인정)
      const sch = await env.DB.prepare('SELECT * FROM schedule WHERE staff_id=? AND end>? AND start<? ORDER BY start LIMIT 1').bind(id, now, now + 3 * HOUR).first();
      const warns = [];
      let start = now;
      if (sch) {
        const late = (now - sch.start) / MIN;
        if (late <= LATE_GRACE_MIN) start = sch.start;               // 일찍 오거나 5분 이내 → 예정 시각
        else warns.push(`예정 출근(${hm(sch.start)})보다 ${Math.round(late)}분 늦어 실제 시각 ${hm(now)}로 기록됩니다.`);
        if (late < -SCHEDULE_DIFF_MIN) warns.push(`예정 출근(${hm(sch.start)})보다 ${Math.round(-late)}분 일찍 눌렀습니다. ${hm(sch.start)}부터 기록됩니다.`);
      } else {
        warns.push('지금 시간에 예정된 스케줄이 없습니다. 실제 시각으로 기록되고, 퇴근 버튼을 꼭 눌러야 합니다.');
        if (outside(now)) warns.push('지금은 영업시간 밖입니다.');
      }
      if (await overlap(env, 'punch', id, start, start + 1)) return err('이 시간에 이미 근무 기록이 있습니다. 사장님께 문의하세요.', 409);
      if (warns.length && !b.confirm) return json({ needConfirm: true, warns });
      const r = await env.DB.prepare("INSERT INTO punch(staff_id,start,status,note,created,plan_start,plan_end,raw_start) VALUES(?,?, 'open', ?, ?, ?, ?, ?)")
        .bind(id, start, warns.join(' / ') || null, now, sch ? sch.start : null, sch ? sch.end : null, now).run();
      await log(env, r.meta.last_row_id, 'in', null, { start, raw: now });
      return json({ ok: true, at: start, raw: now, planEnd: sch ? sch.end : null });
    }

    // 퇴근: type = normal(나가기·정시) / early(조기퇴근) / extra(추가근무)
    if (p === '/punch/out' && m === 'POST') {
      const type = ['normal', 'early', 'extra'].includes(b.type) ? b.type : 'normal';
      let row = await env.DB.prepare("SELECT * FROM punch WHERE staff_id=? AND status='open'").bind(id).first();
      if (!row && type !== 'early') row = await lastExtendable(env, id, now);   // 예정 퇴근으로 자동 처리된 뒤 추가근무·나가기
      if (!row) return err(type === 'early' ? '근무 중인 기록이 없습니다. 이미 예정 퇴근 시각으로 기록되었을 수 있습니다.' : '출근 기록이 없습니다. 출근을 안 찍었다면 "누락 기록 추가 요청"을 해주세요.', 409);
      if (now - (row.raw_start || row.start) < MIN) return err('방금 출근했습니다. 잠시 후 다시 시도하세요.', 409);
      const g = checkGps(env, b); if (g) return err(g, 403);
      const pe = row.plan_end, warns = [];
      let end = now;
      if (type === 'normal') {
        if (pe) {
          end = pe;
          if (now < pe - 10 * MIN) warns.push(`예정 퇴근(${hm(pe)})보다 ${Math.round((pe - now) / MIN)}분 이릅니다. 일찍 가는 거라면 '조기퇴근'을 눌러주세요. 그래도 ${hm(pe)} 정시퇴근으로 기록할까요?`);
          if (now > pe + 10 * MIN) warns.push(`예정 퇴근(${hm(pe)})보다 ${Math.round((now - pe) / MIN)}분 늦었습니다. 더 일했다면 '추가근무'를 눌러주세요. 그래도 ${hm(pe)}로 기록할까요?`);
        }
      } else if (type === 'early') {
        if (pe && now >= pe) return err(`예정 퇴근(${hm(pe)})이 지났습니다. '나가기'를 누르세요.`, 409);
      } else {
        if (pe && now <= pe) return err(`아직 예정 퇴근(${hm(pe)}) 전입니다. 예정 시간이 지난 뒤 눌러주세요.`, 409);
      }
      if (end <= row.start) return err(`출근 기록(${hm(row.start)})보다 이른 시각으로는 퇴근할 수 없습니다.`, 409);
      const len = (end - row.start) / MIN;
      if (len > LONG_SHIFT_H * 60) warns.push(`이번 근무가 ${fmtH(Math.round(len))}입니다. 맞나요?`);
      if (warns.length && !b.confirm) return json({ needConfirm: true, warns });
      const note = [row.note, ...(type === 'normal' ? warns : [])].filter(Boolean).join(' / ') || null;
      await env.DB.prepare("UPDATE punch SET end=?, status='done', end_type=?, raw_end=?, note=? WHERE id=?").bind(end, type, now, note, row.id).run();
      await log(env, row.id, 'out_' + type, { end: row.end }, { end, raw: now });
      return json({ ok: true, at: end, type, minutes: Math.round(len) });
    }

    // 내 급여: 현재까지(실시간) / 확정 명세서 목록 / 확정 명세서 하나
    if (p === '/my/pay') {
      const r = await computePay(env, url.searchParams.get('month'), id);
      if (r.error) return err(r.error);
      return json({ month: r.month, slip: r.staff[0] || null });
    }
    if (p === '/my/payslips') {
      const rows = (await env.DB.prepare('SELECT month, at, data FROM payslip WHERE staff_id=? ORDER BY month DESC').bind(id).all()).results;
      return json(rows.map(r => { let d = {}; try { d = JSON.parse(r.data); } catch (e) { } return { month: r.month, at: r.at, slip: d }; }));
    }

    if (p === '/request' && m === 'POST') {
      const s = num(b.start), e = num(b.end);
      const v = validRange(s, e); if (v) return err(v);
      if (e > now + 10 * MIN) return err('아직 지나지 않은 시간은 요청할 수 없습니다.');
      const pid = b.punch_id ? +b.punch_id : 0;
      if (pid) {
        const own = await env.DB.prepare('SELECT id FROM punch WHERE id=? AND staff_id=?').bind(pid, id).first();
        if (!own) return err('본인 기록만 수정 요청할 수 있습니다.', 403);
      }
      if (await overlap(env, 'punch', id, s, e, pid)) return err('본인의 다른 근무 기록과 시간이 겹칩니다. 시간을 확인해 주세요.', 409);
      const dup = await env.DB.prepare("SELECT id FROM edit_request WHERE staff_id=? AND status='pending' AND start<? AND end>?").bind(id, e, s).first();
      if (dup) return err('같은 시간대에 이미 보낸 요청이 있습니다.', 409);
      await env.DB.prepare('INSERT INTO edit_request(punch_id,staff_id,start,end,reason,created) VALUES(?,?,?,?,?,?)')
        .bind(pid || null, id, s, e, String(b.reason || '').slice(0, 200), now).run();
      return json({ ok: true });
    }
    return err('권한이 없습니다.', 403);
  }

  // ---------- 관리자 ----------
  if (p === '/admin/staff' && m === 'GET') {
    const st = (await env.DB.prepare('SELECT * FROM staff WHERE deleted=0 ORDER BY active DESC, id').all()).results;
    const ct = (await env.DB.prepare('SELECT * FROM contract ORDER BY month').all()).results;
    st.forEach(s => { s.contracts = ct.filter(c => c.staff_id === s.id).map(c => ({ month: c.month, min: c.weekly_min })); });
    return json(st);
  }
  // 직원 삭제: 기록이 없으면 완전히 지우고, 출퇴근·급여 기록이 있으면 기록은 남기고 목록에서만 뺀다
  if (p === '/admin/staff/delete' && m === 'POST') {
    const sid = +b.id;
    const s = await env.DB.prepare('SELECT * FROM staff WHERE id=?').bind(sid).first();
    if (!s) return err('직원을 찾을 수 없습니다.', 404);
    const np = (await env.DB.prepare('SELECT COUNT(*) c FROM punch WHERE staff_id=?').bind(sid).first()).c;
    const ns = (await env.DB.prepare('SELECT COUNT(*) c FROM payslip WHERE staff_id=?').bind(sid).first()).c;
    const keep = np + ns > 0;
    // 근무표에서 이 직원 빼기
    const t = await env.DB.prepare("SELECT v FROM settings WHERE k='template'").first();
    const stmts = [];
    if (t && t.v) { try { const o = JSON.parse(t.v), g = o.grid || {};
      for (const k of Object.keys(g)) { g[k] = (g[k] || []).filter(x => x !== sid); if (!g[k].length) delete g[k]; }
      stmts.push(env.DB.prepare("UPDATE settings SET v=? WHERE k='template'").bind(JSON.stringify({ grid: g, updated: now }))); } catch (e) { } }
    stmts.push(env.DB.prepare("DELETE FROM edit_request WHERE staff_id=? AND status='pending'").bind(sid));
    if (keep) {
      stmts.push(env.DB.prepare('DELETE FROM schedule WHERE staff_id=? AND start>=?').bind(sid, now));   // 앞으로의 예정만 지움
      stmts.push(env.DB.prepare('UPDATE staff SET active=0, deleted=1, pin=? WHERE id=?').bind('del-' + sid + '-' + now, sid));
    } else {
      stmts.push(env.DB.prepare('DELETE FROM schedule WHERE staff_id=?').bind(sid));
      stmts.push(env.DB.prepare('DELETE FROM edit_request WHERE staff_id=?').bind(sid));
      stmts.push(env.DB.prepare('DELETE FROM staff WHERE id=?').bind(sid));
    }
    await env.DB.batch(stmts);
    return json({ ok: true, kept: keep, punches: np });
  }
  if (p === '/admin/staff' && m === 'POST') {
    const name = String(b.name || '').trim(), pin = String(b.pin || '').trim();
    const wage = Math.round(+b.wage || 0);
    if (!name) return err('이름을 입력하세요.');
    if (!/^\d{4,6}$/.test(pin)) return err('PIN은 숫자 4~6자리입니다.');
    if (pin === String(env.ADMIN_PIN)) return err('관리자 PIN과 같은 번호는 쓸 수 없습니다.');
    if (wage < 1000) return err('시급을 확인하세요.');
    const dup = await env.DB.prepare('SELECT id FROM staff WHERE pin=? AND id!=?').bind(pin, +b.id || 0).first();
    if (dup) return err('다른 직원이 쓰는 PIN입니다.');
    const color = /^#[0-9a-fA-F]{6}$/.test(b.color || '') ? b.color : '#4f7cff';
    const active = b.active === false || b.active === 0 ? 0 : 1;
    const ub = b.use_break === false || b.use_break === 0 ? 0 : 1;
    if (b.id) await env.DB.prepare('UPDATE staff SET name=?,pin=?,wage=?,color=?,active=?,use_break=? WHERE id=?').bind(name, pin, wage, color, active, ub, +b.id).run();
    let sid = +b.id;
    if (!sid) sid = (await env.DB.prepare('INSERT INTO staff(name,pin,wage,color,active,use_break) VALUES(?,?,?,?,?,?)').bind(name, pin, wage, color, active, ub).run()).meta.last_row_id;
    // 주 계약시간: 적용 월부터 (빈칸이면 그 달 기록 지움)
    if (b.contract && /^\d{4}-\d{2}$/.test(b.contract.month || '')) {
      const hrs = b.contract.hours;
      if (hrs === '' || hrs == null) await env.DB.prepare('DELETE FROM contract WHERE staff_id=? AND month=?').bind(sid, b.contract.month).run();
      else {
        const mins = Math.round(+hrs * 60);
        if (!(mins >= 0 && mins <= 52 * 60)) return err('주 계약시간을 확인하세요 (0~52시간).');
        await env.DB.prepare('INSERT INTO contract(staff_id,month,weekly_min) VALUES(?,?,?) ON CONFLICT(staff_id,month) DO UPDATE SET weekly_min=excluded.weekly_min').bind(sid, b.contract.month, mins).run();
      }
    }
    return json({ ok: true, id: sid });
  }

  if (p === '/admin/schedule' && m === 'POST') {
    const sid = +b.staff_id, s = num(b.start), e = num(b.end), myId = +b.id || 0;
    const v = validRange(s, e); if (v) return err(v);
    const warns = [];
    // 다른 알바와 겹치는 건 그대로 허용. 같은 사람이 겹치면 하나로 합침
    const same = (await env.DB.prepare('SELECT * FROM schedule WHERE staff_id=? AND id!=? AND start<? AND end>?').bind(sid, myId, e, s).all()).results;
    let ms = s, me = e;
    same.forEach(r => { ms = Math.min(ms, r.start); me = Math.max(me, r.end); });
    if (same.length) {
      const v2 = validRange(ms, me); if (v2) return err('같은 직원의 스케줄과 합치면 ' + v2);
      const nm = (await env.DB.prepare('SELECT name FROM staff WHERE id=?').bind(sid).first() || {}).name || '이 직원';
      warns.push(`${nm}은(는) 이미 ${same.map(r => hm(r.start) + '~' + hm(r.end)).join(', ')} 스케줄이 있어 겹칩니다. 저장하면 ${hm(ms)}~${hm(me)} 하나로 합쳐집니다.`);
    }
    if (outside(ms) || outside(me)) warns.push('영업시간 밖이 포함되어 있습니다.');
    const ws = weekStart(ms), skip = new Set([myId, ...same.map(r => r.id)]);
    const rows = (await env.DB.prepare('SELECT id,start,end FROM schedule WHERE staff_id=? AND start>=? AND start<?').bind(sid, ws, ws + 7 * DAY).all()).results.filter(r => !skip.has(r.id));
    rows.push({ start: ms, end: me });
    const ub = ((await env.DB.prepare('SELECT use_break FROM staff WHERE id=?').bind(sid).first()) || {}).use_break;
    const total = rows.reduce((a, r) => { const mm = (r.end - r.start) / MIN; return a + mm - breakMin(mm, ub); }, 0);
    if (total >= WEEK_LIMIT_MIN) warns.push(`이 직원의 이번 주 스케줄이 ${ub === 0 ? '' : '휴게 제외 '}${fmtH(Math.round(total))}이 됩니다. 주 15시간 이상이면 주휴수당이 발생합니다.`);
    if (warns.length && !b.confirm) return json({ needConfirm: true, warns });
    const stmts = same.map(r => env.DB.prepare('DELETE FROM schedule WHERE id=?').bind(r.id));
    stmts.push(myId ? env.DB.prepare('UPDATE schedule SET staff_id=?,start=?,end=? WHERE id=?').bind(sid, ms, me, myId)
                    : env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(sid, ms, me));
    await env.DB.batch(stmts);
    return json({ ok: true, merged: same.length });
  }
  if (p === '/admin/template' && m === 'GET') {
    return json(parseTemplate(await env.DB.prepare("SELECT v FROM settings WHERE k='template'").first()));
  }
  if (p === '/admin/template' && m === 'POST') {
    const grid = cleanGrid(b.grid);
    await env.DB.prepare("INSERT INTO settings(k,v) VALUES('template',?) ON CONFLICT(k) DO UPDATE SET v=excluded.v")
      .bind(JSON.stringify({ grid, updated: now })).run();
    if (!b.apply) return json({ ok: true });
    // 근무표 → 선택한 주들의 예정 스케줄로 변환 (기존 예정 스케줄은 교체)
    const from = num(b.apply.from);
    if (!Number.isFinite(from)) return err('적용할 시작 주가 필요합니다.');
    const weeks = Math.min(12, Math.max(1, Math.round(+b.apply.weeks || 1)));
    const ws0 = weekStart(from);
    const ids = (await env.DB.prepare('SELECT id FROM staff WHERE active=1').all()).results.map(r => r.id);
    const stmts = []; let count = 0;
    for (let w = 0; w < weeks; w++) {
      const base = ws0 + w * 7 * DAY;
      stmts.push(env.DB.prepare('DELETE FROM schedule WHERE start>=? AND start<?').bind(base, base + 7 * DAY));
      for (let d = 0; d < 7; d++) for (const id of ids) {
        // 30분 단위: "요일-시" = 그 시간 전체(1시간), "요일-시.5" = 앞 30분만
        let s = -1;
        for (let q = 0; q <= 48; q++) {
          const hh = q >> 1, on = q < 48 && ((grid[d + '-' + hh] || []).includes(id) || (!(q & 1) && (grid[d + '-' + hh + '.5'] || []).includes(id)));
          if (on && s < 0) s = q;
          if (!on && s >= 0) {
            stmts.push(env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(id, base + d * DAY + s * 30 * MIN, base + d * DAY + q * 30 * MIN));
            count++; s = -1;
          }
        }
      }
    }
    await env.DB.batch(stmts);
    return json({ ok: true, from: ws0, weeks, count });
  }
  if (p === '/admin/schedule/delete' && m === 'POST') {
    await env.DB.prepare('DELETE FROM schedule WHERE id=?').bind(+b.id).run();
    return json({ ok: true });
  }
  if (p === '/admin/schedule/copy' && m === 'POST') {
    const from = num(b.from); if (!Number.isFinite(from)) return err('from 값이 필요합니다.');
    const rows = (await env.DB.prepare('SELECT * FROM schedule WHERE start>=? AND start<?').bind(from, from + 7 * DAY).all()).results;
    let copied = 0, skipped = 0;
    for (const r of rows) {
      const s = r.start + 7 * DAY, e = r.end + 7 * DAY;
      if (await overlap(env, 'schedule', r.staff_id, s, e)) { skipped++; continue; }
      await env.DB.prepare('INSERT INTO schedule(staff_id,start,end) VALUES(?,?,?)').bind(r.staff_id, s, e).run();
      copied++;
    }
    return json({ ok: true, copied, skipped });
  }

  // 직원의 기록에 적어 둔 휴게를 지움 → 직원 설정(휴게 사용/없음)을 따름
  if (p === '/admin/staff/clearbrk' && m === 'POST') {
    const r = await env.DB.prepare('UPDATE punch SET brk_min=NULL WHERE staff_id=? AND brk_min IS NOT NULL').bind(+b.id).run();
    return json({ ok: true });
  }
  // 직원별 쓸 수 있는 앱
  if (p === '/admin/staff/apps' && m === 'POST') {
    const list = (Array.isArray(b.apps) ? b.apps : []).filter(k => APP_KEYS.includes(k));
    await env.DB.prepare('UPDATE staff SET apps=? WHERE id=?').bind(list.join(','), +b.id).run();
    return json({ ok: true, apps: list });
  }
  // 직원 출근하기 버튼 사용 여부
  // 전체 백업: 모든 표를 한 번에 (로그인 기기 목록은 빼고)
  if (p === '/admin/backup' && m === 'GET') {
    const tables = ['staff', 'schedule', 'punch', 'edit_request', 'punch_log', 'payslip', 'settings', 'contract', 'store_check', 'stock_item', 'stock_log'];
    const res = await env.DB.batch(tables.map(t => env.DB.prepare('SELECT * FROM ' + t)));
    const out = { app: 'oozy-work', version: 1, at: Date.now() };
    tables.forEach((t, i) => { out[t] = res[i].results; });
    return json(out);
  }
  if (p === '/admin/settings' && m === 'GET') return json({ punchOn: await punchEnabled(env), otWage: await otWageOf(env), eduWage: await wageSet(env, 'edu_wage'), evtWage: await wageSet(env, 'evt_wage'), baseWage: await baseWageOf(env), minWage: MIN_WAGE });
  if (p === '/admin/settings' && m === 'POST') {
    if (b.punchOn !== undefined) await env.DB.prepare("INSERT INTO settings(k,v) VALUES('punch_on',?) ON CONFLICT(k) DO UPDATE SET v=excluded.v").bind(b.punchOn ? '1' : '0').run();
    if (b.baseWage !== undefined) {                     // 기본근무 시급: 저장하면 모든 직원 시급을 이 금액으로 맞춤
      const w = Math.round(+b.baseWage);
      if (!(w >= 1000)) return err('기본근무 시급을 확인하세요.');
      await env.DB.batch([env.DB.prepare("INSERT INTO settings(k,v) VALUES('base_wage',?) ON CONFLICT(k) DO UPDATE SET v=excluded.v").bind(String(w)),
        env.DB.prepare('UPDATE staff SET wage=? WHERE deleted=0').bind(w)]);
    }
    if (b.otWage !== undefined) {                       // 추가근무 시급 (비우면 기본 시급과 같게)
      const w = b.otWage === '' || b.otWage == null ? null : Math.round(+b.otWage);
      if (w != null && !(w >= 1000)) return err('추가근무 시급을 확인하세요.');
      if (w == null) await env.DB.prepare("DELETE FROM settings WHERE k='ot_wage'").run();
      else await env.DB.prepare("INSERT INTO settings(k,v) VALUES('ot_wage',?) ON CONFLICT(k) DO UPDATE SET v=excluded.v").bind(String(w)).run();
    }
    for (const [f, key, nm] of [['eduWage', 'edu_wage', '교육'], ['evtWage', 'evt_wage', '행사']]) {   // 교육·행사 시급 (비우면 기본 시급과 같게)
      if (b[f] === undefined) continue;
      const w = b[f] === '' || b[f] == null ? null : Math.round(+b[f]);
      if (w != null && !(w >= 1000)) return err(nm + ' 시급을 확인하세요.');
      if (w == null) await env.DB.prepare('DELETE FROM settings WHERE k=?').bind(key).run();
      else await env.DB.prepare('INSERT INTO settings(k,v) VALUES(?,?) ON CONFLICT(k) DO UPDATE SET v=excluded.v').bind(key, String(w)).run();
    }
    return json({ ok: true, punchOn: await punchEnabled(env), otWage: await otWageOf(env), eduWage: await wageSet(env, 'edu_wage'), evtWage: await wageSet(env, 'evt_wage'), baseWage: await baseWageOf(env), minWage: MIN_WAGE });
  }
  if (p === '/admin/punches' && m === 'GET') {
    const from = +url.searchParams.get('from'), to = +url.searchParams.get('to');
    const rows = (await env.DB.prepare(`SELECT p.*, s.name FROM punch p JOIN staff s ON s.id=p.staff_id
      WHERE (p.start<? AND COALESCE(p.end,?)>?) OR p.status IN ('missing','open') ORDER BY p.start DESC`).bind(to, now, from).all()).results;
    return json(rows);
  }
  if (p === '/admin/punch' && m === 'POST') {
    const sid = +b.staff_id, s = num(b.start), e = num(b.end);
    const bm = b.brk_min === '' || b.brk_min == null ? null : Math.max(0, Math.round(+b.brk_min) || 0);   // 휴게(분)
    const ot = b.ot ? 1 : 0;                                                                             // 추가근무 체크
    const tag = String(b.tag || '').split(',').map(x => x.trim()).filter(x => /^(교육|행사|기타(:.{0,30})?)$/.test(x)).join(',') || null;   // 근무 구분 (표시용)
    const v = validRange(s, e); if (v) return err(v);
    if (bm != null && bm >= (e - s) / MIN) return err('휴게시간이 근무시간보다 깁니다.');
    if (await overlap(env, 'punch', sid, s, e, +b.id || 0)) return err('이 직원의 다른 근무 기록과 시간이 겹칩니다.', 409);
    if (b.id) {
      const before = await env.DB.prepare('SELECT * FROM punch WHERE id=?').bind(+b.id).first();
      await env.DB.prepare("UPDATE punch SET staff_id=?,start=?,end=?,brk_min=?,ot=?,tag=?,status='done',edited=1 WHERE id=?").bind(sid, s, e, bm, ot, tag, +b.id).run();
      await log(env, +b.id, 'admin_edit', before, { staff_id: sid, start: s, end: e, brk_min: bm, ot, tag });
    } else {
      const r = await env.DB.prepare("INSERT INTO punch(staff_id,start,end,brk_min,ot,tag,status,edited,created,note) VALUES(?,?,?,?,?,?,'done',1,?, '관리자 추가')").bind(sid, s, e, bm, ot, tag, now).run();
      await log(env, r.meta.last_row_id, 'admin_add', null, { staff_id: sid, start: s, end: e, brk_min: bm, ot, tag });
    }
    return json({ ok: true });
  }
  if (p === '/admin/punch/memo' && m === 'POST') {          // 관리자 기록(메모)
    const memo = String(b.memo || '').trim().slice(0, 300);
    await env.DB.prepare('UPDATE punch SET memo=? WHERE id=?').bind(memo || null, +b.id).run();
    return json({ ok: true, memo });
  }
  if (p === '/admin/punch/delete' && m === 'POST') {
    const before = await env.DB.prepare('SELECT * FROM punch WHERE id=?').bind(+b.id).first();
    await env.DB.prepare('DELETE FROM punch WHERE id=?').bind(+b.id).run();
    await log(env, +b.id, 'admin_delete', before, null);
    return json({ ok: true });
  }

  if (p === '/admin/requests' && m === 'GET') {
    const rows = (await env.DB.prepare(`SELECT r.*, s.name, p.start AS old_start, p.end AS old_end FROM edit_request r
      JOIN staff s ON s.id=r.staff_id LEFT JOIN punch p ON p.id=r.punch_id WHERE r.status='pending' ORDER BY r.created`).all()).results;
    return json(rows);
  }
  if (p === '/admin/requests/resolve' && m === 'POST') {
    const r = await env.DB.prepare("SELECT * FROM edit_request WHERE id=? AND status='pending'").bind(+b.id).first();
    if (!r) return err('이미 처리된 요청입니다.');
    if (b.approve) {
      if (await overlap(env, 'punch', r.staff_id, r.start, r.end, r.punch_id || 0)) return err('승인하면 다른 기록과 겹칩니다. 기록 탭에서 직접 수정하세요.', 409);
      if (r.punch_id) {
        const before = await env.DB.prepare('SELECT * FROM punch WHERE id=?').bind(r.punch_id).first();
        await env.DB.prepare("UPDATE punch SET start=?,end=?,status='done',edited=1 WHERE id=?").bind(r.start, r.end, r.punch_id).run();
        await log(env, r.punch_id, 'request_approve', before, { start: r.start, end: r.end, reason: r.reason });
      } else {
        const ins = await env.DB.prepare("INSERT INTO punch(staff_id,start,end,status,edited,created,note) VALUES(?,?,?,'done',1,?,?)")
          .bind(r.staff_id, r.start, r.end, now, '요청 승인: ' + (r.reason || '')).run();
        await log(env, ins.meta.last_row_id, 'request_add', null, { start: r.start, end: r.end, reason: r.reason });
      }
    }
    await env.DB.prepare('UPDATE edit_request SET status=? WHERE id=?').bind(b.approve ? 'approved' : 'rejected', r.id).run();
    return json({ ok: true });
  }

  if (p === '/admin/pay' && m === 'GET') {
    const r = await computePay(env, url.searchParams.get('month'));
    if (r.error) return err(r.error);
    const conf = (await env.DB.prepare('SELECT staff_id, at FROM payslip WHERE month=?').bind(r.month).all()).results;
    r.staff.forEach(s => { const c = conf.find(x => x.staff_id === s.id); s.confirmedAt = c ? c.at : null; });
    return json(r);
  }
  // 급여 확정: 그 달 명세서를 그대로 저장 → 알바가 '확정급여'에서 봄
  if (p === '/admin/pay/confirm' && m === 'POST') {
    const r = await computePay(env, b.month);
    if (r.error) return err(r.error);
    const list = r.staff.filter(s => s.shifts.length);
    if (!list.length) return err('이 달에 근무 기록이 있는 직원이 없습니다.');
    await env.DB.batch(list.map(s => env.DB.prepare('INSERT INTO payslip(staff_id,month,data,at) VALUES(?,?,?,?) ON CONFLICT(staff_id,month) DO UPDATE SET data=excluded.data, at=excluded.at')
      .bind(s.id, r.month, JSON.stringify(s), now)));
    return json({ ok: true, count: list.length, month: r.month });
  }
  if (p === '/admin/pay/unconfirm' && m === 'POST') {
    await env.DB.prepare('DELETE FROM payslip WHERE month=?').bind(String(b.month || '')).run();
    return json({ ok: true });
  }

  return err('알 수 없는 요청입니다.', 404);
}

export default {
  async fetch(req, env) {
    if (req.method === 'OPTIONS') return new Response(null, { headers: CORS });
    try { return await route(req, env); }
    catch (e) { return err('서버 오류: ' + (e && e.message || e), 500); }
  },
};

</script>
<script>
// ===== 설정 =====
const CFG = {
  API: 'https://oozy-work.kghwang1.workers.dev',   // ← 배포한 Worker 주소로 바꾸세요
  H0: 6, H1: 24, PX: 32,                            // 주간표 표시 시간 범위, 1시간당 높이
  // 요일별 영업시간 [시작, 끝]  월 화 수 목 금 토 일
  OPEN: [[7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22], [7, 22]],
  OWNER: { wd: [[14, 16], [19, 21]], we: [] },      // 사장님 근무시간 (빈 시간 계산에서 제외)
  IDLE_MIN: 3,                                       // 이 시간(분) 동안 조작 없으면 자동 로그아웃
  SQLJS: ['https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/', 'https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/']
};
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;
const DOW = ['일','월','화','수','목','금','토'];
let TOKEN = (() => { try { return localStorage.getItem('oozyToken') || ''; } catch (e) { return ''; } })();   // 홈에서 로그인한 기기 토큰
let PRACTICE = false, PIN = '', ME = null, WEEK = monday(new Date()), MODE = 'plan', DATA = null, TAB = 'grid', idleT = null;

// ===== 유틸 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
// 밝은 색(노랑 등)이면 글자를 어둡게
const lum = c => { const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if (!m) return 0; const n = parseInt(m[1], 16);
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); };
const onC = c => lum(c) > .45 ? '#3b2a00' : '#fff';                       // 색 바탕 위 글자
const inkC = c => lum(c) > .45 ? '#8a6d00' : c;                           // 흰 바탕 위 글자
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const mdw = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtH = m => `${Math.floor(m / 60)}시간${m % 60 ? ' ' + Math.round(m % 60) + '분' : ''}`;
const won = n => n.toLocaleString('ko-KR') + '원';
const toMs = (date, time) => new Date(`${date}T${time}`).getTime();
function monday(d) { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function addDays(t, n) { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); }

async function api(path, body) {
  const hd = { 'Content-Type': 'application/json' }; if (!PRACTICE && TOKEN) hd['X-Token'] = TOKEN; else hd['X-Pin'] = PIN;
  const init = { method: body ? 'POST' : 'GET', headers: hd, body: body ? JSON.stringify(body) : undefined };
  const r = PRACTICE ? await practiceFetch(path, init) : await fetch(CFG.API + path, init);
  const j = await r.json().catch(() => ({ error: '서버 응답을 읽을 수 없습니다.' }));
  if (r.status === 401 && ME) { logout(); throw new Error('다시 로그인해 주세요.'); }
  if (!r.ok && !j.needConfirm) throw new Error(j.error || '오류가 발생했습니다.');
  return j;
}
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, 3500); } }

// 경고가 있으면 확인받고 다시 보냄
async function withConfirm(path, body) {
  let j = await api(path, body);
  if (j.needConfirm) {
    const ok = await modal(`<h3>확인해 주세요</h3><div class="warnlist">${j.warns.map(esc).join('<br>')}</div><div>그래도 진행할까요?</div>`, '진행');
    if (!ok) return null;
    j = await api(path, { ...body, confirm: true });
  }
  return j;
}

function modal(html, okText = '확인', read, cancelText = '취소') {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'mbg';
    bg.innerHTML = `<div class="modal">${html}<div class="mbtns">${cancelText ? `<button data-x>${cancelText}</button>` : ''}<button class="pri" data-ok>${okText}</button></div></div>`;
    document.body.appendChild(bg);
    const close = v => { bg.remove(); res(v); };
    bg.querySelector('[data-ok]').onclick = () => { const v = read ? read() : true; if (v === false) return; close(v); };
    const x = bg.querySelector('[data-x]'); if (x) x.onclick = () => close(null);
  });
}

function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => res({}), { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
  });
}

function resetIdle() { clearTimeout(idleT); if (TOKEN && !PRACTICE) return; if (ME) idleT = setTimeout(idleLogout, CFG.IDLE_MIN * MIN); }
async function idleLogout() {
  if (TPL_DIRTY && TPL) { try { await api('/admin/template', { grid: TPL }); } catch (e) {} } // 작성 중인 근무표는 자동 저장
  TPL_DIRTY = false; logout(); toast('자동 로그아웃되었습니다.');
}
['click', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, resetIdle, { passive: true }));

// ===== 연습 모드: 서버 대신 이 휴대폰 안에서 실행 =====
const PKEY = 'oozyPracticeDB';
let PW = null;
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function practiceEngine() {
  if (PW) return PW;
  let SQL = null;
  for (const base of CFG.SQLJS) {
    try { if (!window.initSqlJs) await loadScript(base + 'sql-wasm.js'); SQL = await initSqlJs({ locateFile: f => base + f }); break; } catch (e) { }
  }
  if (!SQL) throw new Error('연습 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  let mod;

// 근무표의 사장님 칸("요일-시") → 그날의 [시작,끝] 구간들
function ownerRanges(keys, di) {      // "요일-시" = 1시간, "요일-시.5" = 앞 30분 → 30분 칸(q)으로 펼쳐 이어 붙임
  const sl = new Set();
  keys.filter(k => k.startsWith(di + '-')).forEach(k => { const h = +k.split('-')[1].replace('.5', ''); sl.add(h * 2); if (!k.endsWith('.5')) sl.add(h * 2 + 1); });
  const out = [];
  [...sl].sort((a, b) => a - b).forEach(q => { const last = out[out.length - 1]; if (last && last[1] === q / 2) last[1] = (q + 1) / 2; else out.push([q / 2, (q + 1) / 2]); });

}
// 근무 칸 아래쪽에 세로로 근무시간 (예정: 하늘색, 실제: 붉은색)

  const t = `${Math.floor(m / 60)}h${m % 60 ? '<br>' + pad(m % 60) : ''}`;     // 3h / 30 두 줄

  return `<span class="dur ${k}">${t}</span>`; };
function drawGrid(admin) {

    h += `<div class="closed" style="top:0;height:${y(o)}px"></div><div class="closed" style="top:${y(c)}px;height:${H - y(c)}px"></div>`;

// TPL: { "요일-시": [직원id..] | ["O"] }  요일 0=월…6=일
let TPL = null, TPL_DIRTY = false, BRUSH = null, PAINT = null;
const TDAYS = ['월', '화', '수', '목', '금', '토', '일'];
const openOf = d => CFG.OPEN[d];
const isOff = (d, h) => { const [o, c] = openOf(d); return h < o || h >= c; };

async function tabTpl() {

      <div class="pal" id="pal">

      <div class="tgrid" id="tg">${g}</div>
      <div style="text-align:right;margin-top:8px"><button class="sm" id="tClear">사장 칸 빼고 모두 지우기</button></div>
    </div>
    <div class="card"><b>근무자별 주간 근무시간</b><div class="scroll-x" id="tsum"></div>
      <div class="muted" style="margin-top:8px" id="tnote"></div></div>`;
  document.querySelectorAll('.tc[data-k]').forEach(drawCell);
  markBrush();
  $('#pal').onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; BRUSH = b.dataset.b === BRUSH ? null : b.dataset.b; markBrush(); };

  $('#tSave').onclick = saveTpl;

    for (const k in TPL) if (!TPL[k].includes('O')) delete TPL[k];
    dirty(); tabTpl();

function markBrush() {
  document.querySelectorAll('#pal [data-b]').forEach(b => b.classList.toggle('on', (b.dataset.b || null) === BRUSH));
  $('#tg').classList.toggle('paint', !!BRUSH); // 칠하기 중엔 화면이 끌려가지 않게
}
function drawCell(el) {
  const k = el.dataset.k, full = TPL[k] || [], half = TPL[k + '.5'] || [];
  el.classList.toggle('has', full.length + half.length > 0);
  const chip = (x, hf) => {
    const cls = hf ? ' half' : '';
    if (x === 'O') return `<div class="chip own${cls}">사장</div>`;
    const s = STAFF.find(s => s.id === x);
    return s ? `<div class="chip${cls} ${s.active ? '' : 'gone'}" style="background:${s.color};color:${onC(s.color)}">${esc(s.name.slice(0, hf ? 2 : 3))}</div>` : '';
  };
  el.innerHTML = full.map(x => chip(x, false)).join('') + half.map(x => chip(x, true)).join('');
}
function dirty() {
  TPL_DIRTY = true;
  const t = document.querySelector('[data-tab="tpl"]'); if (t) t.textContent = '주간근무표*';
  const lab = $('#tStat'); if (lab) lab.innerHTML = '<b style="color:var(--bad)">저장 안 됨</b>';
}
// zone: 'R' = 칸 오른쪽(1시간 전체), 'L' = 칸 왼쪽(앞 30분)   ·  저장: "요일-시" = 1시간, "요일-시.5" = 앞 30분
function paintCell(k, mode, zone) {
  let f = (TPL[k] || []).slice(), hf = (TPL[k + '.5'] || []).slice();
  const target = zone === 'R' ? 'f' : 'h';
  const set = id => { f = f.filter(x => x !== id); hf = hf.filter(x => x !== id); if (mode === 'add') (target === 'f' ? f : hf).push(id); };
  if (BRUSH === 'X') { f = []; hf = []; }
  else if (BRUSH === 'O') { if (mode === 'add') { f = []; hf = []; } set('O'); }
  else { f = f.filter(x => x !== 'O'); hf = hf.filter(x => x !== 'O'); set(+BRUSH); }
  if (f.length) TPL[k] = f; else delete TPL[k];
  if (hf.length) TPL[k + '.5'] = hf; else delete TPL[k + '.5'];
  drawCell(document.querySelector(`.tc[data-k="${k}"]`));
  dirty();
}
function bindPaint() {
  const tg = $('#tg');
  const cellAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest('.tc[data-k]'); };
  tg.onpointerdown = e => {
    if (!BRUSH) return;
    const c = cellAt(e); if (!c) return;
    e.preventDefault();
    const r = c.getBoundingClientRect(), zone = e.clientX >= r.left + r.width / 2 ? 'R' : 'L';   // 오른쪽=1시간, 왼쪽=30분
    const me = BRUSH === 'O' ? 'O' : +BRUSH, k = c.dataset.k;
    const has = (zone === 'R' ? TPL[k] : TPL[k + '.5'] ) || [];
    const mode = BRUSH === 'X' ? 'del' : (has.includes(me) ? 'del' : 'add');
    PAINT = { mode, last: k, zone };               // 끌어서 칠할 때는 처음 누른 쪽(30분/1시간)으로 계속 칠함
    paintCell(k, mode, zone);
  };
  // 마우스·손가락이 있는 칸의 요일과 시간을 반전 표시
  let hlKey = null;
  const hl = c => {
    const k = c ? c.dataset.k : null; if (k === hlKey) return; hlKey = k;
    tg.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
    if (!c) return;
    const [d, hh] = k.split('-');
    c.classList.add('hl');
    tg.querySelector(`.th[data-d="${d}"]`).classList.add('hl');
    tg.querySelector(`.tt[data-h="${hh}"]`).classList.add('hl');
  };
  tg.onpointermove = e => {
    const c = cellAt(e); hl(c);
    if (!PAINT || !c || c.dataset.k === PAINT.last) return;
    PAINT.last = c.dataset.k; paintCell(c.dataset.k, PAINT.mode, PAINT.zone);
  };
  tg.addEventListener('pointerdown', e => hl(cellAt(e)));
  const end = () => { if (PAINT) { PAINT = null; drawSummary(); } };
  tg.onpointerup = end; tg.onpointercancel = end;
  tg.onpointerleave = () => { end(); hl(null); };
}
// 30분 칸(q=0..47) 단위로 보기: 그 시간 전체 칸이면 앞뒤 30분 모두, ".5" 칸이면 앞 30분만

async function editPunch(p, fromWeek, day) {

  const defBrk = p && p.brk_min != null ? p.brk_min : '';                                  // 비워 두면 직원 설정을 따름

      el.textContent = min - br > 0 ? `${fmtH(min - br)} (전체 ${fmtH(min)} - 휴게 ${br}분)` : '휴게시간이 너무 깁니다';
    };

    const ks = $('#kS'), sync = () => { const off = noBrk(ks.value);
