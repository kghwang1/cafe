      $('#kRn').innerHTML = `비워 두면 <b>직원 설정</b>(${off ? '휴게 없음' : '휴게 사용 · 자동'})을 따릅니다. 이 날만 다르게 하려면 분을 넣으세요 (넣은 값이 우선).`; upd(); };

  }, 0);

      <div><label>퇴근</label><input type="hidden" id="kB" value="${p && p.end ? hhmm(p.end) : ''}"><button type="button" class="tbtn" id="kBb">${tLabel(p && p.end ? hhmm(p.end) : '')}</button></div></div>

    setTimeout(() => document.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => {
      $('#fC').value = b.dataset.pc; document.querySelectorAll('[data-pc]').forEach(x => x.classList.toggle('on', x === b)); }), 0);
    const v = await modal(`<h3>${s ? '직원 수정' : '직원 추가'}</h3>
      <label>이름</label><input id="fN" value="${esc(s ? s.name : '')}">
      <label>PIN (숫자 4~6자리, 직원마다 다르게)</label><input id="fP" inputmode="numeric" value="${esc(s ? s.pin : '')}">
      <label>시급</label><input id="fW" type="number" value="${s ? s.wage : BASEW}">
      <label>주 계약시간 (소정근로시간)</label>
      <div class="kline"><span>주</span><input id="fK" type="number" inputmode="decimal" step="0.5" min="0" max="52" placeholder="예: 14" value="${curC ? curC.min / 60 : ''}"><span>시간,</span><input id="fKm" type="month" value="${curM}"><span>부터</span></div>
      <div class="muted" style="font-size:12px;margin:2px 0 4px">주휴수당은 이 시간으로 판단합니다 (15시간 이상이면 대상, 금액도 이 시간 기준). 비워 두면 실제 근무시간으로 계산합니다.
        ${s && (s.contracts || []).length ? `<br>지금까지: ${s.contracts.map(c => `${+c.month.slice(5)}월~ 주 ${c.min / 60}시간`).join(' → ')}` : ''}</div>
      <label>색상</label><div class="pal">${PALETTE.map(([n, c]) => `<button type="button" class="pc ${c === col ? 'on' : ''}" data-pc="${c}" style="background:${c};color:${onC(c)}">${n}</button>`).join('')}</div>
      <input id="fC" type="color" value="${col}" style="height:40px;margin-top:6px">
      <label><input id="fB" type="checkbox" style="width:auto" ${!s || s.use_break !== 0 ? 'checked' : ''}> 휴게시간 사용</label>
      <div class="muted" style="font-size:12px;margin:-2px 0 4px 22px">체크: 출근~퇴근 4시간 이상이면 30분(8시간 30분 이상이면 1시간)을 빼고 급여 계산<br>체크 해제: 휴게 없이 근무한 시간 전부를 급여로 계산</div>
      <label><input id="fA" type="checkbox" style="width:auto" ${!s || s.active ? 'checked' : ''}> 재직 중</label>`, '저장', () =>
      ({ id: s ? s.id : null, name: $('#fN').value, pin: $('#fP').value, wage: +$('#fW').value, color: $('#fC').value, active: $('#fA').checked, use_break: $('#fB').checked,
         contract: (() => { const k = $('#fK').value.trim(), mth = $('#fKm').value; const prev = s ? contractNow(s, mth) : null;
           if (!mth) return null; if (k === '' && !(prev && prev.month === mth)) return null;           // 안 바꿨으면 보내지 않음
           if (k !== '' && prev && prev.min === Math.round(+k * 60)) return null;
           return { month: mth, hours: k }; })() }));
    if (!v) return;
    const r = await run(() => api('/admin/staff', v)); if (!r) return;
    if (s && (s.use_break !== 0) !== v.use_break && await modal(`<h3>휴게 설정을 바꿨습니다</h3>추가기록/수정에서 기록마다 따로 적어 둔 휴게시간은 <b>직원 설정보다 우선</b>합니다.<br>
        ${esc(s.name)}의 기록에 적어 둔 휴게를 모두 지우고 <b>새 설정(${v.use_break ? '휴게 사용' : '휴게 없음'})</b>을 따르게 할까요?
        <div class="muted" style="margin-top:6px;font-size:12.5px">이미 확정한 급여명세서는 바뀌지 않습니다. 필요하면 급여 탭에서 다시 확정하세요.</div>`, '지우고 새 설정 따르기', undefined, '그대로 두기'))
      await run(() => api('/admin/staff/clearbrk', { id: s.id }));
    toast('저장했습니다'); renderAdmin();
  };
  $('#nAdd').onclick = () => edit(null);
  document.querySelectorAll('[data-se]').forEach(b => b.onclick = () => edit(STAFF.find(s => s.id === +b.dataset.se)));
  document.querySelectorAll('[data-sx]').forEach(b => b.onclick = async () => {
    const s = STAFF.find(x => x.id === +b.dataset.sx);
    if (!await modal(`<h3>직원 삭제</h3><b>${esc(s.name)}</b> 직원을 삭제할까요?
      <div class="muted" style="margin-top:8px;font-size:13px;line-height:1.6">· 직원 목록, 근무표, 앞으로의 근무 예정에서 빠지고 이 PIN으로는 로그인할 수 없습니다.<br>
      · 지난 출퇴근 기록과 급여명세서는 그대로 남아 급여 탭과 근무기록에서 볼 수 있습니다 (근로기록은 3년 보관).<br>
      · 잠시 쉬는 직원이면 삭제 대신 [수정]에서 "재직 중"을 끄세요.</div>`, '삭제')) return;
    const r = await run(() => api('/admin/staff/delete', { id: s.id }));
    if (r) { toast(r.kept ? `${s.name} 삭제 (지난 기록 ${r.punches}건은 보관)` : `${s.name} 삭제했습니다`, 3500); renderAdmin(); }
  });
}

// ===== 시작: 홈에서 로그인한 기기는 바로 들어감 / 연습은 ?practice =====
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('practice')) { setPractice(true); showLogin(); return; }
  if (!TOKEN) { location.replace('./?need=work'); return; }               // 로그인은 홈에서
  document.body.classList.add('tok');
  let a = null; try { a = JSON.parse(localStorage.getItem('oozyAuth') || 'null'); } catch (e) { }
  if (a && a.apps && a.apps.indexOf('work') < 0) { location.replace('./?need=work'); return; }
  $('#app').innerHTML = '<div class="muted" style="padding:60px 0;text-align:center">불러오는 중...</div>';
  try {
    const r = await fetch(CFG.API + '/login', { headers: { 'X-Token': TOKEN } });
    if (r.status === 401) { try { localStorage.removeItem('oozyToken'); localStorage.removeItem('oozyAuth'); } catch (e) { } location.replace('./'); return; }
    const j = await r.json(); if (!r.ok) throw new Error(j.error || '오류');
    ME = j; WEEK = monday(new Date());
    const qt = q.get('tab'); if (qt && ME.role === 'admin') TAB = qt;                  // 홈에서 바로 가기 (예: ?tab=bak)
    ME.role === 'admin' ? renderAdmin() : renderStaff();
  } catch (e) {
    $('#app').innerHTML = `<div class="login"><div class="big">연결하지 못했습니다</div><div class="muted" style="margin:8px 0 16px">${esc(e.message || '')}<br>인터넷 연결을 확인하세요.</div><button class="pri" onclick="location.reload()">다시 시도</button> <a class="homebtn" href="./">🏠 홈</a></div>`;
  }
})();
</script>
</body>
