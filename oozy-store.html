<style>
:root{
  --green:#2E3B21; --green2:#3E4E2C; --butter:#F2E66B; --paper:#FBFAF4; --card:#FFFFFF;
  --ink:#1E2318; --muted:#6B7160; --line:#E2E0D2; --hot:#C23B22; --ice:#2563A8; --etc:#4F6B2E;
  --amt-bg:#FFF4A8; --act:#B4531A; --less-bg:#F1F5E9;
  --fs:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151912; --card:#1E2419; --ink:#ECEFE4; --muted:#A3AA96; --line:#323A2A;
    --hot:#FF7A5C; --ice:#7DB4F0; --etc:#A9C97E; --amt-bg:#4A4416; --act:#F0A060; --less-bg:#26301D;
  }
}
:root[data-theme="dark"]{
  --paper:#151912; --card:#1E2419; --ink:#ECEFE4; --muted:#A3AA96; --line:#323A2A;
  --hot:#FF7A5C; --ice:#7DB4F0; --etc:#A9C97E; --amt-bg:#4A4416; --act:#F0A060; --less-bg:#26301D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:#fff;
  padding:12px 14px 12px;box-shadow:0 2px 0 var(--butter)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;flex:1;white-space:nowrap}
.tabs{display:flex;gap:4px;order:9;flex:1 1 100%}
.tab{flex:1;white-space:nowrap;background:transparent;color:#fff;border:1.5px solid #6E7E5A;border-radius:8px;font:inherit;font-size:16px;
  font-weight:600;padding:6px 6px;min-height:40px}
.tab.on{background:var(--butter);color:var(--green);border-color:var(--butter)}
.top{flex-wrap:wrap}
@media (max-width:440px){.brand{font-size:14px}.tab{padding:5px 3px;font-size:14px;min-height:38px}.sz{min-width:34px;padding:4px 6px;font-size:14px;min-height:38px}.top{gap:4px}.tabs{gap:3px}}
@media (max-width:430px){.brand b{display:none}}
.mg-jump{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}
.mbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 16px 10px;margin-bottom:10px}
.mname{font-weight:700;color:var(--etc);font-size:.9em;padding:8px 0 2px}
.mrow{display:flex;align-items:flex-start;gap:10px;border-top:1px dashed var(--line);padding:8px 0}
.mrow:first-of-type{border-top:0}
.mitem{flex:1;font-weight:600;font-size:.85em;line-height:1.4}
.mspec{display:block;font-weight:400;color:var(--muted);font-size:.8em;margin-top:2px}

.cyc.d{background:var(--hot);color:#fff}.cyc.w{background:var(--ice);color:#fff}.cyc.m{background:var(--etc);color:#fff}
.sub-t{font-size:15px;color:var(--muted);margin:-6px 2px 10px}

.vtxt{flex:1;line-height:1.35}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}

.sec{font-size:1.1em;font-weight:700;color:var(--green);border-bottom:3px solid var(--butter);margin:26px 2px 10px;padding-bottom:4px}

.homebtn{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 9px;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}

  font-weight:600;padding:6px 12px;min-width:44px;min-height:40px}
.searchwrap{position:relative}

.name{font-weight:700;font-size:1.15em;line-height:1.3}
.cat{color:var(--muted);font-size:14px;margin-left:auto;white-space:nowrap}

.row{border-top:1px dashed var(--line);padding:12px 0 6px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}

.tag.HOT{background:var(--hot)} .tag.ICE{background:var(--ice)}
.tag.light{background:var(--green);color:var(--butter);border:1.5px solid var(--butter)}
.lines{margin:0;padding:0;list-style:none}
.lines li{padding:2px 0 2px 1.1em;text-indent:-1.1em}
.lines li::before{content:"+";color:var(--muted);display:inline-block;width:1.1em;text-indent:0;font-weight:700}
.lines li:first-child::before{content:"";}
.amt{font-weight:700}
.act{color:var(--act);font-weight:700}
.cr{color:var(--hot);font-weight:700}.cb{color:var(--ice);font-weight:700}
.legend{font-size:14px;color:var(--muted);margin:0 0 8px}.legend .cr,.legend .cb{font-size:14px}
.warn{color:var(--hot);font-weight:600}
.less{grid-column:2;background:var(--less-bg);border-radius:8px;padding:6px 10px;font-size:.85em;margin-top:4px}

.note{font-size:.8em;color:var(--hot);margin-top:8px;font-weight:600}
.rnote{grid-column:2;margin-top:4px}
.vtop{display:flex;align-items:flex-start;gap:12px}.vtop-l{flex:1;min-width:0}
.qr{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;margin:-6px 0 10px;

  display:flex;align-items:center;gap:10px;background:var(--hot);color:#fff;border-radius:14px;padding:12px 14px;
  font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:600px;margin:0 auto}
.upd[hidden]{display:none}

.ver{font-size:13px;color:var(--muted);text-align:center;margin:24px 0 8px}
.inote{color:var(--hot);font-weight:600;font-size:.8em}
/* 오픈·마감 매뉴얼 */
.wtop{display:flex;align-items:center;gap:10px;margin:4px 2px 10px}
.wtop .sub-t{flex:1;margin:0}
.wbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 14px 8px;margin-bottom:10px}
.whead{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.wtime{display:inline-block;background:var(--green);color:var(--butter);font-weight:700;border-radius:8px;padding:2px 12px;font-size:.95em}
.wtimesub{font-size:.7em;color:var(--muted)}
.wband{background:var(--less-bg);color:var(--etc);font-weight:700;border-radius:8px;padding:6px 10px;margin:10px 0 2px;font-size:.85em;line-height:1.4}
.wband.red{background:var(--amt-bg);color:var(--hot)}
.wgrp{font-size:.68em;font-weight:700;color:var(--muted);margin:10px 0 0;letter-spacing:.04em}
.wrow{display:flex;gap:12px;align-items:flex-start;border-top:1px dashed var(--line);padding:10px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wgrp + .wrow{border-top:0}
.wck{flex:none;width:28px;height:28px;border:2px solid var(--etc);border-radius:8px;margin-top:1px;display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;font-weight:700;line-height:1}
.wrow.done .wck{background:var(--green);border-color:var(--green);color:var(--butter)}
.wrow.done .wt,.wrow.done .wd{color:var(--muted)}
.wrow.done .wt{text-decoration:line-through}
.wbody{flex:1;min-width:0}
.wt{font-weight:700;font-size:.9em;line-height:1.35}
.wno{color:var(--muted);font-weight:600;margin-right:6px}
.wd{font-size:.78em;line-height:1.45;margin-top:2px}
.wn{font-size:.72em;line-height:1.4;color:var(--muted);margin-top:3px}
.wd.r,.wn.r{color:var(--hot);font-weight:700}
.wd.h{color:var(--act);font-weight:700}
.wcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(96px,34%);gap:0 10px;padding-right:0}
.wleft{min-width:0}
.wright{border-left:2px solid var(--butter);padding:0 12px 8px 10px;background:var(--less-bg);border-radius:0 12px 12px 0;margin:-4px 0 -8px}
.wrh{font-size:.68em;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
.wrn{font-size:.72em;line-height:1.45;color:var(--ink);margin:0 0 8px}
.wrn b{display:block;font-size:.92em;color:var(--etc)}
.wrn.r{color:var(--hot);font-weight:700}
.wrn.e{color:var(--muted)}
.wohead{display:flex;font-size:.68em;font-weight:700;color:var(--muted);margin:12px 0 4px;letter-spacing:.04em}
.wohead span:first-child{flex:1}
.wohead span:last-child{flex:0 0 34%;min-width:96px;padding-left:10px}
.wncol{flex:0 0 34%;min-width:96px;border-left:2px solid var(--butter);padding-left:10px;font-size:.72em;line-height:1.45;color:var(--ink);align-self:stretch}
.wncol .r{color:var(--hot);font-weight:700}
.wrow.done .wncol{color:var(--muted)}
/* 오픈·마감: 날짜 · 직원 색 · 기록 */
.wsec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:1.1em;font-weight:700;color:var(--green);border-bottom:3px solid var(--butter);margin:22px 2px 8px;padding-bottom:4px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wsec{color:var(--butter)}}
.wsec .wdate{font-size:.7em;font-weight:600;color:var(--muted)}
.whos{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 2px 10px}
.who{font-size:14px;font-weight:700;border-radius:8px;padding:4px 10px;line-height:1.3;white-space:nowrap}
.who.me{box-shadow:0 0 0 2px var(--ink)}
.recbtn{margin-left:auto;border:1.5px solid var(--green);background:var(--card);color:var(--green);font:inherit;font-size:15px;font-weight:700;border-radius:20px;padding:5px 14px;min-height:38px}
:root[data-theme="dark"] .recbtn{color:var(--butter);border-color:var(--butter)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .recbtn{color:var(--butter);border-color:var(--butter)}}
.wby{font-size:.72em;font-weight:700;margin-top:3px}
.wmsg{background:var(--amt-bg);color:var(--hot);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;margin:0 2px 10px;line-height:1.45}
.wrow.busy{opacity:.5}
/* 기록 보기 */
.rbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:14px;z-index:40;overflow:auto}

.rd.on{background:var(--green);border-color:var(--green)}.rd.on .rn{color:var(--butter)}

.rlist h4{margin:12px 0 4px;font-size:15px;color:var(--etc)}

.rli .rt{flex:1;line-height:1.35}
.rli .rw{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.rli .rat{font-size:13px;color:var(--muted);white-space:nowrap}
.rempty{color:var(--muted);font-size:15px;padding:14px 2px;line-height:1.6}

.wnotes.r{color:var(--hot);font-weight:700;border-left-color:var(--hot)}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.item.open .body{animation:fade .15s ease-out}}
@keyframes fade{from{opacity:0}to{opacity:1}}

<body>
<div id="upd" class="upd" role="status" hidden>
  <span>새 내용으로 업데이트되었어요</span>
  <button id="updBtn">지금 새로고침</button>
</div>
<header>
  <div class="top">
    <a class="homebtn" href="./" aria-label="홈으로">🏠<span class="ht"> 홈</span></a>
    <div class="brand"><b>OOZY </b><span>매장관리</span></div>
    <button class="sz" id="dn" aria-label="글씨 작게">가−</button>
    <button class="sz" id="up" aria-label="글씨 크게">가+</button>
    <div class="tabs" id="tabs">
      <button class="tab" data-m="open">오픈</button>
      <button class="tab" data-m="close">마감</button>
      <button class="tab" data-m="clean">청소</button>
      <button class="tab" data-m="parts">소모품</button>
      <button class="tab" data-m="video">동영상</button>
    </div>
  </div>
</header>
<main>
  <div id="list"></div>
</main>
<script>
(function(){
  const APP_VERSION = '2026-10-22.7';
  let latest = null;
  async function checkUpdate() {
    if (!/^https?:/.test(location.protocol)) return;
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
      if (m && m[1] !== APP_VERSION) { latest = m[1]; document.getElementById('upd').hidden = false; }
    } catch (e) {}
  }
  document.getElementById('updBtn').onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(latest || Date.now()));
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setInterval(checkUpdate, 30 * 60 * 1000);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- 관리 (청소·소모품) ----------

  const API = 'https://oozy-work.kghwang1.workers.dev';   // 근무관리 Worker 주소
  const pad = n => String(n).padStart(2, '0');
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];

  const lum = c => { const x = /^#?([0-9a-f]{6})$/i.exec(c || ''); if (!x) return 0; const n = parseInt(x[1], 16);
    const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
    return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); };

        b.bands.forEach(([t, d, n]) => (n || []).forEach(x => nl.push([t, x])));
        (b.notes || []).forEach(x => nl.push(['', x]));
        h += `<div class="whead"><span class="wtime">${b.time}</span>${b.top ? `<span class="wtimesub">${esc(b.top)}</span>` : ''}</div><div class="wbox wcols"><div class="wleft">`;
        if (b.top) h += `<div class="wband">${esc(b.top)}</div>`;
        if (b.staff.length) h += `<div class="wgrp">직원</div>` + b.staff.map(([t, d], i) => wrow(`c${bi}s${i}`, t, d, [], 0, false, 'close')).join('');
        if (b.bands.length) h += `<div class="wgrp">직원 · P.T. 공동</div>` + b.bands.map(([t, d], i) => wrow(`c${bi}b${i}`, t, d, [], 0, false, 'close')).join('');
        if (b.pt.length) h += `<div class="wgrp">P.T.</div>` + b.pt.map(([t, d], i) => wrow(`c${bi}p${i}`, t, d, [], 0, false, 'close')).join('');
        h += `</div><div class="wright"><div class="wrh">비고</div>` + (nl.length ? nl.map(([l, x]) => `<div class="wrn${isRed(x) ? ' r' : ''}">${l ? `<b>${esc(l)}</b>` : ''}${esc(x)}</div>`).join('') : '<div class="wrn e">-</div>') + `</div></div>`;
      });
    } else if (m === 'clean') {
      h += `<div class="sec">기기 청소 주기</div><div class="sub-t">매일 = 하루도 빠짐없이</div>`;
      MG.clean.forEach(([n, rows]) => {
        h += `<div class="mbox"><div class="mname">${esc(n)}</div>` + rows.map(([t, c]) =>
          `<div class="mrow"><span class="mitem">${esc(t)}</span><span class="cyc ${cycCls(c)}">${esc(c)}</span></div>`).join('') + `</div>`;
      });
    } else if (m === 'parts') {
      h += `<div class="sec">소모품 교체 주기</div><div class="sub-t">규격을 확인하고 주기에 맞춰 미리 재고를 준비하세요</div>`;
      MG.parts.forEach(([n, rows]) => {
        h += `<div class="mbox"><div class="mname">${esc(n)}</div>` + rows.map(([t, s, c]) =>
          `<div class="mrow"><span class="mitem">${esc(t)}${s ? `<span class="mspec">${esc(s)}</span>` : ''}</span><span class="cyc">${esc(c)}</span></div>`).join('') + `</div>`;
      });
    } else {
      h += `<div class="sec">청소·교체 동영상</div><div class="sub-t">누르면 새 창에서 영상이 열려요</div>`;
      MG.videos.forEach(([g, list]) => {
        h += `<div class="mname" style="padding:6px 2px">${esc(g)}</div>` + list.map(([t, d, u]) =>
          `<a class="vbtn" href="${u}" target="_blank" rel="noopener"><span class="vplay">▶</span><span class="vtxt"><b>${esc(t)}</b><span>${esc(d)}</span></span></a>`).join('');
      });
    }
    return h + `<div class="ver">앱 버전 ${APP_VERSION}</div>`;
  }
  const MODES = ['open', 'close', 'clean', 'parts', 'video'];
  const $list = document.getElementById('list'), $hdr = document.querySelector('header');
  const fixPad = () => { document.documentElement.style.scrollPaddingTop = ($hdr.offsetHeight + 8) + 'px'; };
  let mode = 'clean';
  try { const m = localStorage.getItem('oozy-store-mode'); if (MODES.includes(m)) mode = m; } catch (e) {}
  function draw() { const y = window.scrollY; $list.innerHTML = html(mode); fixPad(); window.scrollTo(0, y); }
  function setMode(m) {
    mode = m; try { localStorage.setItem('oozy-store-mode', m); } catch (e) {}
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
    $list.innerHTML = html(m); fixPad(); window.scrollTo(0, 0);
    if (m === 'open' || m === 'close') loadDay(true);
  }
  document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setMode(t.dataset.m); });
  function toastMsg(m) {
    let t = document.getElementById('stToast');
    if (!t) { t = document.createElement('div'); t.id = 'stToast'; document.body.appendChild(t);
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231f1c;color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;z-index:60;max-width:90vw;text-align:center;line-height:1.4'; }
    t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3200);
  }
  // 체크 / 해제 — 서버에 저장해 모든 직원이 함께 봄
  async function toggleRow(r) {
    const id = r.dataset.id, kind = r.dataset.kind;
    if (!id || !kind || r.classList.contains('busy')) return;
    if (!DAY) { toastMsg('아직 불러오지 못했습니다. 잠시 후 다시 눌러주세요.'); loadDay(true); return; }
    const on = !chk(kind, id);
    r.classList.add('busy');
    try {
      const j = await api('/store/check', { date: DAY.date, kind, item: id, title: r.dataset.title || '', on });
      const key = kind + ':' + id;
      if (on) DAY.items[key] = { title: r.dataset.title || '', name: j.by.name, color: j.by.color, at: j.at };
      else delete DAY.items[key];
      draw();
    } catch (e) { r.classList.remove('busy'); toastMsg(e.message); }
  }
  $list.addEventListener('click', e => {
    if (e.target.closest('#recBtn')) { openRecords(); return; }
    const r = e.target.closest('.wrow'); if (r) toggleRow(r);
  });
  $list.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const r = e.target.closest('.wrow'); if (r) { e.preventDefault(); toggleRow(r); } });
  // ---------- 기록 보기: 달력에서 날짜를 고르면 그날 누가 무엇을 했는지 ----------
  let RMONTH = today().slice(0, 7), RDAY = today(), RDAYS = {};
  function openRecords() {
    const bg = document.createElement('div'); bg.className = 'rbg';
    bg.innerHTML = `<div class="rmod"><div class="rtop"><b>오픈 · 마감 기록</b><button id="rClose">닫기</button></div>
      <div class="rnav"><button id="rPrev">◀</button><b id="rLab"></b><button id="rNext">▶</button></div>
      <div class="rcal" id="rCal"></div><div class="rlist" id="rList"></div></div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if (e.target === bg) bg.remove(); };
    bg.querySelector('#rClose').onclick = () => bg.remove();
    bg.querySelector('#rPrev').onclick = () => shiftMonth(-1);
    bg.querySelector('#rNext').onclick = () => shiftMonth(1);
    RMONTH = today().slice(0, 7); RDAY = today();
    loadMonth();
  }
  function shiftMonth(k) {
    const [y, m] = RMONTH.split('-').map(Number), d = new Date(y, m - 1 + k, 1);
    RMONTH = d.getFullYear() + '-' + pad(d.getMonth() + 1); loadMonth();
  }
  async function loadMonth() {
    const lab = document.getElementById('rLab'), cal = document.getElementById('rCal'); if (!lab || !cal) return;
    const [y, m] = RMONTH.split('-').map(Number);
    lab.textContent = `${y}년 ${m}월`;
    cal.innerHTML = '<div class="rempty" style="grid-column:1/-1">불러오는 중...</div>';
    try { const j = await api('/store/days?month=' + RMONTH); RDAYS = j.days || {}; }
    catch (e) { RDAYS = {}; if (document.getElementById('rCal') === cal) cal.innerHTML = `<div class="rempty" style="grid-column:1/-1">${esc(e.message)}</div>`; return; }
    if (document.getElementById('rCal') !== cal) return;
    drawCal();
    if (RDAY.slice(0, 7) !== RMONTH) { RDAY = ''; document.getElementById('rList').innerHTML = '<div class="rempty">날짜를 누르면 그날 기록이 나옵니다.</div>'; }
    else loadRDay();
  }
  function drawCal() {
    const [y, m] = RMONTH.split('-').map(Number);
    const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(), t = today();
    let h = DOW.map(d => `<div class="rdow">${d}</div>`).join('') + '<div></div>'.repeat(first.getDay());
    for (let d = 1; d <= days; d++) {
      const key = `${RMONTH}-${pad(d)}`, r = RDAYS[key];
      h += `<button class="rd${key === RDAY ? ' on' : ''}${key === t ? ' today' : ''}" data-rd="${key}">
        <span class="rn">${d}</span><span class="rdots">${r ? r.who.slice(0, 6).map(w => `<i style="background:${esc(w.color)}"></i>`).join('') : ''}</span></button>`;
    }
    const cal = document.getElementById('rCal'); cal.innerHTML = h;
    cal.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => { RDAY = b.dataset.rd; drawCal(); loadRDay(); });
  }
  async function loadRDay() {
    const box = document.getElementById('rList'); if (!box || !RDAY) return;
    box.innerHTML = '<div class="rempty">불러오는 중...</div>';
    let j; try { j = await api('/store/check?date=' + RDAY); } catch (e) { if (document.getElementById('rList') === box) box.innerHTML = `<div class="rempty">${esc(e.message)}</div>`; return; }
    if (document.getElementById('rList') !== box) return;
    const rows = Object.entries(j.items).map(([k, v]) => ({ kind: k.split(':')[0], ...v })).sort((a, b) => a.at - b.at);
    const sec = (kind, name) => {
      const list = rows.filter(r => r.kind === kind);
      if (!list.length) return `<h4>${name}</h4><div class="rempty" style="padding:6px 2px">기록 없음</div>`;
      return `<h4>${name} <span style="font-weight:400;color:var(--muted);font-size:13px">${list.length}건</span></h4>` + list.map(r =>
        `<div class="rli"><span class="rt">${esc(r.title || '-')}</span><span class="rw" style="background:${esc(r.color)};color:${onC(r.color)}">${esc(r.name)}</span><span class="rat">${hhmm(r.at)}</span></div>`).join('');
    };
    box.innerHTML = `<b style="font-size:16px">${dlabel(RDAY)}</b>` + sec('open', '오픈 확인') + sec('close', '마감 확인');
  }
  // 다른 사람이 체크한 내용을 가져옴
  const refresh = () => { if (document.visibilityState === 'visible' && (mode === 'open' || mode === 'close')) loadDay(true); };
  document.addEventListener('visibilitychange', refresh);
  setInterval(refresh, 60000);
  window.addEventListener('resize', fixPad);
  let fs = 22;
  try { const v = parseInt(localStorage.getItem('oozy-fs'), 10); if (v >= 16 && v <= 36) fs = v; } catch (e) {}
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); fixPad(); try { localStorage.setItem('oozy-fs', fs); } catch (e) {} };
  document.getElementById('up').onclick = () => { fs = Math.min(36, fs + 2); applyFs(); };
  document.getElementById('dn').onclick = () => { fs = Math.max(16, fs - 2); applyFs(); };
  applyFs();
  setMode(mode);
})();
</script>
</body>
</html>
