<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우지커피 매장관리</title>
<meta name="app-version" content="2026-10-20.1">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2E3B21; --green2:#3E4E2C; --butter:#F2E66B; --paper:#FBFAF4; --card:#FFFFFF;
  --ink:#1E2318; --muted:#6B7160; --line:#E2E0D2; --hot:#C23B22; --ice:#2563A8; --etc:#4F6B2E;
  --amt-bg:#FFF4A8; --act:#B4531A; --less-bg:#F1F5E9;
  --fs:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151912; --card:#1E2419; --ink:#ECEFE4; --muted:#A3AA96; --line:#323A2A;
    --hot:#FF7A5C; --ice:#7DB4F0; --etc:#A9C97E; --amt-bg:#4A4416; --act:#F0A060; --less-bg:#26301D;
  }
}
:root[data-theme="dark"]{
  --paper:#151912; --card:#1E2419; --ink:#ECEFE4; --muted:#A3AA96; --line:#323A2A;
  --hot:#FF7A5C; --ice:#7DB4F0; --etc:#A9C97E; --amt-bg:#4A4416; --act:#F0A060; --less-bg:#26301D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:#fff;
  padding:12px 14px 12px;box-shadow:0 2px 0 var(--butter)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;flex:1;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{background:transparent;color:#fff;border:1.5px solid #6E7E5A;border-radius:8px;font:inherit;font-size:16px;
  font-weight:600;padding:6px 10px;min-height:40px}
.tab.on{background:var(--butter);color:var(--green);border-color:var(--butter)}
.top{flex-wrap:wrap}
@media (max-width:440px){.brand{font-size:14px}.tab{padding:5px 7px;font-size:14px;min-height:38px}.sz{min-width:34px;padding:4px 6px;font-size:14px;min-height:38px}.top{gap:4px}.tabs{gap:3px}}
@media (max-width:430px){.brand b{display:none}}
.mg-jump{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}
.mbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 16px 10px;margin-bottom:10px}
.mname{font-weight:700;color:var(--etc);font-size:.9em;padding:8px 0 2px}
.mrow{display:flex;align-items:flex-start;gap:10px;border-top:1px dashed var(--line);padding:8px 0}
.mrow:first-of-type{border-top:0}
.mitem{flex:1;font-weight:600;font-size:.85em;line-height:1.4}
.mspec{display:block;font-weight:400;color:var(--muted);font-size:.8em;margin-top:2px}
.cyc{flex:none;font-size:15px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--less-bg);color:var(--etc);text-align:center;max-width:46%}
.cyc.d{background:var(--hot);color:#fff}.cyc.w{background:var(--ice);color:#fff}.cyc.m{background:var(--etc);color:#fff}
.sub-t{font-size:15px;color:var(--muted);margin:-6px 2px 10px}
.vbtn{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.vbtn:active{border-color:var(--green)}
.vplay{flex:none;width:46px;height:46px;border-radius:50%;background:var(--hot);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.vtxt{flex:1;line-height:1.35}
.vtxt b{display:block;font-size:.9em}
.vtxt span{font-size:15px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.grid.sub{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding-top:10px;border-top:2px solid var(--green)}
.gbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:600;
  padding:10px 4px;border-radius:10px;line-height:1.25;word-break:keep-all;min-height:48px}
.grid.sub .gbtn{font-size:16px;text-align:left;padding:10px 12px}
.gbtn.on{background:var(--green);color:var(--butter);border-color:var(--green)}
.detail{background:var(--card);border:2px solid var(--green);border-radius:14px;padding:12px 16px 16px;margin-top:4px}
.dhead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
.dname{font-weight:700;font-size:1.3em;line-height:1.25}
.back{border:1.5px solid var(--green);background:transparent;color:var(--green);font:inherit;font-size:16px;font-weight:600;
  border-radius:20px;padding:4px 12px;min-height:36px}
:root[data-theme="dark"] .back{color:var(--butter);border-color:var(--butter)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{color:var(--butter);border-color:var(--butter)}}
.sec{font-size:1.1em;font-weight:700;color:var(--green);border-bottom:3px solid var(--butter);margin:26px 2px 10px;padding-bottom:4px}
:root[data-theme="dark"] .sec{color:var(--butter)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec{color:var(--butter)}}
.brand span{color:var(--butter)}
@media (max-width:440px){.brand span{display:none}.homebtn{padding:0 7px}}
@media (max-width:380px){.homebtn .ht{display:none}}
.homebtn{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 9px;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.sz{background:var(--green2);color:#fff;border:0;border-radius:8px;font:inherit;font-size:16px;
  font-weight:600;padding:6px 12px;min-width:44px;min-height:40px}
.searchwrap{position:relative}
#q{width:100%;font:inherit;font-size:30px;font-weight:700;color:var(--butter);background:var(--green2);
  border:2px solid transparent;border-radius:12px;padding:10px 54px 10px 16px;outline:none;caret-color:var(--butter)}
#q::placeholder{color:#B9C3A8;font-weight:400;font-size:22px}
#q:focus{border-color:var(--butter)}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;
  font-size:30px;width:44px;height:44px;line-height:1;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;
  font-size:15px;font-weight:600;padding:7px 12px;border-radius:20px;white-space:nowrap}
.chip.on{background:var(--green);color:var(--butter);border-color:var(--green)}
main{max-width:860px;margin:0 auto;padding:8px 12px 60px}
.count{color:var(--muted);font-size:15px;margin:6px 4px 10px}
.empty{color:var(--muted);font-size:18px;padding:24px 6px;line-height:1.7}
.empty b{color:var(--ink)}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.item.open{border-color:var(--green)}
.head{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:12px 16px;
  display:flex;align-items:baseline;gap:10px;cursor:pointer}
.name{font-weight:700;font-size:1.15em;line-height:1.3}
.cat{color:var(--muted);font-size:14px;margin-left:auto;white-space:nowrap}
.body{display:none;padding:0 16px 16px}
.item.open .body{display:block}
.info{font-size:15px;color:var(--muted);margin:-4px 0 8px}
.notice{font-size:15px;background:var(--amt-bg);color:var(--hot);border-radius:8px;padding:6px 10px;margin:0 0 10px;font-weight:600}
.row{border-top:1px dashed var(--line);padding:12px 0 6px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.tag{font-size:15px;font-weight:700;color:#fff;background:var(--etc);border-radius:6px;padding:3px 8px;
  align-self:start;margin-top:4px;white-space:nowrap}
.tag.HOT{background:var(--hot)} .tag.ICE{background:var(--ice)}
.tag.light{background:var(--green);color:var(--butter);border:1.5px solid var(--butter)}
.lines{margin:0;padding:0;list-style:none}
.lines li{padding:2px 0 2px 1.1em;text-indent:-1.1em}
.lines li::before{content:"+";color:var(--muted);display:inline-block;width:1.1em;text-indent:0;font-weight:700}
.lines li:first-child::before{content:"";}
.amt{font-weight:700}
.act{color:var(--act);font-weight:700}
.cr{color:var(--hot);font-weight:700}.cb{color:var(--ice);font-weight:700}
.legend{font-size:14px;color:var(--muted);margin:0 0 8px}.legend .cr,.legend .cb{font-size:14px}
.warn{color:var(--hot);font-weight:600}
.less{grid-column:2;background:var(--less-bg);border-radius:8px;padding:6px 10px;font-size:.85em;margin-top:4px}
.less b{color:var(--etc)}
.note{font-size:.8em;color:var(--hot);margin-top:8px;font-weight:600}
.rnote{grid-column:2;margin-top:4px}
.vtop{display:flex;align-items:flex-start;gap:12px}.vtop-l{flex:1;min-width:0}
.qr{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;margin:-6px 0 10px;
  text-decoration:none;color:var(--hot);font-size:14px;font-weight:700;line-height:1}
.qr svg{width:84px;height:84px;display:block;border:2px solid var(--hot);border-radius:6px;padding:3px;background:#fff}
.upd{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;align-items:center;gap:10px;background:var(--hot);color:#fff;border-radius:14px;padding:12px 14px;
  font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:600px;margin:0 auto}
.upd[hidden]{display:none}
.upd span{flex:1}
.upd button{flex:none;background:#fff;color:var(--hot);border:0;border-radius:10px;font:inherit;font-size:16px;padding:10px 14px;min-height:44px}
.ver{font-size:13px;color:var(--muted);text-align:center;margin:24px 0 8px}
.inote{color:var(--hot);font-weight:600;font-size:.8em}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.item.open .body{animation:fade .15s ease-out}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="upd" class="upd" role="status" hidden>
  <span>새 내용으로 업데이트되었어요</span>
  <button id="updBtn">지금 새로고침</button>
</div>
<header>
  <div class="top">
    <a class="homebtn" href="./" aria-label="홈으로">🏠<span class="ht"> 홈</span></a>
    <div class="brand"><b>OOZY </b><span>매장관리</span></div>
    <div class="tabs" id="tabs">
      <button class="tab" data-m="clean">청소</button>
      <button class="tab" data-m="parts">소모품</button>
      <button class="tab" data-m="video">동영상</button>
    </div>
    <button class="sz" id="dn" aria-label="글씨 작게">가−</button>
    <button class="sz" id="up" aria-label="글씨 크게">가+</button>
  </div>
</header>
<main>
  <div id="list"></div>
</main>
<script>
(function(){
  const APP_VERSION = '2026-10-20.1';
  let latest = null;
  async function checkUpdate() {
    if (!/^https?:/.test(location.protocol)) return;
    try {
      const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
      if (m && m[1] !== APP_VERSION) { latest = m[1]; document.getElementById('upd').hidden = false; }
    } catch (e) {}
  }
  document.getElementById('updBtn').onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(latest || Date.now()));
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setInterval(checkUpdate, 30 * 60 * 1000);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- 관리 (청소·소모품) ----------
  const MG = {
    parts: [
      ['커피 머신', [['샤워스크린','60mm','3~6개월'],['가스켓','내경 72×56×8mm · 외경 73×57×8.5mm','3~6개월'],['포터필터 바스켓','2샷 바스켓(70×24.5) · 57~58mm 탬퍼 전용','파손·마모 시']]],
      ['그라인더', [['상부/하부 칼날','83mm 플랫 버','6개월 / 마모 시']]],
      ['블렌더', [['블렌더 볼 칼날','','마모 시 교체'],['커플링','','마모 시 교체']]],
      ['정수 필터', [['전처리 하우징 필터','','1~2개월 (최대 3개월)'],['4FC 필터','','3개월 권장'],['IMF 필터','','약품 소진 시 (6개월 권장)'],['2FC 필터 (제빙기용)','','3개월 권장']]],
      ['아이스크림 기계', [['비터가스켓, 스크래퍼, 피스톤 O링','','3~6개월']]]
    ],
    clean: [
      ['커피 머신', [['그룹헤드 약품 청소','매일'],['포터필터(바스켓) 세척','매일'],['스팀봉 세척','매일'],['샤워스크린/가스켓, 스팀노즐 분해 청소','주 1회'],['포터필터(바스켓) 약품 청소','주 1회'],['포터필터 스파웃 약품 청소','월 1회']]],
      ['그라인더', [['호퍼통 세척','매일'],['그라인더 약품 청소','주 1회'],['그라인더 칼날 분해 청소','월 1회']]],
      ['제빙기', [['제빙기 약품 청소','주 1회']]],
      ['냉장/냉동고', [['문짝, 틈새 청소','매일'],['내부 물기 제거','매일'],['내부 성에 제거 / 칸막이 세척','주 1회']]],
      ['아이스크림 기계', [['분해 청소','매일']]],
      ['토핑 냉장고', [['밧드(토핑용) 뚜껑 세척','매일'],['토핑 냉장고 내부 물기 제거','매일']]],
      ['블렌더', [['블렌더 볼 세제 청소','매일'],['블렌더 케이스 분리 세척','매일'],['블렌더 칼날 분해 청소','주 1회']]],
      ['전자레인지', [['오븐판, 받침대, 유리쟁반 세척','매일'],['내부 세척 및 정리','매일']]],
      ['핫워터 디스펜서', [['온수탭 스케일 제거','월 1회']]]
    ],
    videos: [
      ['커피 머신', [['커피머신 마감 청소법','매일 마감','http://m.site.naver.com/1bzPy'],['포터필터 마감 청소법','매일 마감','http://m.site.naver.com/1bzOE'],['스팀완드 청소법 및 소모품 교체법','가스켓 · 샤워스크린 3~6개월','http://m.site.naver.com/1bzOT']]],
      ['블렌더', [['블렌더볼 청소법','매일 세척','http://m.site.naver.com/1bzOZ'],['블렌더볼 칼날 분해 및 조립법','주 1회 분해 청소','https://m.site.naver.com/1Xs4X'],['블렌더 커플링 분해 및 조립법','마모 시 교체','https://m.site.naver.com/20x6j']]],
      ['아이스크림 기계 · 제빙기', [['아이스크림 기계 사용 가이드','비터·가스켓 분해 및 장착','http://m.site.naver.com/1bzQo'],['제빙기 사용 가이드','세척 및 제빙 작동','http://m.site.naver.com/1bzOw']]],
      ['정수 필터', [['전처리 필터 교체법','1~2개월 (최대 3개월 권장)','https://m.site.naver.com/1XzeA'],['4FC 필터 교체법','3개월 권장','https://m.site.naver.com/1XrgU'],['IMF 필터 교체법','약품 소진 시 (6개월 권장)','https://m.site.naver.com/1XrMF'],['2FC 필터 교체법','3개월 권장 (제빙기용)','https://m.site.naver.com/1Xzoi']]]
    ]
  };
  const cycCls = s => s.startsWith('매일') ? 'd' : s.startsWith('주') ? 'w' : s.startsWith('월') ? 'm' : '';

  function html(m) {
    let h = '';
    if (m === 'clean') {
      h += `<div class="sec">기기 청소 주기</div><div class="sub-t">매일 = 하루도 빠짐없이</div>`;
      MG.clean.forEach(([n, rows]) => {
        h += `<div class="mbox"><div class="mname">${esc(n)}</div>` + rows.map(([t, c]) =>
          `<div class="mrow"><span class="mitem">${esc(t)}</span><span class="cyc ${cycCls(c)}">${esc(c)}</span></div>`).join('') + `</div>`;
      });
    } else if (m === 'parts') {
      h += `<div class="sec">소모품 교체 주기</div><div class="sub-t">규격을 확인하고 주기에 맞춰 미리 재고를 준비하세요</div>`;
      MG.parts.forEach(([n, rows]) => {
        h += `<div class="mbox"><div class="mname">${esc(n)}</div>` + rows.map(([t, s, c]) =>
          `<div class="mrow"><span class="mitem">${esc(t)}${s ? `<span class="mspec">${esc(s)}</span>` : ''}</span><span class="cyc">${esc(c)}</span></div>`).join('') + `</div>`;
      });
    } else {
      h += `<div class="sec">청소·교체 동영상</div><div class="sub-t">누르면 새 창에서 영상이 열려요</div>`;
      MG.videos.forEach(([g, list]) => {
        h += `<div class="mname" style="padding:6px 2px">${esc(g)}</div>` + list.map(([t, d, u]) =>
          `<a class="vbtn" href="${u}" target="_blank" rel="noopener"><span class="vplay">▶</span><span class="vtxt"><b>${esc(t)}</b><span>${esc(d)}</span></span></a>`).join('');
      });
    }
    return h + `<div class="ver">앱 버전 ${APP_VERSION}</div>`;
  }
  const $list = document.getElementById('list'), $hdr = document.querySelector('header');
  const fixPad = () => { document.documentElement.style.scrollPaddingTop = ($hdr.offsetHeight + 8) + 'px'; };
  let mode = 'clean';
  try { const m = localStorage.getItem('oozy-store-mode'); if (['clean','parts','video'].includes(m)) mode = m; } catch (e) {}
  function setMode(m) {
    mode = m; try { localStorage.setItem('oozy-store-mode', m); } catch (e) {}
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
    $list.innerHTML = html(m); fixPad(); window.scrollTo(0, 0);
  }
  document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setMode(t.dataset.m); });
  window.addEventListener('resize', fixPad);
  let fs = 22;
  try { const v = parseInt(localStorage.getItem('oozy-fs'), 10); if (v >= 16 && v <= 36) fs = v; } catch (e) {}
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); fixPad(); try { localStorage.setItem('oozy-fs', fs); } catch (e) {} };
  document.getElementById('up').onclick = () => { fs = Math.min(36, fs + 2); applyFs(); };
  document.getElementById('dn').onclick = () => { fs = Math.max(16, fs - 2); applyFs(); };
  applyFs();
  setMode(mode);
})();
</script>
</body>
</html>
