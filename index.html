<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3a29">
<title>우지커피 용강점</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b3a29'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<style>
/* 매장 홈: 위에 매장 이름과 오픈 날짜, 아래에 큰 앱 버튼. 알바용 앱 먼저, 사장님 앱은 PIN 확인 후 */
:root{--bg:#f5f2ee;--card:#fff;--ink:#231f1c;--sub:#7a726b;--line:#e5dfd8;--brand:#5b3a29;--cream:#efe6dc;--ok:#1d8a4b;--bad:#d32f2f}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
header{background:var(--brand);color:#fff;border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.07)}
header .eyebrow{font-size:12px;letter-spacing:2px;opacity:.75}
header h1{margin:4px 0 10px;font-size:24px;letter-spacing:-.5px;display:flex;align-items:center;gap:12px;font-size:28px;line-height:1.1}
header h1 .sym{height:64px;width:auto;display:block;object-fit:contain}
header .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
header .pill{background:rgba(255,255,255,.15);border-radius:99px;padding:4px 10px}
header .pill b{font-variant-numeric:tabular-nums}
h2{font-size:14px;color:var(--sub);margin:22px 4px 10px;font-weight:600;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#staffApps{margin-top:18px;grid-template-columns:repeat(3,1fr)}
#staffApps .app{padding:14px 10px;min-height:96px}#staffApps .app b{font-size:16px}
.app{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;min-height:104px;position:relative;transition:transform .08s}
.app:active{transform:scale(.97)}
.app .cover{position:absolute;inset:0;border-radius:16px;z-index:0}
.app .cover:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app .subs{position:relative;z-index:1}
.app .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.app b{font-size:17px;word-break:keep-all;line-height:1.3}
.app span{font-size:12.5px;color:var(--sub);line-height:1.4}
.app.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:12px}
.app.wide .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.app.off{opacity:.55;border-style:dashed}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.subs a{font-size:12px;text-decoration:none;color:var(--brand);background:var(--cream);border-radius:99px;padding:4px 10px}
.lock{width:100%;border:1.5px dashed #c8b9aa;background:transparent;color:var(--brand);border-radius:16px;padding:16px;font-size:15px;font-weight:600;cursor:pointer}
.owner-bar{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
.owner-bar h2{margin:0}
.owner-bar button{border:0;background:none;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:360px}
.modal h3{margin:0 0 6px}
.modal input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:20px;letter-spacing:6px;text-align:center;margin:10px 0}
.modal .btns{display:flex;gap:8px;margin-top:6px}
.modal .btns button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;cursor:pointer}
.modal .btns .pri{background:var(--brand);color:#fff}
.modal .btns .sec{background:#ece6df}
.err{color:var(--bad);font-size:13px;min-height:18px}
.tip{margin-top:26px;font-size:12.5px;color:var(--sub);line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tip b{color:var(--ink)}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
.qrcard{margin-top:18px;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.qrcard img{width:96px;height:96px;flex:none;border-radius:6px}
.qrcard b{display:block;font-size:15px;margin-bottom:3px}
.qrcard span{font-size:12.5px;color:var(--sub);line-height:1.5}
.qrbig{position:fixed;inset:0;background:rgba(30,20,14,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.qrbig[hidden]{display:none}
.qrin{background:#fff;border-radius:22px;padding:22px 22px 16px;text-align:center;width:min(360px,100%)}
.qrin img{width:100%;height:auto;image-rendering:pixelated;display:block}
.qrin b{display:block;font-size:20px;margin-top:8px;color:var(--brand)}
.qrin span{display:block;font-size:14px;color:var(--ink);margin-top:2px}
.qrin small{display:block;font-size:12px;color:var(--sub);margin-top:10px}

.who{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}
.who .tagad{font-size:11px;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;margin-left:4px;vertical-align:2px}
.whob{display:flex;gap:6px}.whob button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.apps{margin-top:10px;grid-template-columns:repeat(3,1fr)}.apps .app{padding:14px 10px;min-height:96px}.apps .app b{font-size:16px}
.denied{margin-top:10px;background:#fde3e3;color:#a12020;border-radius:12px;padding:10px 12px;font-size:14px}
.loginbox{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.loginbox .lt{display:block;font-size:19px;margin-bottom:6px}
.loginbox label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px;box-sizing:border-box}
.loginbox .big{width:100%;margin-top:6px;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer}
.loginbox .lnote{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.loginbox .practice{display:block;text-align:center;margin-top:14px;font-size:13px;color:#b25e00;text-decoration:none;border:1.5px dashed #ffb74d;border-radius:12px;padding:9px}
.admcard{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.perm{border-collapse:collapse;width:100%;font-size:13px}.perm th{font-size:11.5px;color:var(--sub);font-weight:600;padding:6px 3px;word-break:keep-all;border-bottom:1px solid var(--line)}
.perm td{text-align:center;padding:8px 3px;border-bottom:1px solid var(--line)}.perm td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.perm input{width:20px;height:20px;accent-color:var(--brand)}
#toastH{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231f1c;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}#toastH.show{opacity:1}
.qrcard[hidden]{display:none}
.muted{color:var(--sub)}
header h1 .ver{font-size:12px;font-weight:500;opacity:.7;letter-spacing:0;align-self:flex-end;margin:0 0 4px -4px}
.admlink{display:block;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}.admlink small{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:6px}
</style>
</head>

// ===== 설정: 앱 주소는 여기서 바꾸세요 =====
const CFG = {
  VERSION: '10.25.-v.21',                                   // 전체 버전 (여기에만 표시): 홈·근무·매장관리·레시피·카페운영 중 하나라도 고치면 그날 날짜로 번호를 올림
  OPEN_DATE: '2026-10-21',                                   // 오픈일
  API: 'https://oozy-work.kghwang1.workers.dev',             // 근무관리 Worker (사장님 PIN 확인용)
  HOURS: '07:00~22:00',
  APPS: [   // key: 서버(worker.js)의 APP_KEYS 와 같아야 함
    { key: 'work', name: '근무 · 급여', ic: '🕐', bg: '#e3f1e8', url: 'https://kghwang1.github.io/cafe/oozy-work.html' },
    { key: 'store', name: '매장관리', ic: '🧽', bg: '#e6f3f5', url: 'https://kghwang1.github.io/cafe/oozy-store.html' },
    { key: 'recipe', name: '레시피', ic: '📖', bg: '#fbe9dc', url: 'https://kghwang1.github.io/cafe/oozy-recipe.html' },
    { key: 'ledger', name: '카페 운영', ic: '💰', bg: '#fff1d6', url: 'https://kghwang1.github.io/cafe/oozy-ledger.html' },
    { key: 'coffee', name: '커피회사', ic: '📊', bg: '#e6ecfa', url: 'https://kghwang1.github.io/coffee-board/',
      subs: [['장비 견적', 'https://kghwang1.github.io/coffee-board/equipment.html'], ['매장 지도', 'https://kghwang1.github.io/coffee-board/map.html']] },
  ],
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
try { localStorage.removeItem('oozyHomeOwner'); } catch (e) { }   // 예전 사장님 메뉴 기억 지움

$('#ver').textContent = CFG.VERSION;
// 날짜 · 오픈 D-day
(function () {
  const now = new Date(), d = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
  $('#today').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 (${d})`;
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), o = new Date(CFG.OPEN_DATE + 'T00:00');
  const diff = Math.round((o - t0) / 864e5);
  $('#dday').innerHTML = diff > 0 ? `오픈 <b>D-${diff}</b>` : diff === 0 ? '<b>오늘 오픈!</b>' : `오픈 <b>${-diff + 1}일째</b>`;
  $('#hours').textContent = `영업 ${CFG.HOURS}`;
})();

function card(a) {
  const off = !a.url;
  const subs = a.subs ? `<div class="subs">${a.subs.map(([n, u]) => `<a href="${esc(u)}">${esc(n)}</a>`).join('')}</div>` : '';
  // 카드 전체를 덮는 링크 + 그 위에 작은 바로가기 (링크 안에 링크를 넣지 않음)
  return `<div class="app${off ? ' off' : ''}"><a class="cover" ${off ? 'href="#" data-missing="1"' : `href="${esc(a.url)}"`} aria-label="${esc(a.name)}"></a>
    <div class="ic" style="background:${a.bg}">${a.ic}</div><b>${esc(a.name)}</b>${subs}</div>`;
}
// ===== 로그인 (이름 + 비밀번호) — 한 번 로그인한 기기는 바로 들어감 =====
const TK = 'oozyToken', AK = 'oozyAuth';
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } } };
let AUTH = null; try { AUTH = JSON.parse(ls.get(AK) || 'null'); } catch (e) { }
const TOKEN = () => ls.get(TK);
async function call(path, body) {
  const r = await fetch(CFG.API + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN() || '' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { signOut(true); throw new Error('다시 로그인해 주세요.'); }
  if (!r.ok) throw new Error(j.error || '오류가 발생했습니다.');
  return j;
}
function signOut(silent) { ls.set(TK, null); ls.set(AK, null); AUTH = null; render(); }
const need = new URLSearchParams(location.search).get('need');

function render() {
  $('#qrCard').hidden = !(AUTH && AUTH.role === 'admin');
  if (!AUTH) return renderLogin();
  const list = CFG.APPS.filter(a => AUTH.apps.includes(a.key));
  const deny = need && AUTH && !AUTH.apps.includes(need) ? (CFG.APPS.find(a => a.key === need) || {}).name : '';
  $('#main').innerHTML = `<div class="who"><span><b>${esc(AUTH.name)}</b>님${AUTH.role === 'admin' ? ' <span class="tagad">관리자</span>' : ''}</span>
      <span class="whob">${AUTH.role === 'admin' ? '<button id="admBtn">⚙ 관리</button>' : ''}<button id="outBtn">로그아웃</button></span></div>
    ${deny ? `<div class="denied">「${esc(deny)}」 메뉴는 쓸 수 없습니다. 관리자에게 문의하세요.</div>` : ''}
    <div class="grid apps">${list.map(card).join('') || '<div class="muted">쓸 수 있는 메뉴가 없습니다. 관리자에게 문의하세요.</div>'}</div>
    <div id="admBox"></div>`;
  $('#outBtn').onclick = () => confirmBox('로그아웃', '이 기기에서 로그아웃할까요?\n다음에 들어올 때 이름과 비밀번호를 다시 넣어야 합니다.', async () => {
    try { await call('/auth/logout', {}); } catch (e) { } signOut(); });
  if ($('#admBtn')) $('#admBtn').onclick = () => { const b = $('#admBox'); if (b.innerHTML) { b.innerHTML = ''; return; } renderAdmin(); };
}
function renderLogin() {
  $('#main').innerHTML = `<div class="loginbox"><b class="lt">로그인</b>
    <label>이름</label><input id="lgN" type="text" lang="ko" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="이름">
    <label>비밀번호</label><input id="lgP" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호 (숫자)">
    <div class="err" id="lgE"></div><button class="pri big" id="lgB">로그인</button>
    <div class="lnote">처음 한 번만 로그인하면 이 기기에서는 다음부터 바로 열립니다.</div>
    <a class="practice" href="https://kghwang1.github.io/cafe/oozy-work.html?practice=1">🎓 근무관리 연습하기</a></div>`;
  const go = async () => {
    const name = $('#lgN').value.trim(), pin = $('#lgP').value.trim(), e = $('#lgE');
    if (!name || !pin) { e.textContent = '이름과 비밀번호를 넣으세요'; return; }
    e.textContent = '확인 중...'; $('#lgB').disabled = true;
    try {
      const r = await fetch(CFG.API + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, pin }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { e.textContent = j.error || '로그인하지 못했습니다'; $('#lgB').disabled = false; return; }
      ls.set(TK, j.token); AUTH = { role: j.role, name: j.name, apps: j.apps }; ls.set(AK, JSON.stringify(AUTH)); render();
      const back = need && AUTH.apps.includes(need) && CFG.APPS.find(x => x.key === need); if (back) location.replace(back.url);   // 가려던 메뉴로
    } catch (err) { e.textContent = '서버에 연결하지 못했습니다. 인터넷을 확인하세요'; $('#lgB').disabled = false; }
  };
  $('#lgB').onclick = go; $('#lgP').onkeydown = ev => { if (ev.key === 'Enter') go(); }; $('#lgN').onkeydown = ev => { if (ev.key === 'Enter') $('#lgP').focus(); };
}
// 관리: 직원별로 쓸 수 있는 메뉴 체크
async function renderAdmin() {
  const box = $('#admBox'); box.innerHTML = '<div class="admcard muted">불러오는 중...</div>';
  let staff; try { staff = await call('/admin/staff'); } catch (e) { box.innerHTML = `<div class="admcard err">${esc(e.message)}</div>`; return; }
  const DEF = ['work', 'store', 'recipe'];
  const appsOf = s => s.apps == null ? DEF : String(s.apps).split(',').filter(Boolean);
  box.innerHTML = `<div class="admcard"><b style="font-size:16px">직원별 메뉴 권한</b><div class="muted" style="font-size:12.5px;margin:2px 0 8px">체크하면 그 직원 홈 화면에 메뉴가 보입니다. 바로 저장됩니다.</div>
    <div style="overflow-x:auto"><table class="perm"><tr><th>직원</th>${CFG.APPS.map(a => `<th>${esc(a.name.replace(' · ', '·'))}</th>`).join('')}</tr>
    ${staff.filter(s => s.active).map(s => `<tr><td>${esc(s.name)}</td>${CFG.APPS.map(a => `<td><input type="checkbox" data-sid="${s.id}" data-k="${a.key}" ${appsOf(s).includes(a.key) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${CFG.APPS.length + 1}" class="muted">재직 중인 직원이 없습니다. 근무 · 급여 → 직원 탭에서 추가하세요.</td></tr>`}</table></div>
    <div class="muted" style="font-size:12px;margin-top:8px">직원 이름 · 비밀번호(PIN)는 근무 · 급여 → 직원 탭에서 정합니다.</div></div>
    <a class="admlink" href="https://kghwang1.github.io/cafe/oozy-work.html?tab=bak">💾 백업 받기 <small>근무기록 엑셀 · 전체 백업</small></a>`;
  box.querySelectorAll('[data-sid]').forEach(c => c.onchange = async () => {
    const sid = +c.dataset.sid, apps = [...box.querySelectorAll(`[data-sid="${sid}"]`)].filter(x => x.checked).map(x => x.dataset.k);
    try { await call('/admin/staff/apps', { id: sid, apps }); toastH('저장했습니다'); } catch (e) { c.checked = !c.checked; toastH(e.message); }
  });
}
function toastH(m) { let t = $('#toastH'); if (!t) { t = document.createElement('div'); t.id = 'toastH'; document.body.appendChild(t); } t.textContent = m; t.className = 'show'; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 1800); }
function alertBox(t, m) {
  const bg = document.createElement('div'); bg.className = 'mbg';
  bg.innerHTML = `<div class="modal"><h3>${esc(t)}</h3><div style="color:var(--sub);font-size:14px;white-space:pre-line">${esc(m)}</div><div class="btns" style="margin-top:14px"><button class="pri">확인</button></div></div>`;
  document.body.appendChild(bg); bg.querySelector('button').onclick = () => bg.remove();
}
function confirmBox(t, m, ok) {
  const bg = document.createElement('div'); bg.className = 'mbg';
  bg.innerHTML = `<div class="modal"><h3>${esc(t)}</h3><div style="color:var(--sub);font-size:14px;white-space:pre-line">${esc(m)}</div><div class="btns" style="margin-top:14px"><button class="sec">취소</button><button class="pri">확인</button></div></div>`;
  document.body.appendChild(bg); const [c, o] = bg.querySelectorAll('button'); c.onclick = () => bg.remove(); o.onclick = () => { bg.remove(); ok(); };
}
render();
// 서버에서 권한을 다시 확인 (관리자가 바꾼 권한 반영, 삭제된 직원은 로그아웃)
if (TOKEN()) call('/auth/me').then(j => { AUTH = { role: j.role, name: j.name, apps: j.apps }; ls.set(AK, JSON.stringify(AUTH)); render(); }).catch(() => { });
else if (AUTH) signOut();
</script>
<script>
(function(){
  const big=document.getElementById('qrBig'), card=document.getElementById('qrCard');
  const open=()=>{ big.hidden=false }, close=()=>{ big.hidden=true };
  card.onclick=open; card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open() } };
  big.onclick=close; document.addEventListener('keydown',e=>{ if(e.key==='Escape') close() });
})();
</script>
</body>
</html>
